name: V2 Preview Demo

on:
  push:
    branches:
      - feat/v2-preview-demo-mode
    paths:
      - '04_개발/backend/**'
      - '04_개발/frontend/**'
      - '.github/workflows/v2-preview-demo.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '04_개발/backend/**'
      - '04_개발/frontend/**'
      - '.github/workflows/v2-preview-demo.yml'
  workflow_dispatch:

concurrency:
  group: danjion-v2-preview-demo
  cancel-in-progress: true

permissions:
  contents: read

env:
  WORKER_ENV: preview
  WORKER_NAME: padiem-danjion-api-preview
  WORKER_PREVIEW_ALIAS: v2-demo
  PAGES_PROJECT: padiem-danjion-web-preview
  PAGES_BRANCH: v2-demo
  COMPLEX_SLUG: bangnim-myeongji-roadhill
  SYNTHETIC_BUSINESS_ID: 55555555-5555-4555-8555-555555555551

jobs:
  preview-demo:
    if: github.event_name != 'pull_request' || github.head_ref == 'feat/v2-preview-demo-mode'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DANJION_DATABASE_URL: ${{ secrets.DANJION_PREVIEW_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enforce isolated preview-demo contract
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          test "$branch" = 'feat/v2-preview-demo-mode'
          test "$WORKER_ENV" = 'preview'
          test "$WORKER_NAME" = 'padiem-danjion-api-preview'
          test "$WORKER_NAME" != 'padiem-danjion-api-production'
          test "$PAGES_BRANCH" = 'v2-demo'
          test "$PAGES_BRANCH" != 'main'
          test "$WORKER_PREVIEW_ALIAS" = 'v2-demo'

      - name: Verify non-production runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DANJION_DATABASE_URL; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required preview secret: $key"
              exit 1
            fi
          done
          echo 'Using DANJION_PREVIEW_DATABASE_URL only; production DATABASE_URL is not referenced by this workflow.'

      - name: Install and check backend
        working-directory: 04_개발/backend
        run: |
          npm install --ignore-scripts
          npm run check

      - name: Install and typecheck frontend
        working-directory: 04_개발/frontend
        run: |
          npm install --ignore-scripts
          npm run typecheck

      - name: Prepare Worker preview secret file
        id: worker_secret
        shell: bash
        run: |
          set -euo pipefail
          secret_file="${RUNNER_TEMP}/danjion-v2-demo-worker.env"
          printf 'DATABASE_URL=%s\n' "$DANJION_DATABASE_URL" > "$secret_file"
          chmod 600 "$secret_file"
          echo "secret_file=$secret_file" >> "$GITHUB_OUTPUT"

      - name: Upload isolated Worker preview version
        id: worker
        working-directory: 04_개발/backend
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/v2-demo-worker.log"
          npx wrangler versions upload \
            --env "$WORKER_ENV" \
            --preview-alias "$WORKER_PREVIEW_ALIAS" \
            --secrets-file "${{ steps.worker_secret.outputs.secret_file }}" \
            --message "V2 loginless preview demo ${GITHUB_SHA}" 2>&1 | tee "$log_file"

          worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$log_file" | grep "https://${WORKER_PREVIEW_ALIAS}-" | tail -n 1 || true)"
          if [ -z "$worker_url" ]; then
            worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$log_file" | tail -n 1 || true)"
          fi
          test -n "$worker_url"
          echo "url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Verify Pages project
        shell: bash
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/pages-project.json"
          status="$(curl --silent --show-error -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PAGES_PROJECT}")"
          test "$status" = '200'

      - name: Build V2 loginless preview demo
        working-directory: 04_개발/frontend
        env:
          VITE_UI_VARIANT: v2
          VITE_DATA_MODE: api
          VITE_AUTH_MODE: dev
          VITE_STORAGE_MODE: mock
          VITE_PREVIEW_DEMO_MODE: 'true'
          VITE_API_BASE_URL: ${{ steps.worker.outputs.url }}
          VITE_COMPLEX_SLUG: bangnim-myeongji-roadhill
        run: |
          set -euo pipefail
          npm run build
          grep -R --fixed-strings "$VITE_API_BASE_URL" dist >/dev/null
          grep -R --fixed-strings 'PREVIEW ONLY' dist >/dev/null || true

      - name: Deploy V2 demo Pages branch only
        id: pages
        working-directory: 04_개발/backend
        shell: bash
        run: |
          set -euo pipefail
          test "$PAGES_BRANCH" = 'v2-demo'
          npx wrangler pages deploy ../frontend/dist \
            --project-name="$PAGES_PROJECT" \
            --branch="$PAGES_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="V2 loginless preview demo ${GITHUB_SHA}"
          echo "url=https://${PAGES_BRANCH}.${PAGES_PROJECT}.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Smoke public and synthetic authorization boundaries
        shell: bash
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
          FRONTEND_URL: ${{ steps.pages.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 "$FRONTEND_URL/" >/dev/null

          public_json="$(curl --fail --silent --show-error "$WORKER_URL/api/v1/complexes/$COMPLEX_SLUG/businesses")"
          node - "$public_json" "$SYNTHETIC_BUSINESS_ID" <<'NODE'
          const [payload, businessId] = process.argv.slice(2);
          const parsed = JSON.parse(payload);
          if (!Array.isArray(parsed?.data) || !parsed.data.some((row) => row.id === businessId)) process.exit(1);
          NODE

          resident_json="$(curl --fail --silent --show-error -H 'x-danjion-dev-auth-user: dev-resident-001' "$WORKER_URL/api/v1/me")"
          node - "$resident_json" <<'NODE'
          const parsed = JSON.parse(process.argv[2]);
          if (!parsed?.data?.memberships?.some((row) => row.verification_status === 'verified')) process.exit(1);
          NODE

          resident_contact_status="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            -H 'x-danjion-dev-auth-user: dev-resident-001' \
            "$WORKER_URL/api/v1/complexes/$COMPLEX_SLUG/businesses/$SYNTHETIC_BUSINESS_ID/contact")"
          test "$resident_contact_status" = '200'

          unverified_contact_status="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            -H 'x-danjion-dev-auth-user: dev-unverified-001' \
            "$WORKER_URL/api/v1/complexes/$COMPLEX_SLUG/businesses/$SYNTHETIC_BUSINESS_ID/contact")"
          test "$unverified_contact_status" = '403'

          resident_admin_status="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            -H 'x-danjion-dev-auth-user: dev-resident-001' \
            "$WORKER_URL/api/v1/admin/complexes/$COMPLEX_SLUG/business-applications")"
          test "$resident_admin_status" = '403'

          manager_admin_status="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            -H 'x-danjion-dev-auth-user: dev-manager-001' \
            "$WORKER_URL/api/v1/admin/complexes/$COMPLEX_SLUG/business-applications")"
          test "$manager_admin_status" = '200'

      - name: Smoke application approval and public rediscovery
        shell: bash
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          business_name="단지온 자동검증 ${short_sha}"
          idempotency_key="preview-cycle-${GITHUB_SHA:0:12}"

          payload="$(jq -nc \
            --arg slug "$COMPLEX_SLUG" \
            --arg name "$business_name" \
            '{
              complexSlug: $slug,
              relationType: "resident",
              businessName: $name,
              categoryName: "반찬·식품",
              serviceSummary: "V2 Preview 실제 API·테스트 DB 신청→승인→공개 재노출 자동검증",
              priceText: "시연 10,000원",
              contactMethod: "010-0000-0000",
              serviceArea: "방림명지로드힐 시연 생활권",
              benefitText: "시연 입주민 5% 할인",
              availabilityText: "Preview only"
            }')"

          application_json="$(curl --fail --silent --show-error \
            -X POST \
            -H 'content-type: application/json' \
            -H 'x-danjion-dev-auth-user: dev-resident-001' \
            -H "idempotency-key: $idempotency_key" \
            --data "$payload" \
            "$WORKER_URL/api/v1/me/business-applications")"
          application_id="$(jq -r '.data.id // empty' <<<"$application_json")"
          test -n "$application_id"
          jq -e '.data.status == "pending" or .data.status == "approved"' <<<"$application_json" >/dev/null

          resident_approve_status="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-danjion-dev-auth-user: dev-resident-001' \
            --data '{"status":"approved","reviewNote":"resident must not approve"}' \
            "$WORKER_URL/api/v1/admin/business-applications/$application_id")"
          test "$resident_approve_status" = '403'

          approval_json="$(curl --fail --silent --show-error \
            -X PATCH \
            -H 'content-type: application/json' \
            -H 'x-danjion-dev-auth-user: dev-manager-001' \
            --data '{"status":"approved","reviewNote":"Synthetic V2 preview live-cycle gate"}' \
            "$WORKER_URL/api/v1/admin/business-applications/$application_id")"
          approved_business_id="$(jq -r '.data.approved_business_id // .data.approvedBusinessId // empty' <<<"$approval_json")"
          test -n "$approved_business_id"

          public_after="$(curl --fail --silent --show-error "$WORKER_URL/api/v1/complexes/$COMPLEX_SLUG/businesses")"
          jq -e \
            --arg id "$approved_business_id" \
            --arg name "$business_name" \
            'any(.data[]; .id == $id and .name == $name)' \
            <<<"$public_after" >/dev/null

          echo "application_id=$application_id" >> "$GITHUB_STEP_SUMMARY"
          echo "approved_business_id=$approved_business_id" >> "$GITHUB_STEP_SUMMARY"
          echo "business_name=$business_name" >> "$GITHUB_STEP_SUMMARY"

      - name: Preview demo evidence
        if: success()
        shell: bash
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
          FRONTEND_URL: ${{ steps.pages.outputs.url }}
        run: |
          {
            echo '## DanjiOn V2 loginless preview demo'
            echo
            echo "- V2 demo: $FRONTEND_URL"
            echo "- Worker alias preview: $WORKER_URL"
            echo '- Data: approved non-production Neon child only'
            echo '- Roles: anonymous / verified resident / unverified resident / manager'
            echo '- Anonymous public discovery: PASS'
            echo '- Verified resident private boundary: PASS'
            echo '- Unverified resident contact denial: PASS'
            echo '- Resident admin denial: PASS'
            echo '- Manager admin access: PASS'
            echo '- Resident application write: PASS'
            echo '- Manager approval: PASS'
            echo '- Approved business public rediscovery: PASS'
            echo '- Real login provider: NOT USED'
            echo '- Drive writes: NONE (mock storage in this gate)'
            echo '- Production deployment/database: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
