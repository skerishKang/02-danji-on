name: Cloudflare Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '04_개발/backend/**'
      - '04_개발/frontend/**'
      - '.github/workflows/cloudflare-preview.yml'
  workflow_dispatch:

concurrency:
  group: danjion-cloudflare-track-e-preview
  cancel-in-progress: true

permissions:
  contents: read

env:
  WORKER_ENV: preview
  WORKER_PREVIEW_ALIAS: track-e
  PAGES_PROJECT: padiem-danjion-web-preview
  PAGES_BRANCH: track-e

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DANJION_DATABASE_URL: ${{ secrets.DANJION_PREVIEW_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enforce Track E preview-only branch contract
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          test "$branch" = "feat/live-stack-integration"
          test "${WORKER_ENV}" = "preview"
          test "${PAGES_BRANCH}" = "track-e"
          test "${PAGES_BRANCH}" != "main"
          echo "Track E branch and preview environment contract verified."

      - name: Verify required deployment secrets exist
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DANJION_DATABASE_URL; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required GitHub Actions secret is missing for ${key}."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and DANJION_PREVIEW_DATABASE_URL. The database secret must target Neon child cloudflare-preview-20260808 (br-hidden-frog-azdevrqe), never production."
            exit 1
          fi

      - name: Install backend dependencies
        working-directory: 04_개발/backend
        run: npm install --ignore-scripts

      - name: Backend checks
        working-directory: 04_개발/backend
        run: npm run check

      - name: Install frontend dependencies
        working-directory: 04_개발/frontend
        run: npm install --ignore-scripts

      - name: Frontend typecheck
        working-directory: 04_개발/frontend
        run: npm run typecheck

      - name: Prepare Worker preview secret file
        shell: bash
        run: |
          set -euo pipefail
          secret_file="${RUNNER_TEMP}/danjion-worker-preview.env"
          printf 'DATABASE_URL=%s\n' "${DANJION_DATABASE_URL}" > "$secret_file"
          chmod 600 "$secret_file"
          echo "secret_file=$secret_file" >> "$GITHUB_OUTPUT"
        id: worker_secret

      - name: Upload Worker preview version only
        id: worker
        working-directory: 04_개발/backend
        shell: bash
        run: |
          set -euo pipefail
          log_file="${RUNNER_TEMP}/worker-upload.log"
          npx wrangler versions upload \
            --env "${WORKER_ENV}" \
            --preview-alias "${WORKER_PREVIEW_ALIAS}" \
            --secrets-file "${{ steps.worker_secret.outputs.secret_file }}" \
            --message "Track E preview ${GITHUB_SHA}" 2>&1 | tee "$log_file"

          worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$log_file" | grep "https://${WORKER_PREVIEW_ALIAS}-" | tail -n 1 || true)"
          if [ -z "$worker_url" ]; then
            worker_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$log_file" | tail -n 1 || true)"
          fi
          if [ -z "$worker_url" ]; then
            echo "::error::Wrangler did not report a Worker preview URL."
            exit 1
          fi
          echo "url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "Worker preview: $worker_url"

      - name: Build frontend against Worker preview
        working-directory: 04_개발/frontend
        env:
          VITE_DATA_MODE: api
          VITE_AUTH_MODE: dev
          VITE_STORAGE_MODE: mock
          VITE_API_BASE_URL: ${{ steps.worker.outputs.url }}
          VITE_COMPLEX_SLUG: bangnim-myeongji-roadhill
        run: npm run build

      - name: Verify Worker URL is wired into frontend bundle
        shell: bash
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
        run: |
          set -euo pipefail
          grep -R --fixed-strings "$WORKER_URL" 04_개발/frontend/dist >/dev/null
          echo "Frontend bundle contains the Worker preview base URL."

      - name: Ensure Pages preview project exists
        working-directory: 04_개발/backend
        shell: bash
        run: |
          set -euo pipefail
          project_json="${RUNNER_TEMP}/pages-projects.json"
          npx wrangler pages project list --json > "$project_json"
          if node - "$project_json" "$PAGES_PROJECT" <<'NODE'
          const fs = require('fs');
          const [file, name] = process.argv.slice(2);
          const parsed = JSON.parse(fs.readFileSync(file, 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : (parsed.result || parsed.projects || []);
          process.exit(rows.some((row) => row && row.name === name) ? 0 : 1);
          NODE
          then
            echo "Pages project already exists: $PAGES_PROJECT"
          else
            npx wrangler pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy frontend Pages branch preview only
        id: pages
        working-directory: 04_개발/backend
        shell: bash
        run: |
          set -euo pipefail
          test "$PAGES_BRANCH" = "track-e"
          test "$PAGES_BRANCH" != "main"
          npx wrangler pages deploy ../frontend/dist \
            --project-name="$PAGES_PROJECT" \
            --branch="$PAGES_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Track E preview ${GITHUB_SHA}" 2>&1 | tee "${RUNNER_TEMP}/pages-deploy.log"

          frontend_url="https://${PAGES_BRANCH}.${PAGES_PROJECT}.pages.dev"
          echo "url=$frontend_url" >> "$GITHUB_OUTPUT"
          echo "Frontend preview: $frontend_url"

      - name: Smoke test Worker health and database
        shell: bash
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
        run: |
          set -euo pipefail
          health_json="$(curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$WORKER_URL/api/health")"
          echo "$health_json"
          node - "$health_json" <<'NODE'
          const payload = JSON.parse(process.argv[2]);
          if (payload?.data?.status !== 'ok' || payload?.data?.database !== 'ok') process.exit(1);
          NODE

      - name: Smoke test frontend and CORS
        shell: bash
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
          FRONTEND_URL: ${{ steps.pages.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$FRONTEND_URL/" >/dev/null

          headers="${RUNNER_TEMP}/cors-headers.txt"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 \
            -D "$headers" -o /dev/null \
            -H "Origin: $FRONTEND_URL" \
            "$WORKER_URL/api/health"
          tr -d '\r' < "$headers" | grep -Fqi "access-control-allow-origin: $FRONTEND_URL"

          preflight_headers="${RUNNER_TEMP}/cors-preflight-headers.txt"
          curl --fail --silent --show-error \
            -X OPTIONS -D "$preflight_headers" -o /dev/null \
            -H "Origin: $FRONTEND_URL" \
            -H 'Access-Control-Request-Method: GET' \
            "$WORKER_URL/api/health"
          tr -d '\r' < "$preflight_headers" | grep -Fqi "access-control-allow-origin: $FRONTEND_URL"

      - name: Preview evidence summary
        if: success()
        shell: bash
        env:
          WORKER_URL: ${{ steps.worker.outputs.url }}
          FRONTEND_URL: ${{ steps.pages.outputs.url }}
        run: |
          {
            echo '## DanjiOn Track E Cloudflare preview'
            echo
            echo "- Worker resource: \`padiem-danjion-api-preview\`"
            echo "- Worker preview URL: $WORKER_URL"
            echo "- Pages project: \`$PAGES_PROJECT\`"
            echo "- Frontend preview URL: $FRONTEND_URL"
            echo '- Worker DATABASE_URL: encrypted preview-child secret from `DANJION_PREVIEW_DATABASE_URL`'
            echo '- Preview DB target: `cloudflare-preview-20260808` / `br-hidden-frog-azdevrqe`'
            echo '- Production deployment: NONE'
            echo '- PR merge: NONE'
          } >> "$GITHUB_STEP_SUMMARY"
