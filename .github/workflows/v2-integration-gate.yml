name: Legacy V2 Regression Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '04_개발/frontend/src/v2/**'
      - '04_개발/frontend/src/gateway/**'
      - '04_개발/frontend/src/ui-variant.tsx'
      - '04_개발/frontend/src/main.tsx'
      - '04_개발/frontend/tests/v2/**'
      - '04_개발/frontend/tests/v2-*.spec.ts'
      - '04_개발/frontend/tests/v2-*-contract.mjs'
      - '04_개발/frontend/package.json'
      - '04_개발/frontend/package-lock.json'
      - '04_개발/frontend/tsconfig.json'
      - '04_개발/frontend/playwright.config.ts'
      - '04_개발/frontend/vite.config.ts'
      - '04_개발/frontend/vite.v2-runtime-preview.config.ts'
      - '04_개발/frontend/v2-runtime-preview-sw-stub.ts'
      - '04_개발/scripts/v2-*'
      - '04_개발/docs/v2/**'
      - '.github/workflows/v2-integration-gate.yml'
  workflow_dispatch:

concurrency:
  group: danjion-legacy-v2-regression-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  legacy-v2-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 04_개발/frontend/package.json

      - name: Install frontend dependencies
        working-directory: 04_개발/frontend
        run: npm install --ignore-scripts

      - name: Install Playwright Chromium
        working-directory: 04_개발/frontend
        run: npx playwright install --with-deps chromium

      - name: Run legacy V2 compatibility/regression gate
        working-directory: 04_개발
        env:
          VITE_DATA_MODE: mock
          VITE_AUTH_MODE: dev
          VITE_STORAGE_MODE: mock
          VITE_COMPLEX_SLUG: bangnim-myeongji-roadhill
        run: node scripts/v2-fidelity-gate.mjs --release

      - name: Record integration gate evidence
        if: success()
        run: |
          {
            echo '## DanjiOn Legacy V2 regression gate'
            echo
            echo '- Role: legacy compatibility/regression safety only; NOT current design authority'
            echo '- Unset/invalid variant -> V1: PASS'
            echo '- Gateway isolation: PASS'
            echo '- Legacy V2/React sibling compatibility flow: PASS'
            echo '- Verdict: `LEGACY_V2_REGRESSION_PASS` (underlying script: V2_FIDELITY_GATE_PASS)'
            echo '- Canonical design authority: sibling latest V3 (`frontend/**`) — NOT this workflow'
            echo '- Production readiness: NOT CLAIMED'
          } >> "$GITHUB_STEP_SUMMARY"
