name: QA Environment Provision

on:
  pull_request:
    paths:
      - '.github/workflows/qa-environment-provision.yml'
      - '04_개발/backend/wrangler.jsonc'
      - '04_개발/backend/scripts/qa-migration-gate.mjs'
      - '04_개발/backend/scripts/qa-pages-runtime-bind.mjs'
      - '04_개발/backend/tests/qa-environment-provision-contract.mjs'
  workflow_dispatch:
    inputs:
      expected_main:
        description: 'Exact main SHA authorized for this QA operation'
        required: true
        type: string
      mode:
        description: 'Validate source only or deploy the isolated QA environment'
        required: true
        default: validate
        type: choice
        options:
          - validate
          - deploy_qa
      confirm_qa:
        description: 'Explicitly confirm non-production QA cloud mutation'
        required: true
        default: false
        type: boolean
      provision_synthetic_account:
        description: 'Create or verify the encrypted synthetic QA credential account'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: danjion-qa-environment
  cancel-in-progress: false

jobs:
  source-contract:
    name: QA environment source safety contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify isolated QA environment contract
        run: node 04_개발/backend/tests/qa-environment-provision-contract.mjs

  deploy-qa:
    name: Deploy isolated QA Worker and Pages
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy_qa' && inputs.confirm_qa }}
    runs-on: ubuntu-latest
    environment: qa
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.DANJION_QA_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DANJION_QA_CLOUDFLARE_ACCOUNT_ID }}
      DANJION_QA_DATABASE_URL: ${{ secrets.DANJION_QA_DATABASE_URL }}
      DANJION_QA_BETTER_AUTH_SECRET: ${{ secrets.DANJION_QA_BETTER_AUTH_SECRET }}
      DANJION_QA_EMAIL: ${{ secrets.DANJION_QA_EMAIL }}
      DANJION_QA_PASSWORD: ${{ secrets.DANJION_QA_PASSWORD }}
      DANJION_QA_API_URL: ${{ vars.DANJION_QA_API_URL }}
      DANJION_QA_FRONTEND_URL: ${{ vars.DANJION_QA_FRONTEND_URL }}
      QA_WORKER_NAME: padiem-danjion-api-qa
      QA_PAGES_PROJECT: danjion-qa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exact-main guard
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ inputs.expected_main }}'
          test "$GITHUB_REF" = 'refs/heads/main'
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          test "$remote" = "$expected"
          echo 'QA exact-main guard: PASS'

      - name: Validate isolated QA targets and secret presence
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DANJION_QA_DATABASE_URL DANJION_QA_BETTER_AUTH_SECRET DANJION_QA_API_URL DANJION_QA_FRONTEND_URL; do
            test -n "${!key:-}" || { echo "::error::Missing QA input: ${key}"; exit 1; }
          done
          test "${#DANJION_QA_BETTER_AUTH_SECRET}" -ge 32
          node - <<'NODE'
          const api = new URL(process.env.DANJION_QA_API_URL);
          const front = new URL(process.env.DANJION_QA_FRONTEND_URL);
          if (api.protocol !== 'https:' || front.protocol !== 'https:') throw new Error('QA targets must use HTTPS');
          if (!api.hostname.startsWith('padiem-danjion-api-qa.') || !api.hostname.endsWith('.workers.dev')) throw new Error('QA API must be the dedicated QA workers.dev host');
          if (front.hostname !== 'danjion-qa.pages.dev') throw new Error('QA frontend must be the dedicated danjion-qa Pages host');
          if (api.hostname === 'padiem-danjion-api-production.padiem.workers.dev') throw new Error('Production Worker forbidden');
          if (front.hostname === 'danjion.pages.dev') throw new Error('Production Pages forbidden');
          NODE
          echo 'QA resource isolation guard: PASS'

      - name: Install backend dependencies and PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          cd '04_개발/backend'
          npm ci
          npm run check

      - name: Apply schema-only migrations to QA database
        shell: bash
        run: |
          set -euo pipefail
          node '04_개발/backend/scripts/qa-migration-gate.mjs' plan
          node '04_개발/backend/scripts/qa-migration-gate.mjs' apply --confirm-qa-apply

      - name: Prepare encrypted QA Worker secret payload
        shell: bash
        run: |
          set -euo pipefail
          secret_file="${RUNNER_TEMP}/danjion-qa-worker-secrets.json"
          jq -n --arg db "$DANJION_QA_DATABASE_URL" --arg auth "$DANJION_QA_BETTER_AUTH_SECRET" '{DATABASE_URL:$db,BETTER_AUTH_SECRET:$auth}' > "$secret_file"
          chmod 600 "$secret_file"
          echo "DANJION_QA_WORKER_SECRETS_FILE=$secret_file" >> "$GITHUB_ENV"
          echo 'QA Worker secret payload prepared; values suppressed.'

      - name: Deploy dedicated QA Worker
        working-directory: 04_개발/backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.131.0 deploy --env qa --secrets-file "$DANJION_QA_WORKER_SECRETS_FILE" \
            --var 'APP_ENV:qa' \
            --var 'DEV_AUTH_BYPASS:false' \
            --var 'AUTH_REQUIRE_EMAIL_VERIFICATION:false' \
            --var "DANJION_AUTH_BASE_URL:${DANJION_QA_API_URL}" \
            --var "CORS_ALLOWED_ORIGINS:${DANJION_QA_FRONTEND_URL}" \
            --var "AUTH_TRUSTED_ORIGINS:${DANJION_QA_FRONTEND_URL}"

      - name: Verify QA Worker health and JWKS
        shell: bash
        run: |
          set -euo pipefail
          health_file="${RUNNER_TEMP}/qa-health.json"
          jwks_file="${RUNNER_TEMP}/qa-jwks.json"
          ready=0
          for attempt in $(seq 1 12); do
            health_status="$(curl --silent --show-error --output "$health_file" --write-out '%{http_code}' "${DANJION_QA_API_URL}/api/health" || true)"
            if [ "$health_status" = '200' ] && jq -e '.data.status == "ok" and .data.database == "ok"' "$health_file" >/dev/null 2>&1; then
              jwks_status="$(curl --silent --show-error --output "$jwks_file" --write-out '%{http_code}' "${DANJION_QA_API_URL}/api/auth/jwks" || true)"
              if [ "$jwks_status" = '200' ] && jq -e '.keys | type == "array"' "$jwks_file" >/dev/null 2>&1; then
                ready=1
                break
              fi
            fi
            echo "QA Worker readiness attempt ${attempt}/12 not ready yet; retrying."
            sleep 2
          done
          if [ "$ready" != '1' ]; then
            echo '::error::QA Worker did not become healthy with valid JWKS within bounded readiness window.'
            exit 1
          fi
          echo 'QA Worker health + JWKS: PASS'

      - name: Ensure dedicated QA Pages project
        shell: bash
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          tmp="$(mktemp)"
          status="$(curl --silent --output "$tmp" --write-out '%{http_code}' -H "$auth_header" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${QA_PAGES_PROJECT}")"
          if [ "$status" = '404' ]; then
            npx wrangler@4.131.0 pages project create "$QA_PAGES_PROJECT" --production-branch main
          elif [ "$status" = '200' ]; then
            test "$(jq -r '.result.name // empty' "$tmp")" = "$QA_PAGES_PROJECT"
          else
            echo "::error::Unable to validate QA Pages project (HTTP ${status})"
            exit 1
          fi

      - name: Assemble noindex QA frontend artifact with dedicated runtime binding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-qa
          mkdir -p dist-qa
          cp -R frontend/. dist-qa/
          rm -rf dist-qa/tests
          node '04_개발/backend/scripts/qa-pages-runtime-bind.mjs' dist-qa
          printf '/*\n  X-Robots-Tag: noindex\n' > dist-qa/_headers
          test -f dist-qa/index.html
          test -f dist-qa/assets/danjion-session.js
          test ! -e dist-qa/tests
          # #830 same-origin QA Pages architecture: the browser runtime binds the QA Pages
          # facade, never a Worker absolute URL. The fixed QA Worker upstream is selected
          # server-side by the Pages Function, so no Worker URL belongs in the artifact.
          grep -Fq "const QA_PAGES_HOSTNAME = 'danjion-qa.pages.dev';" dist-qa/assets/danjion-session.js
          grep -Fq "const QA_PAGES_API_BASE = 'https://danjion-qa.pages.dev';" dist-qa/assets/danjion-session.js
          grep -Fq "if (hostname === QA_PAGES_HOSTNAME) return QA_PAGES_API_BASE;" dist-qa/assets/danjion-session.js
          grep -Fq "if (hostname === QA_PAGES_HOSTNAME) return '';" dist-qa/assets/danjion-session.js
          if grep -Fq 'padiem-danjion-api-production.padiem.workers.dev' dist-qa/assets/danjion-session.js; then
            echo '::error::QA browser runtime must not embed the fixed Production Worker URL.'
            exit 1
          fi
          if grep -Fq "$DANJION_QA_API_URL" dist-qa/assets/danjion-session.js; then
            echo '::error::QA browser runtime must not embed the direct QA Worker URL; it must use the same-origin QA Pages facade.'
            exit 1
          fi
          echo 'QA Pages artifact same-origin runtime binding: PASS'

      - name: Deploy dedicated QA Pages
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.131.0 pages deploy dist-qa --project-name "$QA_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message 'DanjiOn QA environment'

      - name: Verify QA Pages, runtime binding, and noindex
        shell: bash
        run: |
          set -euo pipefail
          root_body="${RUNNER_TEMP}/qa-pages-root.html"
          root_headers="${RUNNER_TEMP}/qa-pages-root.headers"
          runtime_file="${RUNNER_TEMP}/qa-danjion-session.js"
          pages_ready=0
          for attempt in $(seq 1 12); do
            root_status="$(curl --silent --show-error --output "$root_body" --dump-header "$root_headers" --write-out '%{http_code}' "${DANJION_QA_FRONTEND_URL}/" || true)"
            runtime_status="$(curl --silent --show-error --output "$runtime_file" --write-out '%{http_code}' "${DANJION_QA_FRONTEND_URL}/assets/danjion-session.js" || true)"
            if [ "$root_status" = '200' ] \
              && grep -qi '^x-robots-tag: noindex' "$root_headers" \
              && [ "$runtime_status" = '200' ] \
              && grep -Fq "const QA_PAGES_HOSTNAME = 'danjion-qa.pages.dev';" "$runtime_file" \
              && grep -Fq "const QA_PAGES_API_BASE = 'https://danjion-qa.pages.dev';" "$runtime_file" \
              && grep -Fq "if (hostname === QA_PAGES_HOSTNAME) return QA_PAGES_API_BASE;" "$runtime_file" \
              && grep -Fq "if (hostname === QA_PAGES_HOSTNAME) return '';" "$runtime_file" \
              && ! grep -Fq 'padiem-danjion-api-production.padiem.workers.dev' "$runtime_file" \
              && ! grep -Fq "$DANJION_QA_API_URL" "$runtime_file"; then
              pages_ready=1
              break
            fi
            echo "QA Pages readiness attempt ${attempt}/12 not ready yet; retrying."
            sleep 2
          done
          if [ "$pages_ready" != '1' ]; then
            echo '::error::QA Pages did not become ready with noindex and same-origin QA Pages runtime binding within bounded readiness window.'
            exit 1
          fi
          echo 'QA Pages smoke + same-origin runtime binding + noindex: PASS'

      - name: Provision or verify synthetic QA credential account
        if: inputs.provision_synthetic_account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DANJION_QA_EMAIL:-}"
          test -n "${DANJION_QA_PASSWORD:-}"
          test "${#DANJION_QA_PASSWORD}" -ge 8
          signup_body="${RUNNER_TEMP}/qa-signup.json"
          signin_body="${RUNNER_TEMP}/qa-signin.json"
          jq -n --arg email "$DANJION_QA_EMAIL" --arg password "$DANJION_QA_PASSWORD" '{email:$email,password:$password,name:"QA Synthetic"}' > "$signup_body"
          jq -n --arg email "$DANJION_QA_EMAIL" --arg password "$DANJION_QA_PASSWORD" '{email:$email,password:$password}' > "$signin_body"
          signup_status="$(curl --silent --output "${RUNNER_TEMP}/qa-signup-response.json" --write-out '%{http_code}' -X POST "${DANJION_QA_API_URL}/api/auth/sign-up/email" -H 'Content-Type: application/json' -H "Origin: ${DANJION_QA_FRONTEND_URL}" --data-binary "@${signup_body}")"
          echo "Synthetic QA signup attempt HTTP ${signup_status}; response suppressed."
          signin_status="$(curl --silent --output "${RUNNER_TEMP}/qa-signin-response.json" --write-out '%{http_code}' -X POST "${DANJION_QA_API_URL}/api/auth/sign-in/email" -H 'Content-Type: application/json' -H "Origin: ${DANJION_QA_FRONTEND_URL}" --data-binary "@${signin_body}")"
          test "$signin_status" = '200'
          echo 'Synthetic QA credential sign-in: PASS (identity/session material suppressed)'

      - name: Record QA disposition
        shell: bash
        run: |
          {
            echo '## DanjiOn isolated QA environment'
            echo ''
            echo '- Environment: `qa`'
            echo '- Worker: `padiem-danjion-api-qa`'
            echo '- Pages: `danjion-qa`'
            echo '- Browser runtime: same-origin QA Pages facade binding verified'
            echo '- Database: dedicated QA secret binding (value suppressed)'
            echo '- Production target: NO'
            echo '- Dev auth bypass: NO'
            echo '- Search indexing: NO'
          } >> "$GITHUB_STEP_SUMMARY"
