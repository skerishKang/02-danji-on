name: V2 Preview Demo Smoke Cleanup

on:
  workflow_run:
    workflows: ["V2 Preview Demo"]
    types: [completed]

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.workflow_run.head_branch == 'feat/v2-preview-demo-mode'
    runs-on: ubuntu-latest
    env:
      DANJION_DATABASE_URL: ${{ secrets.DANJION_PREVIEW_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2-preview-demo-mode

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify preview-only cleanup boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DANJION_DATABASE_URL"
          test "${{ github.event.workflow_run.head_branch }}" = 'feat/v2-preview-demo-mode'
          echo 'Cleaning only synthetic smoke records in DANJION_PREVIEW_DATABASE_URL.'

      - name: Install database client
        working-directory: 04_개발/backend
        run: npm install --ignore-scripts

      - name: Remove completed smoke-cycle records
        working-directory: 04_개발/backend
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql = neon(process.env.DANJION_DATABASE_URL);
          const apps = await sql`select approved_business_id from business_applications where business_name like '단지온 자동검증 %'`;
          for (const row of apps) {
            if (row.approved_business_id) {
              await sql`delete from businesses where id = ${String(row.approved_business_id)}::uuid`;
            }
          }
          await sql`delete from business_applications where business_name like '단지온 자동검증 %'`;
          await sql`delete from businesses where name like '단지온 자동검증 %'`;
          const remaining = await sql`select count(*)::int as count from businesses where name like '단지온 자동검증 %'`;
          if (remaining[0]?.count !== 0) throw new Error('Preview smoke cleanup did not finish cleanly.');
          console.log('Preview smoke records cleaned.');
          NODE
