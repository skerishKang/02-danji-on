name: QA Worker Deploy

on:
  pull_request:
    paths:
      - '.github/workflows/qa-worker-deploy.yml'
      - '04_개발/backend/wrangler.jsonc'
      - '04_개발/backend/src/**'
      - '04_개발/backend/tests/qa-worker-deploy-contract.mjs'
  workflow_dispatch:
    inputs:
      expected_main:
        description: 'Exact main SHA authorized for this QA Worker deploy'
        required: true
        type: string
      confirm_qa_worker:
        description: 'Explicitly confirm QA Worker-only mutation'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: danjion-qa-worker-deploy
  cancel-in-progress: false

env:
  EXPECTED_MAIN: ${{ inputs.expected_main }}

jobs:
  source-contract:
    name: QA Worker-only deploy source safety contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify QA Worker-only deploy contract
        run: node 04_개발/backend/tests/qa-worker-deploy-contract.mjs

  deploy-worker:
    name: Deploy isolated QA Worker only
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_qa_worker }}
    runs-on: ubuntu-latest
    environment: qa
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.DANJION_QA_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DANJION_QA_CLOUDFLARE_ACCOUNT_ID }}
      DANJION_QA_DATABASE_URL: ${{ secrets.DANJION_QA_DATABASE_URL }}
      DANJION_QA_BETTER_AUTH_SECRET: ${{ secrets.DANJION_QA_BETTER_AUTH_SECRET }}
      DANJION_QA_API_URL: ${{ vars.DANJION_QA_API_URL }}
      DANJION_QA_FRONTEND_URL: ${{ vars.DANJION_QA_FRONTEND_URL }}
      QA_WORKER_NAME: padiem-danjion-api-qa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exact-main guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_MAIN}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::expected_main must be a 40-character hexadecimal SHA"
            exit 1
          fi
          expected='${EXPECTED_MAIN}'
          test "$GITHUB_REF" = 'refs/heads/main'
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          test "$remote" = "$expected"
          echo 'QA Worker exact-main guard: PASS'

      - name: Validate isolated QA Worker target
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DANJION_QA_DATABASE_URL DANJION_QA_BETTER_AUTH_SECRET DANJION_QA_API_URL DANJION_QA_FRONTEND_URL; do
            test -n "${!key:-}" || { echo "::error::Missing QA Worker input: ${key}"; exit 1; }
          done
          test "${#DANJION_QA_BETTER_AUTH_SECRET}" -ge 32
          node - <<'NODE'
          const api = new URL(process.env.DANJION_QA_API_URL);
          const front = new URL(process.env.DANJION_QA_FRONTEND_URL);
          if (api.protocol !== 'https:' || front.protocol !== 'https:') throw new Error('QA targets must use HTTPS');
          if (!api.hostname.startsWith('padiem-danjion-api-qa.') || !api.hostname.endsWith('.workers.dev')) throw new Error('QA Worker host required');
          if (front.hostname !== 'danjion-qa.pages.dev') throw new Error('QA Pages host required');
          if (api.hostname === 'padiem-danjion-api-production.padiem.workers.dev') throw new Error('Production Worker forbidden');
          if (front.hostname === 'danjion.pages.dev') throw new Error('Production Pages forbidden');
          NODE
          echo 'QA Worker resource isolation guard: PASS'

      - name: Install backend dependencies and validate source
        working-directory: 04_개발/backend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check

      - name: Prepare existing QA Worker secret payload
        shell: bash
        run: |
          set -euo pipefail
          secret_file="${RUNNER_TEMP}/danjion-qa-worker-secrets.json"
          jq -n --arg db "$DANJION_QA_DATABASE_URL" --arg auth "$DANJION_QA_BETTER_AUTH_SECRET" '{DATABASE_URL:$db,BETTER_AUTH_SECRET:$auth}' > "$secret_file"
          chmod 600 "$secret_file"
          echo "DANJION_QA_WORKER_SECRETS_FILE=$secret_file" >> "$GITHUB_ENV"
          echo 'Existing QA Worker secret payload prepared; values suppressed.'

      - name: Deploy dedicated QA Worker only
        working-directory: 04_개발/backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.131.0 deploy --env qa --secrets-file "$DANJION_QA_WORKER_SECRETS_FILE" \
            --var 'APP_ENV:qa' \
            --var 'DEV_AUTH_BYPASS:false' \
            --var 'AUTH_REQUIRE_EMAIL_VERIFICATION:false' \
            --var "DANJION_AUTH_BASE_URL:${DANJION_QA_API_URL}" \
            --var "AUTH_CANONICAL_PUBLIC_BASE_URL:${DANJION_QA_FRONTEND_URL}" \
            --var "CORS_ALLOWED_ORIGINS:${DANJION_QA_FRONTEND_URL}" \
            --var "AUTH_TRUSTED_ORIGINS:${DANJION_QA_FRONTEND_URL}"

      - name: Verify QA Worker health and JWKS
        shell: bash
        run: |
          set -euo pipefail
          health_file="${RUNNER_TEMP}/qa-worker-health.json"
          jwks_file="${RUNNER_TEMP}/qa-worker-jwks.json"
          ready=0
          for attempt in $(seq 1 12); do
            health_status="$(curl --silent --show-error --output "$health_file" --write-out '%{http_code}' "${DANJION_QA_API_URL}/api/health" || true)"
            if [ "$health_status" = '200' ] && jq -e '.data.status == "ok" and .data.database == "ok"' "$health_file" >/dev/null 2>&1; then
              jwks_status="$(curl --silent --show-error --output "$jwks_file" --write-out '%{http_code}' "${DANJION_QA_API_URL}/api/auth/jwks" || true)"
              if [ "$jwks_status" = '200' ] && jq -e '.keys | type == "array"' "$jwks_file" >/dev/null 2>&1; then
                ready=1
                break
              fi
            fi
            echo "QA Worker readiness attempt ${attempt}/12 not ready yet; retrying."
            sleep 2
          done
          test "$ready" = '1' || { echo '::error::QA Worker readiness failed.'; exit 1; }
          echo 'QA Worker-only deploy readback: PASS'

      - name: Record QA Worker-only disposition
        shell: bash
        run: |
          {
            echo '## DanjiOn QA Worker-only deploy'
            echo ''
            echo '- Environment: `qa`'
            echo '- Worker: `padiem-danjion-api-qa`'
            echo '- Existing QA secret bindings reused: YES'
            echo '- Database migration: NO'
            echo '- Pages deploy: NO'
            echo '- Synthetic account mutation: NO'
            echo '- Fixture mutation: NO'
            echo '- Production target: NO'
          } >> "$GITHUB_STEP_SUMMARY"
