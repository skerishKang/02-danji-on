name: Production Neon Encrypted Drive Backup

on:
  schedule:
    # Candidate RPO=24h. 18:17 UTC = 03:17 KST.
    # Inert until DANJION_BACKUP_ENABLED=enabled is explicitly provisioned as a Production environment variable.
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      expected_main:
        description: 'Exact origin/main SHA authorized by CENTRAL'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: danjion-production-neon-backup
  cancel-in-progress: false

env:
  EXPECTED_MAIN: ${{ inputs.expected_main }}

jobs:
  activation-gate:
    name: Backup activation and source guard
    runs-on: ubuntu-latest
    environment: production
    outputs:
      state: ${{ steps.activation.outputs.state }}
      expected_main: ${{ steps.authority.outputs.expected_main }}
    env:
      DANJION_BACKUP_SOURCE_ARMED: 'true'
      DANJION_BACKUP_ENABLED: ${{ vars.DANJION_BACKUP_ENABLED }}

    steps:
      - uses: actions/checkout@v4

      - name: Exact main authority guard
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_MAIN}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::expected_main must be a 40-character hexadecimal SHA"
            exit 1
          fi
          git fetch origin main --no-tags
          actual_main="$(git rev-parse origin/main)"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            expected_main="${EXPECTED_MAIN}"
          else
            expected_main="${GITHUB_SHA}"
          fi

          if [ "${GITHUB_SHA}" != "${expected_main}" ] || [ "${actual_main}" != "${expected_main}" ]; then
            echo "::error::Exact-main authority mismatch."
            exit 1
          fi

          echo "expected_main=${expected_main}" >> "${GITHUB_OUTPUT}"
          echo "EXACT_MAIN_GUARD=PASS"

      - name: Source safety contract
        run: node 04_개발/backend/tests/backup-neon-to-drive-contract.mjs

      - name: Backup activation gate
        id: activation
        shell: bash
        run: |
          set -euo pipefail

          if [ "${DANJION_BACKUP_SOURCE_ARMED}" != "true" ] || [ "${DANJION_BACKUP_ENABLED:-}" != "enabled" ]; then
            echo "state=disabled" >> "${GITHUB_OUTPUT}"
            echo "BACKUP_ACTIVATION=DISABLED"
            exit 0
          fi

          echo "state=active" >> "${GITHUB_OUTPUT}"
          echo "BACKUP_ACTIVATION=ENABLED"

  encrypted-backup:
    name: Encrypted pg_dump to bounded Google Drive folder
    needs: activation-gate
    if: needs.activation-gate.outputs.state == 'active'
    runs-on: ubuntu-latest
    environment: production
    env:
      DANJION_PRODUCTION_DB_URL: ${{ secrets.DANJION_PRODUCTION_DB_URL }}
      DANJION_BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.DANJION_BACKUP_ENCRYPTION_PASSPHRASE }}
      DANJION_DRIVE_RCLONE_CONFIG: ${{ secrets.DANJION_DRIVE_RCLONE_CONFIG }}
      DANJION_DRIVE_FOLDER_ID: ${{ secrets.DANJION_DRIVE_FOLDER_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Reconfirm exact main immediately before backup
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          actual_main="$(git rev-parse origin/main)"
          expected_main="${{ needs.activation-gate.outputs.expected_main }}"

          if [ "${GITHUB_SHA}" != "${expected_main}" ] || [ "${actual_main}" != "${expected_main}" ]; then
            echo "::error::Exact-main authority changed before backup."
            exit 1
          fi

          echo "PREBACKUP_EXACT_MAIN_GUARD=PASS"

      - name: Verify required secret bindings without output
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          keys=(
            DANJION_PRODUCTION_DB_URL
            DANJION_BACKUP_ENCRYPTION_PASSPHRASE
            DANJION_DRIVE_RCLONE_CONFIG
            DANJION_DRIVE_FOLDER_ID
          )

          for key in "${keys[@]}"; do
            if [ -z "${!key:-}" ]; then
              missing=1
            fi
          done

          if [ "${missing}" -ne 0 ]; then
            echo "::error::One or more required backup secret bindings are missing."
            exit 1
          fi

          echo "BACKUP_SECRET_BINDINGS=PASS"

      - name: Install bounded backup tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone gnupg
          docker --version >/dev/null
          echo "BACKUP_TOOLING=READY"

      - name: Create encrypted dump, upload, and enforce retention
        shell: bash
        run: bash 04_개발/backend/scripts/backup-neon-to-drive.sh

  disabled-disposition:
    name: Backup disabled no-op
    needs: activation-gate
    if: needs.activation-gate.outputs.state != 'active'
    runs-on: ubuntu-latest
    steps:
      - name: Record disabled disposition
        shell: bash
        run: |
          echo "BACKUP_RESULT=NOOP_DISABLED"
          echo "PRODUCTION_DB_READ=0"
          echo "PRODUCTION_DB_WRITE=0"
          echo "DRIVE_WRITE=0"
          echo "DRIVE_DELETE=0"
          echo "SENSITIVE_BACKUP_SECRET_MATERIALIZED=0"
