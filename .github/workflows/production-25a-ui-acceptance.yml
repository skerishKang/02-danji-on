name: Production 25A UI Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/production-25a-ui-acceptance.yml'
      - '04_개발/frontend/scripts/production-25a-ui-acceptance.mjs'
      - '04_개발/frontend/tests/production-25a-ui-acceptance-contract.mjs'
  workflow_dispatch:
    inputs:
      expected_main:
        description: 'Exact main SHA authorized for bounded Production 25A UI acceptance'
        required: true
        type: string
      run_live:
        description: 'Explicitly authorize bounded Production UI/product-data acceptance'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: danjion-production-25a-ui-acceptance
  cancel-in-progress: false

jobs:
  source-contract:
    name: Production 25A UI source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Production 25A UI acceptance source contract
        run: node 04_개발/frontend/tests/production-25a-ui-acceptance-contract.mjs

  live-ui:
    name: Bounded Production 25A browser acceptance
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DANJION_PRODUCTION_FRONTEND_URL: https://danjion.pages.dev
      DANJION_PRODUCTION_25A_EMAIL: ${{ secrets.DANJION_PRODUCTION_25A_EMAIL }}
      DANJION_PRODUCTION_25A_PASSWORD: ${{ secrets.DANJION_PRODUCTION_25A_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 04_개발/frontend/package-lock.json

      - name: Exact-main and Production target guard
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ inputs.expected_main }}'
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$GITHUB_REF" = 'refs/heads/main'
          test -n "$expected"
          test "$actual" = "$expected"
          test "$remote" = "$expected"
          test "$DANJION_PRODUCTION_FRONTEND_URL" = 'https://danjion.pages.dev'
          test -n "$DANJION_PRODUCTION_25A_EMAIL"
          test -n "$DANJION_PRODUCTION_25A_PASSWORD"
          test -z "${DATABASE_URL:-}"
          test -z "${DANJION_PRODUCTION_DB_URL:-}"
          echo 'PRODUCTION_809_EXACT_MAIN_GUARD=PASS'
          echo 'PRODUCTION_809_ONE_ACCOUNT_GUARD=PASS'

      - name: Install frontend dependencies
        working-directory: 04_개발/frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: 04_개발/frontend
        run: npx playwright install --with-deps chromium

      - name: Run bounded Production 25A browser acceptance
        working-directory: 04_개발/frontend
        run: node scripts/production-25a-ui-acceptance.mjs

      - name: Record bounded mutation disposition
        if: always()
        shell: bash
        run: |
          {
            echo '## Production 25A UI acceptance'
            echo '- Environment: production'
            echo '- Existing synthetic acceptance account only: YES'
            echo '- Browser path: same-origin Pages facade'
            echo '- Intended product mutation: 1 business image + 1 private application document + 1 business application'
            echo '- Account provisioning: NO'
            echo '- Household provisioning: NO'
            echo '- Mutation retries: NO'
            echo '- Worker deploy: NO'
            echo '- Pages deploy: NO'
            echo '- Secret output: NO'
          } >> "$GITHUB_STEP_SUMMARY"
