name: Frontend CI

# Issue #835: the real product surface is the top-level `frontend/**`, but this
# workflow only watched `04_개발/frontend/**`, so a PR touching only top-level
# frontend leaves never ran Frontend CI at all. Both surfaces are now covered;
# the `04_개발/frontend/**` coverage is preserved unchanged. Unrelated backend /
# docs-only changes stay untriggered on purpose — this is a path-list fix, not a
# blanket `**` trigger.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - '04_개발/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    paths:
      - 'frontend/**'
      - '04_개발/frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_개발/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 04_개발/frontend/package.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Auth JWT API bridge contract
        run: node tests/auth-jwt-api-bridge-contract.mjs
      - name: Auth email recovery contract
        run: node tests/auth-email-recovery-contract.mjs
      - name: Build ordinary preview artifact
        run: npm run build
      - name: Build fail-closed live authority artifact
        env:
          VITE_DATA_MODE: api
          VITE_AUTH_MODE: danjion
          VITE_STORAGE_MODE: drive
        run: npm run build:live
