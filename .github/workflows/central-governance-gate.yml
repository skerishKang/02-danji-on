name: CENTRAL Governance Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  pr-contract:
    if: github.event_name == 'pull_request'
    name: PR authorization contract
    runs-on: ubuntu-latest
    steps:
      - name: Validate Draft/Ready authority markers
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          set -euo pipefail

          body="${PR_BODY:-}"

          if ! grep -Fq 'CENTRAL_MERGE_AUTHORIZED=' <<<"$body"; then
            echo "::error::Missing CENTRAL_MERGE_AUTHORIZED marker."
            exit 1
          fi
          if ! grep -Fq 'CENTRAL_AUTHORIZED_HEAD_SHA=' <<<"$body"; then
            echo "::error::Missing CENTRAL_AUTHORIZED_HEAD_SHA marker."
            exit 1
          fi
          if ! grep -Fq 'PRODUCTION_AUTHORIZED=' <<<"$body"; then
            echo "::error::Missing PRODUCTION_AUTHORIZED marker."
            exit 1
          fi

          if [ "$PR_DRAFT" = "true" ]; then
            echo "CENTRAL_GOVERNANCE_DRAFT=PASS"
            echo "Draft PR may continue development/CI with merge authority unset."
            exit 0
          fi

          if ! grep -Fq 'CENTRAL_MERGE_AUTHORIZED=YES' <<<"$body"; then
            echo "::error::Ready PR lacks CENTRAL merge authorization."
            exit 1
          fi

          authorized_head="$(sed -n 's/^[[:space:]]*CENTRAL_AUTHORIZED_HEAD_SHA=//p' <<<"$body" | tail -n 1 | tr -d '\r[:space:]')"
          if [ "$authorized_head" != "$PR_HEAD" ]; then
            echo "::error::CENTRAL authorized head does not match the exact PR head."
            echo "PR_HEAD=$PR_HEAD"
            echo "AUTHORIZED_HEAD=${authorized_head:-UNSET}"
            exit 1
          fi

          echo "CENTRAL_GOVERNANCE_READY=PASS"
          echo "AUTHORIZED_HEAD=$PR_HEAD"

  main-audit:
    if: github.event_name == 'push'
    name: Main integration audit
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MAIN_SHA: ${{ github.sha }}
    steps:
      - name: Audit associated merged PR and exact authorization
        id: audit
        shell: bash
        run: |
          set -euo pipefail

          pulls="$(gh api             -H 'Accept: application/vnd.github+json'             "/repos/$REPO/commits/$MAIN_SHA/pulls?per_page=20")"

          count="$(jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length' <<<"$pulls")"
          if [ "$count" -ne 1 ]; then
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "reason=associated_merged_pr_count_$count" >> "$GITHUB_OUTPUT"
            echo "::error::main change is not attributable to exactly one merged PR."
            exit 0
          fi

          pr_number="$(jq -r '[.[] | select(.merged_at != null and .base.ref == "main")][0].number' <<<"$pulls")"
          pr_body="$(jq -r '[.[] | select(.merged_at != null and .base.ref == "main")][0].body // ""' <<<"$pulls")"
          pr_head="$(jq -r '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.sha' <<<"$pulls")"

          if ! grep -Fq 'CENTRAL_MERGE_AUTHORIZED=YES' <<<"$pr_body"; then
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing_central_merge_authorization" >> "$GITHUB_OUTPUT"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "::error::merged PR did not carry CENTRAL_MERGE_AUTHORIZED=YES."
            exit 0
          fi

          authorized_head="$(sed -n 's/^[[:space:]]*CENTRAL_AUTHORIZED_HEAD_SHA=//p' <<<"$pr_body" | tail -n 1 | tr -d '\r[:space:]')"
          if [ "$authorized_head" != "$pr_head" ]; then
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "reason=authorized_head_mismatch" >> "$GITHUB_OUTPUT"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            echo "::error::merged PR head differs from CENTRAL_AUTHORIZED_HEAD_SHA."
            exit 0
          fi

          echo "authorized=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "reason=authorized" >> "$GITHUB_OUTPUT"
          echo "CENTRAL_MAIN_INTEGRATION_AUDIT=PASS"
          echo "PR_NUMBER=$pr_number"
          echo "AUTHORIZED_HEAD=$pr_head"

      - name: Open governance incident for unauthorized main change
        if: steps.audit.outputs.authorized != 'true'
        env:
          REASON: ${{ steps.audit.outputs.reason }}
          PR_NUMBER: ${{ steps.audit.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          title="[Governance Incident] Unauthorized main integration $MAIN_SHA"
          body="$(cat <<EOF
          An integration into `main` did not satisfy the CENTRAL authorization contract.

          - main SHA: `$MAIN_SHA`
          - associated PR: `${PR_NUMBER:-none}`
          - reason: `${REASON:-unknown}`

          Do not auto-revert. CENTRAL must fresh-read the new main, inspect semantic/file overlap, preserve valid unrelated work, and decide a bounded reconciliation.

          See `docs/operations/CENTRAL_CHANGE_CONTROL.md`.
          EOF
          )"

          existing="$(gh issue list --repo "$REPO" --state all --search "$MAIN_SHA in:title" --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

          echo "::error::CENTRAL_MAIN_INTEGRATION_AUDIT=FAIL reason=${REASON:-unknown}"
          exit 1
