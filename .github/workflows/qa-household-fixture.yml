name: QA Household Fixture

on:
  pull_request:
    paths:
      - '.github/workflows/qa-household-fixture.yml'
      - '04_개발/backend/scripts/qa-household-fixture.mjs'
      - '04_개발/backend/tests/qa-household-fixture-contract.mjs'
  workflow_dispatch:
    inputs:
      expected_main:
        description: 'Exact main SHA authorized for this QA fixture mutation'
        required: true
        type: string
      disposition:
        description: 'Synthetic household/resident disposition'
        required: true
        default: HOUSEHOLD_ASSOCIATED_RESIDENT_PENDING
        type: choice
        options:
          - HOUSEHOLD_ASSOCIATED_RESIDENT_PENDING
          - HOUSEHOLD_ASSOCIATED_RESIDENT_VERIFIED
      confirm_qa_fixture:
        description: 'Explicitly confirm QA-only synthetic fixture mutation'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: danjion-qa-household-fixture
  cancel-in-progress: false

jobs:
  source-contract:
    name: QA household fixture source safety contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify QA-only fixture contract
        run: node 04_개발/backend/tests/qa-household-fixture-contract.mjs

  apply-fixture:
    name: Apply QA-only synthetic household fixture
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_qa_fixture }}
    runs-on: ubuntu-latest
    environment: qa
    env:
      APP_ENV: qa
      DANJION_QA_API_URL: ${{ vars.DANJION_QA_API_URL }}
      DANJION_QA_FRONTEND_URL: ${{ vars.DANJION_QA_FRONTEND_URL }}
      DANJION_QA_DATABASE_URL: ${{ secrets.DANJION_QA_DATABASE_URL }}
      DANJION_QA_EMAIL: ${{ secrets.DANJION_QA_EMAIL }}
      DANJION_QA_PASSWORD: ${{ secrets.DANJION_QA_PASSWORD }}
      QA_FIXTURE_DISPOSITION: ${{ inputs.disposition }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Exact-main guard
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ inputs.expected_main }}'
          test "$GITHUB_REF" = 'refs/heads/main'
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          test "$remote" = "$expected"
          echo 'QA household fixture exact-main guard: PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        working-directory: 04_개발/backend
        run: npm ci

      - name: Apply idempotent QA synthetic household fixture
        run: node 04_개발/backend/scripts/qa-household-fixture.mjs
