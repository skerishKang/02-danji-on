name: Production Resident UI Read-only Audit

on:
  pull_request:
    paths:
      - '.github/workflows/production-resident-ui-readonly.yml'
      - '04_개발/frontend/scripts/production-resident-ui-readonly.mjs'
      - '04_개발/frontend/tests/production-resident-ui-readonly-contract.mjs'
  workflow_dispatch:
    inputs:
      expected_main:
        description: 'Exact main SHA authorized for Production resident UI read-only audit'
        required: true
        type: string
      run_live:
        description: 'Explicitly authorize one-account Production resident UI read-only audit'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: danjion-production-resident-ui-readonly
  cancel-in-progress: false

env:
  EXPECTED_MAIN: ${{ inputs.expected_main }}

jobs:
  source-contract:
    name: Production resident UI read-only source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify source contract
        run: node 04_개발/frontend/tests/production-resident-ui-readonly-contract.mjs
      - name: Syntax check auditor
        run: node --check 04_개발/frontend/scripts/production-resident-ui-readonly.mjs

  live-ui:
    name: Credentialed Production resident UI read-only audit
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      DANJION_PRODUCTION_FRONTEND_URL: https://danjion.pages.dev
      DANJION_PRODUCTION_TEST_RESIDENT_EMAIL: ${{ secrets.DANJION_PRODUCTION_TEST_RESIDENT_EMAIL || secrets.DANJION_PRODUCTION_25A_EMAIL }}
      DANJION_PRODUCTION_TEST_RESIDENT_PASSWORD: ${{ secrets.DANJION_PRODUCTION_TEST_RESIDENT_PASSWORD || secrets.DANJION_PRODUCTION_25A_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 04_개발/frontend/package-lock.json

      - name: Exact-main, one-resident, read-only Production guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_MAIN}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::expected_main must be a 40-character hexadecimal SHA'
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$actual" = "$EXPECTED_MAIN"
          test "$remote" = "$EXPECTED_MAIN"
          test "$DANJION_PRODUCTION_FRONTEND_URL" = 'https://danjion.pages.dev'
          test -n "$DANJION_PRODUCTION_TEST_RESIDENT_EMAIL"
          test -n "$DANJION_PRODUCTION_TEST_RESIDENT_PASSWORD"
          test "${#DANJION_PRODUCTION_TEST_RESIDENT_PASSWORD}" -ge 8
          test -z "${DATABASE_URL:-}"
          test -z "${DANJION_PRODUCTION_DB_URL:-}"
          echo 'PRODUCTION_RESIDENT_UI_EXACT_MAIN_GUARD=PASS'
          echo 'PRODUCTION_RESIDENT_UI_ONE_ACCOUNT_GUARD=PASS'
          echo 'PRODUCTION_RESIDENT_UI_DB_URL_ABSENT=PASS'

      - name: Install frontend dependencies
        working-directory: 04_개발/frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: 04_개발/frontend
        run: npx playwright install --with-deps chromium

      - name: Run Production resident UI read-only audit
        working-directory: 04_개발/frontend
        run: timeout 360 node scripts/production-resident-ui-readonly.mjs

      - name: Record bounded disposition
        if: always()
        shell: bash
        run: |
          {
            echo '## Production resident UI read-only audit'
            echo '- Persona: one pre-existing resident test account only'
            echo '- Browser: Playwright Chromium'
            echo '- Product-data mutation: 0'
            echo '- Allowed auth mutations: sign-in / sign-out only'
            echo '- Account provisioning: 0'
            echo '- Grant mutation: 0'
            echo '- Direct DB access: 0'
            echo '- Production deploy: 0'
            echo '- Secret output: 0'
          } >> "$GITHUB_STEP_SUMMARY"
