name: 'Production #960 Product Mutation Rate-Limit Acceptance'

# #960 launch gate: prove the deployed Production Worker enforces the canonical
# product-mutation rate limit (representative 429 + retry-after) while the
# existing authorization policy still answers under the threshold.
#
# Safety posture (mirrors production-1035-community-fixture-readonly):
#   * the live job only exists on workflow_dispatch with an explicit run_live
#     authorization and an exact reviewed main SHA;
#   * it uses the existing Production test-resident credentials only;
#   * no database access, no account provisioning, no grant mutation;
#   * the target route is rejected by the existing verified-primary-household
#     guard before any product insert, so the run creates no product content;
#   * rate-limit state is never reset or bypassed — a pre-polluted bucket ends
#     the run as INCONCLUSIVE, and no step retries.

on:
  pull_request:
    paths:
      - '.github/workflows/production-960-rate-limit-acceptance.yml'
      - '04_개발/backend/scripts/production-rate-limit-acceptance.mjs'
      - '04_개발/backend/tests/production-960-rate-limit-acceptance-contract.mjs'
  workflow_dispatch:
    inputs:
      expected_main:
        description: 'Exact main SHA authorized by CENTRAL for the Production #960 rate-limit acceptance'
        required: true
        type: string
      run_live:
        description: 'Explicitly authorize the credentialed Production rate-limit acceptance'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: danjion-production-960-rate-limit-acceptance
  cancel-in-progress: false

env:
  EXPECTED_MAIN: ${{ inputs.expected_main }}

jobs:
  source-contract:
    name: 'Production #960 rate-limit acceptance source contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check acceptance script
        run: node --check 04_개발/backend/scripts/production-rate-limit-acceptance.mjs
      - name: Acceptance self-test (mock, no network)
        run: node 04_개발/backend/scripts/production-rate-limit-acceptance.mjs --self-test
      - name: Verify the acceptance safety contract
        run: node 04_개발/backend/tests/production-960-rate-limit-acceptance-contract.mjs

  live-acceptance:
    name: Credentialed Production rate-limit acceptance
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DANJION_PRODUCTION_FRONTEND_URL: https://danjion.pages.dev
      DANJION_PRODUCTION_COMPLEX_SLUG: banglim-myeongji-roadhill
      DANJION_PRODUCTION_TEST_RESIDENT_EMAIL: ${{ secrets.DANJION_PRODUCTION_TEST_RESIDENT_EMAIL || secrets.DANJION_PRODUCTION_25A_EMAIL }}
      DANJION_PRODUCTION_TEST_RESIDENT_PASSWORD: ${{ secrets.DANJION_PRODUCTION_TEST_RESIDENT_PASSWORD || secrets.DANJION_PRODUCTION_25A_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Exact-main and no-database Production guard
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED_MAIN}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo '::error::expected_main must be a 40-character hexadecimal SHA'
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$actual" = "$EXPECTED_MAIN"
          test "$remote" = "$EXPECTED_MAIN"
          test "$DANJION_PRODUCTION_FRONTEND_URL" = 'https://danjion.pages.dev'
          test -n "$DANJION_PRODUCTION_COMPLEX_SLUG"
          test -n "$DANJION_PRODUCTION_TEST_RESIDENT_EMAIL"
          test -n "$DANJION_PRODUCTION_TEST_RESIDENT_PASSWORD"
          test "${#DANJION_PRODUCTION_TEST_RESIDENT_PASSWORD}" -ge 8
          test -z "${DATABASE_URL:-}"
          test -z "${DANJION_PRODUCTION_DB_URL:-}"
          echo 'PRODUCTION_960_EXACT_MAIN_GUARD=PASS'
          echo 'PRODUCTION_960_DB_URL_ABSENT=PASS'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Acceptance run (single bounded pass, no retry)
        run: timeout 600 node 04_개발/backend/scripts/production-rate-limit-acceptance.mjs
      - name: Record mutation boundary
        if: always()
        shell: bash
        run: |
          {
            echo '## #960 Production rate-limit acceptance'
            echo '- Product content mutation (household/message/report/upload/post): 0'
            echo '- Direct database access: 0'
            echo '- Rate-limit bucket reset or bypass: 0'
            echo '- Retries: 0 (a non-PASS outcome is recorded, never re-run in-loop)'
            echo '- Credentials, cookies and tokens printed: 0'
            echo '- Only the limiter bucket counter of the control under test can change.'
          } >> "$GITHUB_STEP_SUMMARY"
