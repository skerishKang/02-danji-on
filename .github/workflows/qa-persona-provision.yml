name: QA Persona Provision

on:
  pull_request:
    paths:
      - '.github/workflows/qa-persona-provision.yml'
      - '04_개발/backend/scripts/qa-persona-provision.mjs'
      - '04_개발/backend/scripts/qa-household-fixture.mjs'
      - '04_개발/backend/src/admin-scope-policy-v1.ts'
      - '04_개발/backend/tests/qa-persona-auth-target-contract.mjs'
      - '04_개발/backend/tests/qa-persona-provision-contract.mjs'
      - '04_개발/backend/tests/qa-persona-sql-type-contract.mjs'
  workflow_dispatch:
    inputs:
      expected_main:
        description: 'Exact main SHA authorized for QA persona convergence'
        required: true
        type: string
      confirm_qa_personas:
        description: 'Explicitly confirm QA-only synthetic persona/account/grant mutation'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: danjion-qa-persona-provision
  cancel-in-progress: false

jobs:
  source-contract:
    name: QA persona source safety contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify QA persona provisioning contract
        run: node 04_개발/backend/tests/qa-persona-provision-contract.mjs

      - name: Verify QA persona SQL parameter typing contract
        run: node 04_개발/backend/tests/qa-persona-sql-type-contract.mjs

      - name: Install backend test dependencies
        working-directory: 04_개발/backend
        run: npm ci --ignore-scripts

      - name: Verify QA persona auth target contract
        run: node 04_개발/backend/tests/qa-persona-auth-target-contract.mjs

      - name: Verify Pages auth boundary regression contract
        run: node frontend/tests/qa-persona-pages-origin-auth-contract.mjs

  apply-personas:
    name: Converge isolated QA personas
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_qa_personas }}
    runs-on: ubuntu-latest
    environment: qa
    env:
      APP_ENV: qa
      DANJION_QA_API_URL: ${{ vars.DANJION_QA_API_URL }}
      DANJION_QA_FRONTEND_URL: ${{ vars.DANJION_QA_FRONTEND_URL }}
      DANJION_QA_DATABASE_URL: ${{ secrets.DANJION_QA_DATABASE_URL }}
      DANJION_QA_RESIDENT_EMAIL: ${{ secrets.DANJION_QA_RESIDENT_EMAIL }}
      DANJION_QA_RESIDENT_PASSWORD: ${{ secrets.DANJION_QA_RESIDENT_PASSWORD }}
      DANJION_QA_OPERATIONAL_EMAIL: ${{ secrets.DANJION_QA_OPERATIONAL_EMAIL }}
      DANJION_QA_OPERATIONAL_PASSWORD: ${{ secrets.DANJION_QA_OPERATIONAL_PASSWORD }}
      DANJION_QA_SUPER_EMAIL: ${{ secrets.DANJION_QA_SUPER_EMAIL }}
      DANJION_QA_SUPER_PASSWORD: ${{ secrets.DANJION_QA_SUPER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exact-main guard
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ inputs.expected_main }}'
          test "$GITHUB_REF" = 'refs/heads/main'
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          test "$remote" = "$expected"
          echo 'QA persona exact-main guard: PASS'

      - name: Validate QA-only target and credential presence
        shell: bash
        run: |
          set -euo pipefail
          for key in DANJION_QA_API_URL DANJION_QA_FRONTEND_URL DANJION_QA_DATABASE_URL DANJION_QA_RESIDENT_EMAIL DANJION_QA_RESIDENT_PASSWORD DANJION_QA_OPERATIONAL_EMAIL DANJION_QA_OPERATIONAL_PASSWORD DANJION_QA_SUPER_EMAIL DANJION_QA_SUPER_PASSWORD; do
            test -n "${!key:-}" || { echo "::error::Missing QA persona input: ${key}"; exit 1; }
          done
          test "${#DANJION_QA_RESIDENT_PASSWORD}" -ge 8
          test "${#DANJION_QA_OPERATIONAL_PASSWORD}" -ge 8
          test "${#DANJION_QA_SUPER_PASSWORD}" -ge 8
          node - <<'NODE'
          const api = new URL(process.env.DANJION_QA_API_URL);
          const front = new URL(process.env.DANJION_QA_FRONTEND_URL);
          if (api.protocol !== 'https:' || api.hostname !== 'padiem-danjion-api-qa.padiem.workers.dev' || api.pathname !== '/') throw new Error('QA API origin invalid');
          if (front.protocol !== 'https:' || front.hostname !== 'danjion-qa.pages.dev' || front.pathname !== '/') throw new Error('QA frontend origin invalid');
          if (api.hostname.includes('production') || front.hostname === 'danjion.pages.dev') throw new Error('Production target forbidden');
          NODE
          echo 'QA persona isolation guard: PASS'

      - name: Install backend dependencies
        working-directory: 04_개발/backend
        run: npm ci

      - name: Converge three distinct QA credential actors and PADIEM grants
        run: node 04_개발/backend/scripts/qa-persona-provision.mjs

      - name: Converge verified resident fixture without exposing legacy fixture report
        shell: bash
        env:
          DANJION_QA_EMAIL: ${{ secrets.DANJION_QA_RESIDENT_EMAIL }}
          DANJION_QA_PASSWORD: ${{ secrets.DANJION_QA_RESIDENT_PASSWORD }}
          QA_FIXTURE_DISPOSITION: HOUSEHOLD_ASSOCIATED_RESIDENT_VERIFIED
        run: |
          set -euo pipefail
          fixture_report="${RUNNER_TEMP}/qa-resident-fixture-report.txt"
          node 04_개발/backend/scripts/qa-household-fixture.mjs > "$fixture_report"
          if grep -Fxq 'RESIDENT_VERIFIED=true' "$fixture_report"; then
            echo 'RESIDENT_VERIFIED: PASS'
          else
            echo 'RESIDENT_VERIFIED: FAIL'
            exit 1
          fi
          if grep -Fxq 'OPERATOR_GRANT_PRESENT=false' "$fixture_report"; then
            echo 'OPERATOR_GRANT_PRESENT: PASS'
          else
            echo 'OPERATOR_GRANT_PRESENT: FAIL'
            exit 1
          fi
          if grep -Fxq 'PRODUCTION_TARGET=NO' "$fixture_report"; then
            echo 'PRODUCTION_TARGET: PASS'
          else
            echo 'PRODUCTION_TARGET: FAIL'
            exit 1
          fi
          if grep -Fxq 'SECRET_OUTPUT=NO' "$fixture_report"; then
            echo 'SECRET_OUTPUT: PASS'
          else
            echo 'SECRET_OUTPUT: FAIL'
            exit 1
          fi
          echo 'PERSONA=QA_RESIDENT'
          echo 'AUTH=PASS'
          echo 'RESIDENT_VERIFIED=true'
          echo 'AUTHORITY_LEVEL=none'
          echo 'WILDCARD=false'
          echo 'BOUNDED_SCOPE_COUNT=0'
          echo 'PRODUCTION_TARGET=NO'
          echo 'SECRET_OUTPUT=NO'

      - name: Record bounded disposition
        shell: bash
        run: |
          {
            echo '## DanjiOn QA Phase 2 persona provisioning'
            echo ''
            echo '- Environment: `qa`'
            echo '- Distinct synthetic actors: `3`'
            echo '- Production target: `NO`'
            echo '- Production principal reuse: `NO`'
            echo '- Secret output: `NO`'
            echo '- Account deletion/Production mutation: `NO`'
          } >> "$GITHUB_STEP_SUMMARY"
