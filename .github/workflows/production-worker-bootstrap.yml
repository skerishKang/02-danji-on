name: Production Worker Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Deploy the DanjiOn production Worker in the Padiem Cloudflare account'
        required: true
        default: false
        type: boolean
      migration_dry_run:
        description: 'Reconcile migrations in read-only mode; plan only, never apply'
        required: false
        default: true
        type: boolean
      migration_apply_confirmed:
        description: 'Explicitly authorize applying pending production-safe migrations'
        required: false
        default: false
        type: boolean
      include_production_seed:
        description: 'Include production seed migrations (e.g. 042) in the apply set'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/workflows/production-worker-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: danjion-production-worker
  cancel-in-progress: false

jobs:
  deploy-production-worker:
    name: Guarded production Worker deploy
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm_production) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[production-bootstrap]'))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: 04_개발/backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DANJION_PRODUCTION_DB_URL: ${{ secrets.DANJION_PRODUCTION_DB_URL }}
      DANJION_GOOGLE_CLIENT_ID: ${{ secrets.DANJION_GOOGLE_CLIENT_ID }}
      DANJION_GOOGLE_CLIENT_SECRET: ${{ secrets.DANJION_GOOGLE_CLIENT_SECRET }}
      DANJION_KAKAO_CLIENT_ID: ${{ secrets.DANJION_KAKAO_CLIENT_ID }}
      DANJION_KAKAO_CLIENT_SECRET: ${{ secrets.DANJION_KAKAO_CLIENT_SECRET }}
      DANJION_NAVER_CLIENT_ID: ${{ secrets.DANJION_NAVER_CLIENT_ID }}
      DANJION_NAVER_CLIENT_SECRET: ${{ secrets.DANJION_NAVER_CLIENT_SECRET }}
      TARGET_WORKER: padiem-danjion-api-production
      VERIFICATION_WORKER: padiem-contact-verification
      HEALTH_URL: https://padiem-danjion-api-production.padiem.workers.dev/api/health
      JWKS_URL: https://padiem-danjion-api-production.padiem.workers.dev/api/auth/jwks
      DANJION_PRODUCTION_API_URL: https://padiem-danjion-api-production.padiem.workers.dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install backend dependencies
        run: npm install --ignore-scripts

      - name: Verify source-side production safety contract
        run: |
          npm run typecheck
          npm run test:production-bootstrap-safety
          npm run test:migration-gate

      - name: Record release target SHA
        id: release-target
        shell: bash
        run: |
          set -euo pipefail
          target_sha="${GITHUB_SHA:-$(git rev-parse HEAD)}"
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"
          echo "Target Worker SHA: ${target_sha}"

      - name: Migration inventory and classification (read-only)
        id: migration-inventory
        shell: bash
        run: |
          set -euo pipefail
          export TARGET_SHA="${{ steps.release-target.outputs.target_sha }}"
          node scripts/production-migration-gate.mjs inventory

      - name: Fail closed on missing GitHub deployment authority
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DANJION_PRODUCTION_DB_URL; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required production deployment input is missing: ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required production deployment inputs are present. Values were not printed."

      - name: Production migration gate (applied-state readback, pending plan)
        id: migration-gate
        shell: bash
        env:
          DANJION_PRODUCTION_DB_URL: ${{ secrets.DANJION_PRODUCTION_DB_URL }}
          MIGRATION_DRY_RUN: ${{ inputs.migration_dry_run }}
          MIGRATION_APPLY_CONFIRMED: ${{ inputs.migration_apply_confirmed }}
          INCLUDE_PRODUCTION_SEED: ${{ inputs.include_production_seed }}
        run: |
          set -euo pipefail
          export TARGET_SHA="${{ steps.release-target.outputs.target_sha }}"
          mode="dry-run"
          if [ "${MIGRATION_DRY_RUN:-true}" != "true" ] && [ "${MIGRATION_APPLY_CONFIRMED:-false}" = "true" ]; then
            mode="plan"
          fi
          gate_args=("$mode")
          if [ "${INCLUDE_PRODUCTION_SEED:-false}" = "true" ]; then
            gate_args+=("--include-production-seed")
          fi
          node scripts/production-migration-gate.mjs "${gate_args[@]}" | tee "${RUNNER_TEMP}/migration-plan.json"
          apply_count="$(jq -r '.apply_set | length' "${RUNNER_TEMP}/migration-plan.json")"
          pending_schema="$(jq -r '.pending_schema | length' "${RUNNER_TEMP}/migration-plan.json")"
          prohibited="$(jq -r '.prohibited_excluded | join(",")' "${RUNNER_TEMP}/migration-plan.json")"
          echo "apply_count=${apply_count}" >> "$GITHUB_OUTPUT"
          echo "pending_schema=${pending_schema}" >> "$GITHUB_OUTPUT"
          echo "prohibited_excluded=${prohibited}" >> "$GITHUB_OUTPUT"
          echo "target_sha=${TARGET_SHA}" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "dry-run" ]; then
            echo "Migration gate dry-run: PASS (no production mutation performed)"
            echo "pending_apply_count=${apply_count}" >> "$GITHUB_OUTPUT"
            echo "apply_authorized=false" >> "$GITHUB_OUTPUT"
          else
            echo "Migration gate plan: PASS (apply authorized by explicit inputs)"
            echo "pending_apply_count=${apply_count}" >> "$GITHUB_OUTPUT"
            echo "apply_authorized=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply pending production-safe migrations
        if: steps.migration-gate.outputs.apply_authorized == 'true'
        shell: bash
        env:
          DANJION_PRODUCTION_DB_URL: ${{ secrets.DANJION_PRODUCTION_DB_URL }}
        run: |
          set -euo pipefail
          export TARGET_SHA="${{ steps.release-target.outputs.target_sha }}"
          seed_args=()
          if [ "${{ inputs.include_production_seed }}" = "true" ]; then
            seed_args+=("--include-production-seed")
          fi
          node scripts/production-migration-gate.mjs apply --confirm-apply "${seed_args[@]}"

      - name: Verify production schema readback before deploy
        shell: bash
        env:
          DANJION_PRODUCTION_DB_URL: ${{ secrets.DANJION_PRODUCTION_DB_URL }}
        run: |
          set -euo pipefail
          export TARGET_SHA="${{ steps.release-target.outputs.target_sha }}"
          seed_args=()
          if [ "${{ inputs.include_production_seed }}" = "true" ]; then
            seed_args+=("--include-production-seed")
          fi
          node scripts/production-migration-gate.mjs dry-run "${seed_args[@]}" | tee "${RUNNER_TEMP}/migration-verify.json"
          residual="$(jq -r '.pending_schema | length' "${RUNNER_TEMP}/migration-verify.json")"
          if [ "$residual" != "0" ]; then
            echo "::error::Required production schema is not fully applied; refusing Worker deploy."
            exit 1
          fi
          echo "Production schema readback before deploy: PASS"

      - name: Verify Padiem Cloudflare account and private verification service
        shell: bash
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          account_json="$(curl --silent --show-error --fail \
            -H "$auth_header" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}")"
          account_name="$(printf '%s' "$account_json" | jq -r '.result.name // empty')"
          if [ "$account_name" != "Padiem" ]; then
            echo "::error::Cloudflare account guard failed; refusing production mutation."
            exit 1
          fi

          verification_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "$auth_header" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/${VERIFICATION_WORKER}")"
          if [ "$verification_status" != "200" ]; then
            echo "::error::Required private Padiem contact-verification Worker is not available."
            exit 1
          fi
          echo "Padiem account and private verification Worker guard: PASS"

      - name: Prepare encrypted Worker secret payload
        id: secrets
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="${RUNNER_TEMP}/danjion-production-secrets.json"
          secret_list_file="${RUNNER_TEMP}/danjion-production-secret-names.json"
          printf '%s' '{}' > "$secrets_file"
          chmod 600 "$secrets_file"

          add_secret() {
            local key="$1"
            local value="$2"
            jq --arg key "$key" --arg value "$value" '. + {($key): $value}' "$secrets_file" > "${secrets_file}.tmp"
            mv "${secrets_file}.tmp" "$secrets_file"
            chmod 600 "$secrets_file"
          }

          add_secret DATABASE_URL "$DANJION_PRODUCTION_DB_URL"

          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          target_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "$auth_header" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/${TARGET_WORKER}")"

          has_secret() {
            local name="$1"
            jq -e --arg name "$name" '.[] | select(.name == $name)' "$secret_list_file" >/dev/null 2>&1
          }

          if [ "$target_status" = "200" ]; then
            npx wrangler secret list --env production --format json > "$secret_list_file"
          elif [ "$target_status" = "404" ]; then
            printf '%s' '[]' > "$secret_list_file"
          else
            echo "::error::Could not determine existing production Worker state."
            exit 1
          fi

          if ! has_secret BETTER_AUTH_SECRET; then
            add_secret BETTER_AUTH_SECRET "$(openssl rand -hex 32)"
          fi
          if ! has_secret DANJION_CONTACT_REF_SECRET; then
            add_secret DANJION_CONTACT_REF_SECRET "$(openssl rand -hex 32)"
          fi

          add_optional_pair() {
            local public_value="$1"
            local secret_value="$2"
            local public_key="$3"
            local secret_key="$4"
            if [ -n "$public_value" ] || [ -n "$secret_value" ]; then
              if [ -z "$public_value" ] || [ -z "$secret_value" ]; then
                echo "::error::Optional OAuth provider credentials must be configured as a complete pair: ${public_key}/${secret_key}"
                exit 1
              fi
              add_secret "$public_key" "$public_value"
              add_secret "$secret_key" "$secret_value"
            fi
          }

          add_optional_pair "$DANJION_GOOGLE_CLIENT_ID" "$DANJION_GOOGLE_CLIENT_SECRET" GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
          add_optional_pair "$DANJION_KAKAO_CLIENT_ID" "$DANJION_KAKAO_CLIENT_SECRET" KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET
          add_optional_pair "$DANJION_NAVER_CLIENT_ID" "$DANJION_NAVER_CLIENT_SECRET" NAVER_CLIENT_ID NAVER_CLIENT_SECRET

          echo "path=${secrets_file}" >> "$GITHUB_OUTPUT"
          echo "Secret payload prepared. Secret values were not printed."

      - name: Deploy production Worker with encrypted secrets
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --env production --secrets-file "${{ steps.secrets.outputs.path }}" \
            | tee "${RUNNER_TEMP}/wrangler-deploy-output.txt"

      - name: Verify required Worker secret names
        shell: bash
        run: |
          set -euo pipefail
          secret_names="$(npx wrangler secret list --env production --format json)"
          for key in DATABASE_URL BETTER_AUTH_SECRET DANJION_CONTACT_REF_SECRET; do
            if ! printf '%s' "$secret_names" | jq -e --arg key "$key" '.[] | select(.name == $key)' >/dev/null; then
              echo "::error::Required Worker secret is not bound: ${key}"
              exit 1
            fi
          done
          echo "Required Worker secret-name readback: PASS"

      - name: Capture deployed artifact provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          status_file="${RUNNER_TEMP}/danjion-deployments-status.json"
          provenance_file="${RUNNER_TEMP}/danjion-deploy-provenance.json"
          npx wrangler deployments status --env production --json > "$status_file"
          tree_digest="sha256:$(git ls-tree -r HEAD --format='%(objectname) %(path)' | LC_ALL=C sort | sha256sum | cut -d' ' -f1)"
          node scripts/deploy-provenance.mjs capture \
            --deploy-log "${RUNNER_TEMP}/wrangler-deploy-output.txt" \
            --status-file "$status_file" \
            --source-sha "${{ steps.release-target.outputs.target_sha }}" \
            --source-tree-digest "$tree_digest" \
            --worker-name "$TARGET_WORKER" \
            --out "$provenance_file"
          {
            echo "source_sha=$(jq -r .source_sha "$provenance_file")"
            echo "worker_version_id=$(jq -r .worker_version_id "$provenance_file")"
            echo "deployment_id=$(jq -r .deployment_id "$provenance_file")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify deployed artifact provenance readback
        shell: bash
        run: |
          set -euo pipefail
          provenance_file="${RUNNER_TEMP}/danjion-deploy-provenance.json"
          version_view="${RUNNER_TEMP}/danjion-version-view.json"
          readback_status="${RUNNER_TEMP}/danjion-deployments-status-readback.json"
          npx wrangler versions view "${{ steps.provenance.outputs.worker_version_id }}" --env production --json > "$version_view"
          npx wrangler deployments status --env production --json > "$readback_status"
          node scripts/deploy-provenance.mjs verify \
            --record "$provenance_file" \
            --status-file "$readback_status" \
            --version-view-file "$version_view"

      - name: Upload deploy provenance evidence
        if: always() && hashFiles(format('{0}/danjion-deploy-provenance.json', runner.temp)) != ''
        uses: actions/upload-artifact@v4
        with:
          name: danjion-deploy-provenance-${{ github.sha }}
          path: ${{ runner.temp }}/danjion-deploy-provenance.json
          if-no-files-found: error

      - name: Production health and Better Auth JWKS smoke
        shell: bash
        run: |
          set -euo pipefail
          health_json="$(curl --silent --show-error --fail --retry 5 --retry-delay 2 "$HEALTH_URL")"
          if ! printf '%s' "$health_json" | jq -e '.data.status == "ok" and .data.database == "ok"' >/dev/null; then
            echo "::error::Production Worker health response did not confirm database readiness."
            exit 1
          fi

          jwks_json="$(curl --silent --show-error --fail --retry 5 --retry-delay 2 "$JWKS_URL")"
          if ! printf '%s' "$jwks_json" | jq -e '.keys | type == "array"' >/dev/null; then
            echo "::error::Better Auth JWKS endpoint is not ready."
            exit 1
          fi
          echo "Production health + Better Auth JWKS smoke: PASS"

      - name: Production read-only feature smoke
        shell: bash
        run: node tests/production-readonly-smoke.mjs

      - name: Record production bootstrap disposition
        shell: bash
        run: |
          {
            echo '## DanjiOn production Worker bootstrap'
            echo ''
            echo '- Worker: `padiem-danjion-api-production`'
            echo '- Cloudflare account guard: PASS (`Padiem`)'
            echo '- Target Worker SHA: `${{ steps.migration-gate.outputs.target_sha }}`'
            echo '- Migration gate: PASS (pending schema: ${{ steps.migration-gate.outputs.pending_schema }}, apply set: ${{ steps.migration-gate.outputs.apply_count }})'
            echo '- Prohibited dev seeds excluded from apply set: `${{ steps.migration-gate.outputs.prohibited_excluded }}`'
            echo '- Production schema readback before deploy: PASS'
            echo '- Production DB health: PASS'
            echo '- Better Auth JWKS: PASS'
            echo '- Padiem contact-verification Service Binding: PRESENT'
            echo "- Deploy provenance: source \`${{ steps.provenance.outputs.source_sha }}\` → Worker Version \`${{ steps.provenance.outputs.worker_version_id }}\` → Deployment \`${{ steps.provenance.outputs.deployment_id }}\`"
            echo '- Deployed artifact provenance readback (deployments status + versions view): PASS'
            echo '- Provenance evidence artifact: `danjion-deploy-provenance-${{ github.sha }}`'
            echo '- Real phone OTP delivery: HOLD / Issue #235'
            echo '- Secret values: NOT OUTPUT'
          } >> "$GITHUB_STEP_SUMMARY"
