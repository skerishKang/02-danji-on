name: Cloudflare Token Verify Diagnostic

on:
  push:
    branches:
      - diag/896-cloudflare-token-verify

permissions:
  contents: read
  actions: write

jobs:
  verify-token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify Cloudflare API token read-only
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, tempfile

          token = (os.environ.get("CLOUDFLARE_API_TOKEN") or "").strip()
          if not token:
              print("CF_VERIFY_SECRET_PRESENT=NO")
              sys.exit(2)
          print("CF_VERIFY_SECRET_PRESENT=YES")
          print("CF_SECRET_LENGTH=" + str(len(token)))
          print("CF_SECRET_PREFIX_CFUT=" + ("YES" if token.startswith("cfut_") else "NO"))
          print("CF_SECRET_PREFIX_CFAT=" + ("YES" if token.startswith("cfat_") else "NO"))
          print("CF_SECRET_PREFIX_BEARER=" + ("YES" if token.lower().startswith("bearer ") else "NO"))
          print("CF_SECRET_CONTAINS_WHITESPACE=" + ("YES" if any(ch.isspace() for ch in token) else "NO"))
          print("CF_SECRET_CONTAINS_QUOTE=" + ("YES" if ('"' in token or "'" in token) else "NO"))
          print("CF_SECRET_CONTAINS_AUTHORIZATION_LABEL=" + ("YES" if "authorization:" in token.lower() else "NO"))
          print("CF_SECRET_CONTAINS_CURL_TEXT=" + ("YES" if "curl " in token.lower() else "NO"))

          import re
          candidate = token
          extracted = False
          if not (candidate.startswith("cfut_") or candidate.startswith("cfat_")):
              m = re.search(r"Authorization:\s*:\s*Bearer\s+([^\s\"']+)", token, re.IGNORECASE)
              if not m:
                  m = re.search(r"Bearer\s+([^\s\"']+)", token, re.IGNORECASE)
              if m:
                  candidate = m.group(1).strip()
                  extracted = True

          print("CF_SECRET_TOKEN_EXTRACTED=" + ("YES" if extracted else "NO"))
          print("CF_CANDIDATE_LENGTH=" + str(len(candidate)))
          print("CF_CANDIDATE_PREFIX_CFUT=" + ("YES" if candidate.startswith("cfut_") else "NO"))
          print("CF_CANDIDATE_PREFIX_CFAT=" + ("YES" if candidate.startswith("cfat_") else "NO"))
          if extracted:
              print("::add-mask::" + candidate)

          endpoint = "https://api.cloudflare.com/client/v4/user/tokens/verify"
          if candidate.startswith("cfat_"):
              account_id = (os.environ.get("CLOUDFLARE_ACCOUNT_ID") or "").strip()
              if not account_id:
                  print("CF_VERIFY_ACCOUNT_ID_PRESENT=NO")
                  sys.exit(4)
              print("CF_VERIFY_ACCOUNT_ID_PRESENT=YES")
              endpoint = f"https://api.cloudflare.com/client/v4/accounts/{account_id}/tokens/verify"

          with tempfile.NamedTemporaryFile() as tmp:
              proc = subprocess.run(
                  [
                      "curl", "-sS", "--max-time", "20",
                      "-o", tmp.name,
                      "-w", "%{http_code}",
                      "-H", f"Authorization: Bearer {candidate}",
                      "-H", "Accept: application/json",
                      endpoint,
                  ],
                  text=True,
                  capture_output=True,
              )
              if proc.returncode != 0:
                  print(f"CF_VERIFY_CURL_EXIT={proc.returncode}")
                  print("CF_VERIFY_TRANSPORT_ERROR=YES")
                  sys.exit(3)

              http_status = proc.stdout.strip()
              tmp.seek(0)
              raw = tmp.read().decode("utf-8", "replace")

          try:
              payload = json.loads(raw) if raw else {}
          except Exception:
              payload = {}

          result = payload.get("result") if isinstance(payload, dict) else None
          errors = payload.get("errors") if isinstance(payload, dict) else None
          first_error = errors[0] if isinstance(errors, list) and errors else {}

          success = bool(payload.get("success")) if isinstance(payload, dict) else False
          status = result.get("status") if isinstance(result, dict) else None
          error_code = first_error.get("code") if isinstance(first_error, dict) else None
          error_message = first_error.get("message") if isinstance(first_error, dict) else None

          print("CF_VERIFY_HTTP_STATUS=" + http_status)
          print("CF_VERIFY_SUCCESS=" + ("true" if success else "false"))
          print("CF_VERIFY_STATUS=" + (str(status) if status is not None else ""))
          print("CF_VERIFY_ERROR_CODE=" + (str(error_code) if error_code is not None else ""))
          print("CF_VERIFY_ERROR_MESSAGE=" + (str(error_message) if error_message is not None else ""))

          if http_status == "200" and success and status == "active":
              print("CF_VERIFY_RESULT=ACTIVE")
              sys.exit(0)

          print("CF_VERIFY_RESULT=REJECTED")
          sys.exit(1)
          PY

      - name: Probe GitHub Actions secret-write capability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/gh-secret-key.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/secrets/public-key")"
          echo "GH_SECRET_PUBLIC_KEY_HTTP_STATUS=${status}"
          rm -f /tmp/gh-secret-key.json
          if [ "${status}" = "200" ]; then
            echo "GH_SECRET_WRITE_PATH_CANDIDATE=YES"
          else
            echo "GH_SECRET_WRITE_PATH_CANDIDATE=NO"
          fi
