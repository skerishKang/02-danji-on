name: Wrangler Command Pin CI

on:
  pull_request:
    paths:
      - '.github/workflows/wrangler-command-pin-ci.yml'
      - '.github/workflows/danjion-review-auto-deploy.yml'
      - '.github/workflows/qa-worker-deploy.yml'
      - '.github/workflows/qa-pages-deploy.yml'
      - '.github/workflows/qa-environment-provision.yml'
      - '.github/workflows/pages-production-release.yml'

permissions:
  contents: write

jobs:
  cli-compat:
    name: Wrangler 4.131.0 command surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact published Wrangler version
        shell: bash
        run: |
          set -euo pipefail
          published="$(npm view wrangler@4.131.0 version)"
          test "$published" = '4.131.0'
          actual="$(npx --yes wrangler@4.131.0 --version)"
          printf '%s\n' "$actual" | grep -Fq '4.131.0'
          echo 'WRANGLER_VERSION=4.131.0 PASS'

      - name: Verify required CLI command surfaces without cloud mutation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.0 deploy --help > "${RUNNER_TEMP}/deploy-help.txt"
          npx --yes wrangler@4.131.0 pages deploy --help > "${RUNNER_TEMP}/pages-deploy-help.txt"
          npx --yes wrangler@4.131.0 pages project create --help > "${RUNNER_TEMP}/pages-project-create-help.txt"

          grep -Fq -- '--env' "${RUNNER_TEMP}/deploy-help.txt"
          grep -Fq -- '--secrets-file' "${RUNNER_TEMP}/deploy-help.txt"
          grep -Fq -- '--var' "${RUNNER_TEMP}/deploy-help.txt"

          grep -Fq -- '--project-name' "${RUNNER_TEMP}/pages-deploy-help.txt"
          grep -Fq -- '--branch' "${RUNNER_TEMP}/pages-deploy-help.txt"
          grep -Fq -- '--commit-hash' "${RUNNER_TEMP}/pages-deploy-help.txt"
          grep -Fq -- '--commit-message' "${RUNNER_TEMP}/pages-deploy-help.txt"

          grep -Fq -- '--production-branch' "${RUNNER_TEMP}/pages-project-create-help.txt"
          echo 'WRANGLER_REQUIRED_COMMAND_SURFACE=PASS'

      - name: Confirm source-only safety disposition
        run: |
          echo 'CLOUDFLARE_API_CALL=0'
          echo 'QA_LIVE_MUTATION=0'
          echo 'PRODUCTION_MUTATION=0'
          echo 'SECRET_OUTPUT=NO'

  materialize-pins:
    name: Materialize verified explicit pins
    needs: cli-compat
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'central/702-wrangler-workflow-pins'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Exact-base and bounded replacement guard
        shell: bash
        run: |
          set -euo pipefail
          expected_main='c477be8607bbcc2097a373416c180af07c7eacd7'
          actual_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$actual_main" = "$expected_main"

          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('.github/workflows/danjion-review-auto-deploy.yml'),
              Path('.github/workflows/qa-worker-deploy.yml'),
              Path('.github/workflows/qa-pages-deploy.yml'),
              Path('.github/workflows/qa-environment-provision.yml'),
              Path('.github/workflows/pages-production-release.yml'),
          ]
          old = 'wrangler@4.114.0'
          new = 'wrangler@4.131.0'
          total = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count < 1:
                  raise SystemExit(f'expected explicit old pin missing: {path}')
              total += count
              path.write_text(text.replace(old, new), encoding='utf-8', newline='')
              print(f'PIN_REPLACEMENTS {path}={count}')
          if total < len(paths):
              raise SystemExit('unexpected replacement total')
          print(f'PIN_REPLACEMENTS_TOTAL={total}')
          PY

          mapfile -t changed < <(git -c core.quotepath=false diff --name-only | sort)
          printf '%s\n' "${changed[@]}" > "${RUNNER_TEMP}/changed.txt"
          printf '%s\n' \
            '.github/workflows/danjion-review-auto-deploy.yml' \
            '.github/workflows/pages-production-release.yml' \
            '.github/workflows/qa-environment-provision.yml' \
            '.github/workflows/qa-pages-deploy.yml' \
            '.github/workflows/qa-worker-deploy.yml' \
            | sort > "${RUNNER_TEMP}/expected.txt"
          diff -u "${RUNNER_TEMP}/expected.txt" "${RUNNER_TEMP}/changed.txt"
          git diff --check
          ! grep -F 'wrangler@4.114.0' \
            .github/workflows/danjion-review-auto-deploy.yml \
            .github/workflows/qa-worker-deploy.yml \
            .github/workflows/qa-pages-deploy.yml \
            .github/workflows/qa-environment-provision.yml \
            .github/workflows/pages-production-release.yml

      - name: Commit verified source-only pin migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/danjion-review-auto-deploy.yml \
            .github/workflows/qa-worker-deploy.yml \
            .github/workflows/qa-pages-deploy.yml \
            .github/workflows/qa-environment-provision.yml \
            .github/workflows/pages-production-release.yml
          git commit -m 'fix(ci): align explicit Wrangler deploy pins'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
          echo 'SOURCE_PIN_MIGRATION=COMMITTED'
          echo 'CLOUDFLARE_API_CALL=0'
          echo 'QA_LIVE_MUTATION=0'
          echo 'PRODUCTION_MUTATION=0'
