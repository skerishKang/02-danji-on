name: Backend CI

on:
  pull_request:
    paths:
      - '04_개발/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_개발/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 04_개발/backend/package.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck and contract tests
        run: npm run check

  postgres-lifecycle:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: resident-settings-postgres-lifecycle
            database: danjion_settings
            script: bash tests/resident-settings-postgres-lifecycle.sh
          - name: resident-safety-reports-postgres-lifecycle
            database: danjion_safety_reports
            script: bash tests/resident-safety-reports-postgres-lifecycle.sh
          - name: business-share-postgres-lifecycle
            database: danjion_business_share
            script: bash tests/business-share-postgres-lifecycle.sh
          - name: resident-activity-postgres-lifecycle
            database: danjion_activity
            script: bash tests/resident-activity-postgres-lifecycle.sh
          - name: resident-notification-postgres-lifecycle
            database: danjion_notifications
            script: bash tests/resident-notification-postgres-lifecycle.sh
          - name: resident-profile-postgres-lifecycle
            database: danjion_profiles
            script: bash tests/resident-profile-postgres-lifecycle.sh
          - name: resident-blocks-postgres-lifecycle
            database: danjion_blocks
            script: bash tests/resident-blocks-postgres-lifecycle.sh
          - name: shop-recommendations-postgres-lifecycle
            database: danjion_shop_recommendations
            script: bash tests/shop-recommendations-postgres-lifecycle.sh
          - name: inquiries-postgres-lifecycle
            database: danjion_inquiries
            script: bash tests/inquiries-postgres-lifecycle.sh
          - name: business-reviews-postgres-lifecycle
            database: danjion_reviews
            script: bash tests/business-reviews-postgres-lifecycle.sh
          - name: complex-news-channel-040-postgres-lifecycle
            database: danjion_040_compat
            script: bash tests/complex-news-channel-040-postgres-lifecycle.sh
          - name: business-category-benefit-postgres-lifecycle
            database: danjion_business_contract
            script: bash tests/business-category-benefit-postgres-lifecycle.sh
          - name: community-replies-postgres-lifecycle
            database: danjion_community_replies
            script: bash tests/community-replies-postgres-lifecycle.sh
          - name: community-postgres-security
            database: danjion_community
            script: bash tests/community-postgres-security.sh
          - name: business-image-postgres-concurrency
            database: danjion_atomicity
            script: |
              bash tests/business-image-postgres-concurrency.sh
              bash tests/business-image-upload-idempotency-postgres.sh
              bash tests/business-image-resolved-lease-cleanup-postgres.sh
          - name: application-documents-owner-list-postgres-lifecycle
            database: danjion_owner_doc_list
            script: bash tests/application-documents-owner-list-postgres-lifecycle.sh
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: ${{ matrix.database }}
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: 04_개발/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run ${{ matrix.name }}
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/${{ matrix.database }}?sslmode=disable
        run: ${{ matrix.script }}
