name: Backend CI

on:
  pull_request:
    paths:
      - '04_개발/backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - feat/backend-foundation
    paths:
      - '04_개발/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_개발/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 04_개발/backend/package.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck and contract tests
        run: npm run check

  resident-notification-postgres-lifecycle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: danjion_notifications
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d danjion_notifications"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: 04_개발/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run resident notification PostgreSQL lifecycle
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/danjion_notifications?sslmode=disable
        run: bash tests/resident-notification-postgres-lifecycle.sh

  community-postgres-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: danjion_community
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d danjion_community"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: 04_개발/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run Community C6 real PostgreSQL security lifecycle
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/danjion_community?sslmode=disable
        run: bash tests/community-postgres-security.sh

  business-image-postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: danjion_atomicity
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d danjion_atomicity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: 04_개발/backend
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run real PostgreSQL lifecycle and idempotency probes
        env:
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/danjion_atomicity?sslmode=disable
        run: |
          bash tests/business-image-postgres-concurrency.sh
          bash tests/business-image-upload-idempotency-postgres.sh
          bash tests/business-image-resolved-lease-cleanup-postgres.sh
