name: Backend CI

on:
  pull_request:
    paths:
      - '04_개발/backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - feat/backend-foundation
    paths:
      - '04_개발/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_개발/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 04_개발/backend/package.json
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Typecheck and contract tests
        run: npm run check
