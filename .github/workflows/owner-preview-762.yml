name: Owner Preview 762

on:
  push:
    branches:
      - 'fix/owner-preview-qa-762'

permissions:
  contents: read

concurrency:
  group: owner-preview-762
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy owner QA preview 762
    runs-on: ubuntu-latest
    environment: qa
    env:
      PREVIEW_PAGES_PROJECT: danjion-qa
      PREVIEW_PAGES_BRANCH: owner-preview-762
      PREVIEW_PAGES_HOST: owner-preview-762.danjion-qa.pages.dev
      PREVIEW_PAGES_URL: https://owner-preview-762.danjion-qa.pages.dev
      PREVIEW_WORKER_NAME: padiem-danjion-api-owner-preview-762
      PREVIEW_WORKER_URL: https://padiem-danjion-api-owner-preview-762.padiem.workers.dev
      PREVIEW_CANARY_BUILDING: pvc-${{ github.run_id }}
      PREVIEW_CANARY_UNIT: pvu-${{ github.run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.DANJION_QA_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DANJION_QA_CLOUDFLARE_ACCOUNT_ID }}
      DANJION_QA_DATABASE_URL: ${{ secrets.DANJION_QA_DATABASE_URL }}
      DANJION_QA_BETTER_AUTH_SECRET: ${{ secrets.DANJION_QA_BETTER_AUTH_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Safety gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/fix/owner-preview-qa-762'
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DANJION_QA_DATABASE_URL DANJION_QA_BETTER_AUTH_SECRET; do
            test -n "${!key:-}" || { echo "::error::Missing QA-only input: $key"; exit 1; }
          done
          test "${#DANJION_QA_BETTER_AUTH_SECRET}" -ge 32
          test "${PREVIEW_PAGES_HOST}" != "danjion.pages.dev"
          test "${PREVIEW_PAGES_HOST}" != "danjion-qa.pages.dev"
          test "${PREVIEW_WORKER_NAME}" != "padiem-danjion-api-production"
          test "${PREVIEW_WORKER_NAME}" != "padiem-danjion-api-qa"
          echo "OWNER_PREVIEW_762_ISOLATION=PASS"

      - name: Validate branch source
        working-directory: 04_개발/backend
        run: |
          npm ci
          npm run typecheck

      - name: Prepare preview Worker source/config
        shell: bash
        run: |
          set -euo pipefail
          # This patch is deployment-only: preview origin is accepted by the preview Worker.
          sed -i 's#https://danjion-qa.pages.dev#https://owner-preview-762.danjion-qa.pages.dev#g'             04_개발/backend/src/auth-better-v1.ts
          cp 04_개발/backend/wrangler.jsonc 04_개발/backend/wrangler.owner-preview-762.jsonc
          node - <<'NODE'
          const fs=require('fs');
          const path='04_개발/backend/wrangler.owner-preview-762.jsonc';
          let text=fs.readFileSync(path,'utf8');
          if(!text.includes('"name": "padiem-danjion-api-qa"')) throw new Error('QA Worker anchor missing');
          text=text.replace('"name": "padiem-danjion-api-qa"','"name": "padiem-danjion-api-owner-preview-762"');
          fs.writeFileSync(path,text);
          NODE
          secret_file="${RUNNER_TEMP}/owner-preview-762-secrets.json"
          jq -n --arg db "${DANJION_QA_DATABASE_URL}" --arg auth "${DANJION_QA_BETTER_AUTH_SECRET}"             '{DATABASE_URL:$db,BETTER_AUTH_SECRET:$auth}' > "$secret_file"
          chmod 600 "$secret_file"
          echo "PREVIEW_SECRET_FILE=$secret_file" >> "$GITHUB_ENV"

      - name: Ensure dedicated owner-preview household unit
        working-directory: 04_개발/backend
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DANJION_QA_DATABASE_URL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql=neon(process.env.DATABASE_URL);
          const canaryBuilding=process.env.PREVIEW_CANARY_BUILDING;
          const canaryUnit=process.env.PREVIEW_CANARY_UNIT;
          if(!canaryBuilding || !canaryUnit) throw new Error('preview canary identity missing');

          // Retire prior canaries first. Reusing one household across workflow runs
          // accumulates memberships and eventually crosses the auto-connect limit.
          await sql`
            update complex_units cu
            set status='inactive', updated_at=now()
            from complexes c
            where cu.complex_id=c.id
              and c.slug='banglim-myeongji-roadhill'
              and cu.building_code like 'pvc-%'
          `;
          await sql`
            update complex_units cu
            set status='inactive', updated_at=now()
            from complexes c
            where cu.complex_id=c.id
              and c.slug='banglim-myeongji-roadhill'
              and cu.building_code='pv-canary'
              and cu.unit_code='pv-canary-unit'
          `;

          await sql`
            insert into complex_units (complex_id, building_code, unit_code, status)
            select id, fixture.building_code, fixture.unit_code, 'active'
            from complexes
            cross join (values
              ('pv-user','pv-user-unit'),
              (${canaryBuilding},${canaryUnit})
            ) as fixture(building_code,unit_code)
            where slug='banglim-myeongji-roadhill'
            on conflict (complex_id, building_code, unit_code)
            do update set status='active', updated_at=now()
          `;
          await sql`
            update complex_units cu
            set status='inactive', updated_at=now()
            from complexes c
            where cu.complex_id=c.id
              and c.slug='banglim-myeongji-roadhill'
              and cu.building_code='preview-building'
              and cu.unit_code='preview-unit'
          `;
          const rows=await sql`
            select cu.id
            from complex_units cu
            join complexes c on c.id=cu.complex_id
            where c.slug='banglim-myeongji-roadhill'
              and (
                (cu.building_code='pv-user' and cu.unit_code='pv-user-unit')
                or (cu.building_code=${canaryBuilding} and cu.unit_code=${canaryUnit})
              )
              and cu.status='active'
          `;
          if(rows.length!==2)throw new Error('preview household fixtures missing');
          console.log('OWNER_PREVIEW_762_UNIT_FIXTURE=PASS');
          NODE

      - name: Deploy preview Worker
        working-directory: 04_개발/backend
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.131.0 deploy             --config wrangler.owner-preview-762.jsonc             --env qa             --secrets-file "${PREVIEW_SECRET_FILE}"             --var 'APP_ENV:qa'             --var 'DEV_AUTH_BYPASS:false'             --var 'AUTH_REQUIRE_EMAIL_VERIFICATION:false'             --var "DANJION_AUTH_BASE_URL:${PREVIEW_WORKER_URL}"             --var "AUTH_CANONICAL_PUBLIC_BASE_URL:${PREVIEW_PAGES_URL}"             --var "CORS_ALLOWED_ORIGINS:${PREVIEW_PAGES_URL}"             --var "AUTH_TRUSTED_ORIGINS:${PREVIEW_PAGES_URL}"
          echo "OWNER_PREVIEW_762_WORKER=PASS"

      - name: Verify preview Worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            code="$(curl -sS -o "${RUNNER_TEMP}/health.json" -w '%{http_code}' "${PREVIEW_WORKER_URL}/api/health" || true)"
            if [ "$code" = "200" ] && jq -e '.data.status=="ok" and .data.database=="ok"' "${RUNNER_TEMP}/health.json" >/dev/null 2>&1; then
              echo "OWNER_PREVIEW_762_WORKER_HEALTH=PASS"
              exit 0
            fi
            sleep 2
          done
          echo "::error::preview Worker failed health"
          exit 1

      - name: Assemble Pages preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-owner-preview-762
          mkdir -p dist-owner-preview-762
          cp -R frontend/. dist-owner-preview-762/
          rm -rf dist-owner-preview-762/tests

          # Branch preview is credential-auth only. Hide unsupported social buttons rather than presenting a broken path.
          node - <<'NODE'
          const fs=require('fs');
          const index='dist-owner-preview-762/index.html';
          let html=fs.readFileSync(index,'utf8');
          html=html.replace(
            '<button class="auth-option kakao" data-social="카카오"><i>K</i><span>카카오로 계속하기</span><span class="arrow">→</span></button><button class="auth-option google" data-social="Google"><i>G</i><span>Google로 계속하기</span><span class="arrow">→</span></button>',
            ''
          );
          html=html.replace(
            '<div class="auth-options">',
            '<p class="modal-lead"><b>프리뷰 안내:</b> 이 격리 QA에서는 이메일 로그인만 사용합니다. Google·Kakao는 Production OAuth와 분리되어 있습니다.</p><div class="auth-options">'
          );
          fs.writeFileSync(index,html);

          const previewHost='owner-preview-762.danjion-qa.pages.dev';
          const previewOrigin='https://'+previewHost;
          const previewWorker='https://padiem-danjion-api-owner-preview-762.padiem.workers.dev';
          const session='dist-owner-preview-762/assets/danjion-session.js';
          let runtime=fs.readFileSync(session,'utf8').replaceAll('danjion-qa.pages.dev',previewHost);
          fs.writeFileSync(session,runtime);
          for(const path of ['functions/_lib/auth-facade.js','functions/_lib/app-facade.js']){
            let text=fs.readFileSync(path,'utf8');
            text=text.replaceAll('https://danjion-qa.pages.dev',previewOrigin);
            text=text.replaceAll('https://padiem-danjion-api-qa.padiem.workers.dev',previewWorker);
            fs.writeFileSync(path,text);
          }
          NODE

          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > dist-owner-preview-762/_headers
          grep -Fq "우리집 연결하기" "dist-owner-preview-762/26_우리집연결.html"
          ! grep -Fq 'id="nickname"' "dist-owner-preview-762/26_우리집연결.html"
          grep -Fq "한 줄 소개는 다른 주민이 보는 공개 프로필에 표시됩니다" "dist-owner-preview-762/19_내정보_메인.html"
          grep -Fq "1~3개 필수" "dist-owner-preview-762/25A_신청제보.html"
          echo "OWNER_PREVIEW_762_ARTIFACT=PASS"

      - name: Deploy Pages branch preview
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.131.0 pages deploy dist-owner-preview-762             --project-name "${PREVIEW_PAGES_PROJECT}"             --branch "${PREVIEW_PAGES_BRANCH}"             --commit-hash "${GITHUB_SHA}"             --commit-message "Owner QA #762 preview"
          echo "OWNER_PREVIEW_762_PAGES=PASS"

      - name: Smoke Pages + same-origin auth/app facades
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            root="$(curl -sS -o "${RUNNER_TEMP}/root.html" -w '%{http_code}' "${PREVIEW_PAGES_URL}/" || true)"
            session="$(curl -sS -o "${RUNNER_TEMP}/session.json" -D "${RUNNER_TEMP}/session.h" -w '%{http_code}' "${PREVIEW_PAGES_URL}/api/auth/get-session" || true)"
            me="$(curl -sS -o "${RUNNER_TEMP}/me.json" -D "${RUNNER_TEMP}/me.h" -w '%{http_code}' "${PREVIEW_PAGES_URL}/api/v1/me" || true)"
            if [ "$root" = 200 ] && [ "$session" = 200 ] && [ "$me" = 401 ]               && grep -qi '^x-danjion-auth-facade: danjion-auth-facade/v1' "${RUNNER_TEMP}/session.h"               && grep -qi '^x-danjion-app-facade: danjion-app-facade/v1' "${RUNNER_TEMP}/me.h"; then
              echo "OWNER_PREVIEW_762_FACADE_SMOKE=PASS"
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Prove credential signup → household → community → shop recommendation
        shell: bash
        run: |
          set -euo pipefail
          jar="${RUNNER_TEMP}/owner-preview-762.cookies"
          email="owner-preview-762-${GITHUB_RUN_ID}@example.com"
          password="$(node -e "process.stdout.write(require('crypto').randomBytes(24).toString('base64url') + 'Aa1!')")"
          signup_body="$(jq -nc --arg email "$email" --arg password "$password" '{email:$email,password:$password,name:"프리뷰 검증"}')"
          signup_status="$(curl -sS -c "$jar" -b "$jar" -o "${RUNNER_TEMP}/signup.json" -w '%{http_code}'             -H 'content-type: application/json' -d "$signup_body" "${PREVIEW_PAGES_URL}/api/auth/sign-up/email")"
          test "$signup_status" = "200" || { echo "::error::credential signup failed status=$signup_status"; exit 1; }

          session_status="$(curl -sS -c "$jar" -b "$jar" -o "${RUNNER_TEMP}/signed-session.json" -w '%{http_code}'             "${PREVIEW_PAGES_URL}/api/auth/get-session")"
          test "$session_status" = "200"
          jq -e '.session and .user' "${RUNNER_TEMP}/signed-session.json" >/dev/null

          units_status="$(curl -sS -c "$jar" -b "$jar" -o "${RUNNER_TEMP}/units.json" -w '%{http_code}'             "${PREVIEW_PAGES_URL}/api/v1/complexes/banglim-myeongji-roadhill/household/units")"
          test "$units_status" = "200"
          unit_id="$(jq -r --arg building "$PREVIEW_CANARY_BUILDING" --arg unit "$PREVIEW_CANARY_UNIT" '.data.units[] | select(.buildingCode==$building and .unitCode==$unit) | .id' "${RUNNER_TEMP}/units.json" | head -n1)"
          test -n "$unit_id" || { echo "::error::run-scoped canary unit missing from household picker"; exit 1; }

          associate_body="$(jq -nc --arg unitId "$unit_id" '{unitId:$unitId}')"
          associate_status="$(curl -sS -c "$jar" -b "$jar" -o "${RUNNER_TEMP}/associate.json" -w '%{http_code}'             -H 'content-type: application/json' -d "$associate_body"             "${PREVIEW_PAGES_URL}/api/v1/complexes/banglim-myeongji-roadhill/household/associate")"
          { [ "$associate_status" = "200" ] || [ "$associate_status" = "201" ]; } || { echo "::error::household associate failed status=$associate_status"; cat "${RUNNER_TEMP}/associate.json" | jq '{error:.error}' ; exit 1; }
          jq -e '.data.status=="verified" and .data.autoConnected==true' "${RUNNER_TEMP}/associate.json" >/dev/null || {
            echo "::error::fresh canary household did not auto-connect";
            jq '{status:.data.status,autoConnected:.data.autoConnected,reviewRequired:.data.reviewRequired,memberPosition:.data.memberPosition,error:.error}' "${RUNNER_TEMP}/associate.json";
            exit 1;
          }

          post_body='{"kind":"greeting","title":"프리뷰 연결 검증","body":"우리집 연결 뒤 주민 글쓰기가 열리는지 확인합니다."}'
          post_status="$(curl -sS -c "$jar" -b "$jar" -o "${RUNNER_TEMP}/post.json" -w '%{http_code}'             -H 'content-type: application/json' -d "$post_body"             "${PREVIEW_PAGES_URL}/api/v1/complexes/banglim-myeongji-roadhill/community/posts")"
          test "$post_status" = "201" || { echo "::error::community post failed status=$post_status"; cat "${RUNNER_TEMP}/post.json" | jq '{error:.error}'; exit 1; }

          rec_body='{"complexSlug":"banglim-myeongji-roadhill","relationRaw":"neighbor","businessName":"프리뷰 검증 가게","serviceSummary":"주민 제보 권한 검증용 QA 데이터입니다."}'
          rec_status="$(curl -sS -c "$jar" -b "$jar" -o "${RUNNER_TEMP}/rec.json" -w '%{http_code}'             -H 'content-type: application/json' -d "$rec_body"             "${PREVIEW_PAGES_URL}/api/v1/me/shop-recommendations")"
          test "$rec_status" = "201" || { echo "::error::shop recommendation failed status=$rec_status"; cat "${RUNNER_TEMP}/rec.json" | jq '{error:.error}'; exit 1; }

          echo "OWNER_PREVIEW_762_CREDENTIAL_SIGNUP=PASS"
          echo "OWNER_PREVIEW_762_HOUSEHOLD_ASSOCIATE=PASS"
          echo "OWNER_PREVIEW_762_COMMUNITY_WRITE=PASS"
          echo "OWNER_PREVIEW_762_SHOP_REPORT=PASS"

          # Hide the automated canary unit from the owner-facing picker after proof.
          cd 04_개발/backend
          DATABASE_URL="${DANJION_QA_DATABASE_URL}" node --input-type=module <<'NODE'
          import { neon } from '@neondatabase/serverless';
          const sql=neon(process.env.DATABASE_URL);
          const canaryBuilding=process.env.PREVIEW_CANARY_BUILDING;
          const canaryUnit=process.env.PREVIEW_CANARY_UNIT;
          if(!canaryBuilding || !canaryUnit) throw new Error('preview canary identity missing during cleanup');
          await sql`
            update complex_units cu
            set status='inactive', updated_at=now()
            from complexes c
            where cu.complex_id=c.id
              and c.slug='banglim-myeongji-roadhill'
              and cu.building_code=${canaryBuilding}
              and cu.unit_code=${canaryUnit}
          `;
          console.log('OWNER_PREVIEW_762_CANARY_UNIT_HIDDEN=PASS');
          NODE
          cd ../..

      - name: Record isolation
        shell: bash
        run: |
          {
            echo '## Owner QA preview #762'
            echo '- Pages: https://owner-preview-762.danjion-qa.pages.dev'
            echo '- Worker: isolated preview Worker'
            echo '- DB: existing QA DB'
            echo '- Social OAuth: disabled/hidden in preview'
            echo '- Production mutation: 0'
            echo '- main mutation: 0'
          } >> "$GITHUB_STEP_SUMMARY"
