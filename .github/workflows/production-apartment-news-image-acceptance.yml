name: Production Apartment News Image Acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/production-apartment-news-image-acceptance.yml'
      - '04_개발/frontend/scripts/production-apartment-news-image-acceptance.mjs'
      - '04_개발/frontend/tests/production-apartment-news-image-acceptance-contract.mjs'
      - 'frontend/admin/index.html'
      - 'frontend/assets/danjion-admin-console.js'
      - 'frontend/assets/danjion-admin-official-news-storage.js'
      - 'frontend/08A_아파트소식_상세.html'
      - '04_개발/backend/src/admin-operational-v2.ts'
      - '04_개발/backend/src/official-news-attachment-v1.ts'
  workflow_dispatch:
    inputs:
      expected_main:
        description: 'Exact main SHA authorized for bounded Production Apartment News image acceptance'
        required: true
        type: string
      run_live:
        description: 'Explicitly authorize bounded Production Apartment News image mutation/E2E'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: danjion-production-apartment-news-image-acceptance
  cancel-in-progress: false

jobs:
  source-contract:
    name: Production Apartment News image source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify canonical V3 admin image parity
        run: node frontend/tests/leaf-b844-production-v3-admin-photo-parity-contract.mjs
      - name: Verify bounded Production acceptance contract
        run: node 04_개발/frontend/tests/production-apartment-news-image-acceptance-contract.mjs

  live-e2e:
    name: Bounded Production Apartment News image E2E
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DANJION_PRODUCTION_FRONTEND_URL: https://danjion.pages.dev
      DANJION_PRODUCTION_OPERATOR_EMAIL: ${{ secrets.DANJION_PRODUCTION_OPERATOR_EMAIL }}
      DANJION_PRODUCTION_OPERATOR_PASSWORD: ${{ secrets.DANJION_PRODUCTION_OPERATOR_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 04_개발/frontend/package-lock.json

      - name: Exact-main and bounded Production authority guard
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ inputs.expected_main }}'
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$GITHUB_REF" = 'refs/heads/main'
          test -n "$expected"
          test "$actual" = "$expected"
          test "$remote" = "$expected"
          test "$DANJION_PRODUCTION_FRONTEND_URL" = 'https://danjion.pages.dev'
          test -n "$DANJION_PRODUCTION_OPERATOR_EMAIL"
          test -n "$DANJION_PRODUCTION_OPERATOR_PASSWORD"
          test -z "${DATABASE_URL:-}"
          test -z "${DANJION_PRODUCTION_DB_URL:-}"
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          echo 'PRODUCTION_844_EXACT_MAIN_GUARD=PASS'
          echo 'PRODUCTION_844_OPERATOR_CREDENTIAL_PRESENCE=PASS'
          echo 'PRODUCTION_844_DIRECT_DB_AUTHORITY=ABSENT'
          echo 'PRODUCTION_844_DEPLOY_AUTHORITY=ABSENT'

      - name: Install frontend dependencies
        working-directory: 04_개발/frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: 04_개발/frontend
        run: npx playwright install --with-deps chromium

      - name: Run bounded Production Apartment News image E2E
        working-directory: 04_개발/frontend
        run: node scripts/production-apartment-news-image-acceptance.mjs

      - name: Record bounded mutation disposition
        if: always()
        shell: bash
        run: |
          {
            echo '## Production Apartment News image acceptance'
            echo '- Environment: production'
            echo '- Existing Production operator account only: YES'
            echo '- Canonical browser/admin origin: https://danjion.pages.dev'
            echo '- Intended mutations: 1 official-news-image upload + 1 official post create + 1 archive cleanup'
            echo '- Referenced delete probe: one request, expected 409, no delete'
            echo '- Failure cleanup: at most one archive OR one unreferenced-object delete; no retry'
            echo '- Account provisioning: NO'
            echo '- Household provisioning: NO'
            echo '- Direct DB/schema mutation: NO'
            echo '- Worker deploy: NO'
            echo '- Pages deploy: NO'
            echo '- Secret output: NO'
          } >> "$GITHUB_STEP_SUMMARY"
