name: QA Pages Deploy

on:
  pull_request:
    paths:
      - '.github/workflows/qa-pages-deploy.yml'
      - '04_개발/backend/scripts/qa-pages-runtime-bind.mjs'
      - '04_개발/backend/tests/qa-pages-deploy-contract.mjs'
      - 'frontend/assets/danjion-session.js'
      - 'functions/**'
  workflow_dispatch:
    inputs:
      expected_main:
        description: 'Exact main SHA authorized for this QA Pages deploy'
        required: true
        type: string
      confirm_qa_pages:
        description: 'Explicitly confirm QA Pages-only mutation'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: danjion-qa-pages-deploy
  cancel-in-progress: false

jobs:
  source-contract:
    name: QA Pages-only deploy source safety contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify QA Pages-only deploy contract
        run: node 04_개발/backend/tests/qa-pages-deploy-contract.mjs

  deploy-pages:
    name: Deploy isolated QA Pages only
    needs: source-contract
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_qa_pages }}
    runs-on: ubuntu-latest
    environment: qa
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.DANJION_QA_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DANJION_QA_CLOUDFLARE_ACCOUNT_ID }}
      DANJION_QA_API_URL: ${{ vars.DANJION_QA_API_URL }}
      DANJION_QA_FRONTEND_URL: ${{ vars.DANJION_QA_FRONTEND_URL }}
      QA_PAGES_PROJECT: danjion-qa
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Exact-main guard
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ inputs.expected_main }}'
          test "$GITHUB_REF" = 'refs/heads/main'
          actual="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"
          test "$remote" = "$expected"
          echo 'QA Pages exact-main guard: PASS'

      - name: Validate isolated QA Pages targets
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DANJION_QA_API_URL DANJION_QA_FRONTEND_URL; do
            test -n "${!key:-}" || { echo "::error::Missing QA Pages input: ${key}"; exit 1; }
          done
          node - <<'NODE'
          const api = new URL(process.env.DANJION_QA_API_URL);
          const front = new URL(process.env.DANJION_QA_FRONTEND_URL);
          if (api.protocol !== 'https:' || front.protocol !== 'https:') throw new Error('QA targets must use HTTPS');
          if (!api.hostname.startsWith('padiem-danjion-api-qa.') || !api.hostname.endsWith('.workers.dev')) throw new Error('QA API must be the dedicated QA workers.dev host');
          if (front.hostname !== 'danjion-qa.pages.dev') throw new Error('QA frontend must be danjion-qa.pages.dev');
          if (api.hostname === 'padiem-danjion-api-production.padiem.workers.dev') throw new Error('Production Worker forbidden');
          if (front.hostname === 'danjion.pages.dev') throw new Error('Production Pages forbidden');
          NODE
          echo 'QA Pages resource isolation guard: PASS'

      - name: Verify existing dedicated QA Pages project
        shell: bash
        run: |
          set -euo pipefail
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          tmp="$(mktemp)"
          status="$(curl --silent --output "$tmp" --write-out '%{http_code}' -H "$auth_header" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${QA_PAGES_PROJECT}")"
          test "$status" = '200' || { echo "::error::QA Pages project readback failed (HTTP ${status})"; exit 1; }
          test "$(jq -r '.result.name // empty' "$tmp")" = "$QA_PAGES_PROJECT"
          echo 'Existing QA Pages project: PASS'

      - name: Assemble noindex QA frontend artifact with dedicated runtime binding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-qa
          mkdir -p dist-qa
          cp -R frontend/. dist-qa/
          rm -rf dist-qa/tests
          node '04_개발/backend/scripts/qa-pages-runtime-bind.mjs' dist-qa
          printf '/*\n  X-Robots-Tag: noindex\n' > dist-qa/_headers
          test -f dist-qa/index.html
          test -f dist-qa/assets/danjion-session.js
          test -f functions/_lib/auth-facade.js
          test -f functions/_lib/app-facade.js
          test -f 'functions/api/auth/[[path]].js'
          test -f 'functions/api/v1/[[path]].js'
          test ! -e dist-qa/tests
          grep -Fq "const QA_PAGES_HOSTNAME = 'danjion-qa.pages.dev';" dist-qa/assets/danjion-session.js
          grep -Fq "const QA_PAGES_API_BASE = 'https://danjion-qa.pages.dev';" dist-qa/assets/danjion-session.js
          grep -Fq "return QA_PAGES_API_BASE;" dist-qa/assets/danjion-session.js
          grep -Fq "return '';" dist-qa/assets/danjion-session.js
          grep -Fq "QA_PAGES_ORIGIN = 'https://danjion-qa.pages.dev'" functions/_lib/auth-facade.js
          grep -Fq "QA_WORKER_API_BASE = 'https://padiem-danjion-api-qa.padiem.workers.dev'" functions/_lib/auth-facade.js
          grep -Fq "QA_PAGES_ORIGIN = 'https://danjion-qa.pages.dev'" functions/_lib/app-facade.js
          grep -Fq "QA_WORKER_API_BASE = 'https://padiem-danjion-api-qa.padiem.workers.dev'" functions/_lib/app-facade.js
          echo 'QA Pages artifact runtime + facade source binding: PASS'

      - name: Deploy dedicated QA Pages only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@4.114.0 pages deploy dist-qa --project-name "$QA_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-message 'DanjiOn QA Pages-only deploy'

      - name: Verify QA Pages readiness, same-origin facades, runtime binding, and noindex
        shell: bash
        run: |
          set -euo pipefail
          root_body="${RUNNER_TEMP}/qa-pages-root.html"
          root_headers="${RUNNER_TEMP}/qa-pages-root.headers"
          runtime_file="${RUNNER_TEMP}/qa-danjion-session.js"
          auth_body="${RUNNER_TEMP}/qa-auth-session.json"
          auth_headers="${RUNNER_TEMP}/qa-auth-session.headers"
          app_body="${RUNNER_TEMP}/qa-app-me.json"
          app_headers="${RUNNER_TEMP}/qa-app-me.headers"
          pages_ready=0
          for attempt in $(seq 1 12); do
            root_status="$(curl --silent --show-error --output "$root_body" --dump-header "$root_headers" --write-out '%{http_code}' "${DANJION_QA_FRONTEND_URL}/" || true)"
            runtime_status="$(curl --silent --show-error --output "$runtime_file" --write-out '%{http_code}' "${DANJION_QA_FRONTEND_URL}/assets/danjion-session.js" || true)"
            auth_status="$(curl --silent --show-error --output "$auth_body" --dump-header "$auth_headers" --write-out '%{http_code}' "${DANJION_QA_FRONTEND_URL}/api/auth/get-session" || true)"
            app_status="$(curl --silent --show-error --output "$app_body" --dump-header "$app_headers" --write-out '%{http_code}' "${DANJION_QA_FRONTEND_URL}/api/v1/me" || true)"
            if [ "$root_status" = '200' ] \
              && grep -qi '^x-robots-tag: noindex' "$root_headers" \
              && [ "$runtime_status" = '200' ] \
              && grep -Fq "const QA_PAGES_HOSTNAME = 'danjion-qa.pages.dev';" "$runtime_file" \
              && grep -Fq "return QA_PAGES_API_BASE;" "$runtime_file" \
              && grep -Fq "return '';" "$runtime_file" \
              && [ "$auth_status" = '200' ] \
              && grep -qi '^x-danjion-auth-facade: danjion-auth-facade/v1' "$auth_headers" \
              && [ "$app_status" = '401' ] \
              && grep -qi '^x-danjion-app-facade: danjion-app-facade/v1' "$app_headers"; then
              pages_ready=1
              break
            fi
            echo "QA Pages readiness attempt ${attempt}/12 not ready yet; retrying."
            sleep 2
          done
          if [ "$pages_ready" != '1' ]; then
            echo '::error::QA Pages did not become ready with noindex, same-origin facades, and dedicated runtime binding within bounded readiness window.'
            exit 1
          fi
          echo 'QA Pages-only deploy same-origin facade readback: PASS'

      - name: Record QA Pages-only disposition
        shell: bash
        run: |
          {
            echo '## DanjiOn QA Pages-only deploy'
            echo ''
            echo '- Environment: `qa`'
            echo '- Pages: `danjion-qa`'
            echo '- Same-origin auth facade: PASS'
            echo '- Same-origin app facade: PASS'
            echo '- Worker mutation: NO'
            echo '- Database mutation: NO'
            echo '- Auth secret mutation: NO'
            echo '- Synthetic account mutation: NO'
            echo '- Production target: NO'
            echo '- Search indexing: NO'
          } >> "$GITHUB_STEP_SUMMARY"
