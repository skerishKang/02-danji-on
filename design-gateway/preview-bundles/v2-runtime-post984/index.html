(function () {
  var nativeFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var raw = typeof input === 'string' ? input : (input && input.url) || '';
    var url = new URL(raw, window.location.href);
    if (url.pathname === '/api/auth/capabilities') {
      var mode = new URL(window.location.href).searchParams.get('capability') || 'default';
      var body = mode === 'empty'
        ? { data: { socialProviders: [] } }
        : mode === 'malformed'
          ? { data: { socialProviders: { unavailable: true } } }
          : { data: { socialProviders: ['kakao', 'google', 'naver'] } };
      return Promise.resolve(new Response(JSON.stringify(body), {
        status: 200,
        headers: { 'content-type': 'application/json' }
      }));
    }
    return nativeFetch(input, init);
  };
})();
</script>
