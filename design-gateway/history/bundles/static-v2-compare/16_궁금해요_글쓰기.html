<body data-danjion-page="16">

<p class="lead">궁금해요 안에서 필요한 유형만 탭으로 바꿉니다. 다른 글쓰기 화면을 다시 고를 필요는 없습니다.</p>

<div class="tools"><button class="photo" id="photoBtn" type="button">사진 추가</button><span class="photo-count" id="photoCount">0 / 3</span><input accept="image/*" hidden="" id="photos" multiple="" type="file"/></div>

<script>
(function(){
  try{history.scrollRestoration='manual'}catch(e){}; requestAnimationFrame(()=>window.scrollTo(0,0));
 const COMMUNITY='12_이웃대화_첫화면.html?type=question';
 const title=document.getElementById('title'),body=document.getElementById('body'),photos=document.getElementById('photos'),toggle=document.getElementById('messageToggle');
 const help={"생활·살림":"생활 속 사용 경험이나 살림 노하우를 이웃에게 물어보세요.","단지시설":"주차·분리수거장·공용시설처럼 단지 안 이용 경험을 물어보세요.","이웃추천":"직접 이용해 본 가게·서비스·방법을 이웃에게 추천받아보세요.","기타":"세 유형에 맞지 않는 질문을 자유롭게 적어보세요."};
 let selected='생활·살림'; const key='danjionDraft:16:v2';
 function reportRoute(){try{if(parent!==window)parent.postMessage({type:'danjion-route',file:'16_궁금해요_글쓰기.html',href:location.href},'*')}catch(e){}} reportRoute();addEventListener('pageshow',reportRoute);
 function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1700)}
 function save(){try{localStorage.setItem(key,JSON.stringify({selected,title:title.value,body:body.value,message:toggle.classList.contains('on')}))}catch(e){}}

 document.querySelectorAll('.type-tab').forEach(b=>b.addEventListener('click',()=>setType(b.dataset.type)));
 try{const d=JSON.parse(localStorage.getItem(key)||'null');if(d){if(help[d.selected])selected=d.selected;title.value=d.title||'';body.value=d.body||'';toggle.classList.toggle('on',!!d.message);toggle.setAttribute('aria-checked',String(!!d.message))}}catch(e){} setType(selected);
 function counts(){document.getElementById('titleCount').textContent=title.value.length;document.getElementById('bodyCount').textContent=body.value.length} counts(); title.addEventListener('input',()=>{counts();save()});body.addEventListener('input',()=>{counts();save()});
 toggle.addEventListener('click',()=>{const on=toggle.classList.toggle('on');toggle.setAttribute('aria-checked',String(on));save()});
 document.querySelector('.back').addEventListener('click',()=>location.href=COMMUNITY);document.getElementById('photoBtn').addEventListener('click',()=>photos.click());photos.addEventListener('change',()=>{document.getElementById('photoCount').textContent=Math.min(photos.files.length,3)+' / 3'});
 function publish(){if(!title.value.trim()){toast('질문 제목을 입력해주세요.');title.focus();return}if(body.value.trim().length<10){toast('궁금한 내용을 10자 이상 적어주세요.');body.focus();return}try{localStorage.removeItem(key)}catch(e){}toast(selected+' 질문을 게시했습니다.');setTimeout(()=>location.href=COMMUNITY,650)}

})();
