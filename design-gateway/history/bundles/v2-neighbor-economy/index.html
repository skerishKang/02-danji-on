function routeBase(){const r=state.route;if(r==='home')return'home';if(['listings','search','detail'].includes(r))return'listings';if(r==='benefits')return'benefits';if(['news','notice'].includes(r))return'news';return'my'}
function updateNav(){document.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('active',el.dataset.nav===routeBase()))}
function navigate(route,id){state.route=route;if(id)state.selectedId=id;window.scrollTo({top:0,behavior:'instant'});render()}
function pageHead(title,desc,actions=''){return `<div class="page-head"><div><h1>${title}</h1><p>${desc}</p></div>${actions?`<div class="page-actions">${actions}</div>`:''}</div>`}
function serviceCard(s){return `<article class="service-card" data-card-id="${s.id}"><div class="service-visual ${s.visual}"><button class="favorite-btn ${state.favorites.has(s.id)?'active':''}" data-action="favorite" data-id="${s.id}" aria-label="찜하기">${state.favorites.has(s.id)?'♥':'♡'}</button><span aria-hidden="true">${s.icon}</span></div><button class="service-card-body" data-route-id="${s.id}" data-route="detail"><span class="relation ${s.relationType==='neighbor'?'neighbor':s.relationType==='local'?'local':''}">${s.relation}</span><h3>${s.name}</h3><p>${s.summary}</p><div class="service-meta"><span class="price">${s.price}</span><span class="benefit-tag">${s.benefit}</span></div></button></article>`}
function renderHome(){const resident=services.filter(s=>s.relationType==='resident').slice(0,4);return `<section class="home-hero"><div><div class="eyebrow">방림명지로드힐 단지온</div><h1>우리 단지 이웃의 가게와 서비스를 한눈에</h1><p>같은 아파트 주민이 하는 일을 먼저 찾고, 함께 이용해요.</p><div class="resident-status"><span class="resident-chip">✓ 방림명지로드힐 인증 입주민</span><button class="secondary-btn small-btn" data-route="verify">인증 정보 보기</button></div></div><div class="hero-visual"><strong>우리 단지 안에도 다양한 이웃 전문가가 있습니다.</strong><div class="hero-people">👩‍🍳🧑‍🔧👩‍🏫</div></div></section><div class="notice-line"><span class="notice-label">관리사무소 안내</span><strong>8월 6일 101동 승강기 점검</strong><button data-route="notice" data-route-id="4">내용 보기</button></div><section class="search-panel"><label class="search-label" for="home-search">어떤 가게나 서비스가 필요하세요?</label><div class="big-search"><input id="home-search" placeholder="예: 반찬, 에어컨 청소, 수학 과외" value="${esc(state.query)}"><button class="primary-btn" data-action="home-search">검색하기</button></div><div class="search-examples">${['반찬','자동차 수리','에어컨 청소','수학 과외','세무 상담','사진 촬영'].map(x=>`<button class="example-chip" data-action="quick-search" data-query="${x}">${x}</button>`).join('')}</div></section><section class="big-menu"><button data-action="menu-category" data-category="가게"><span class="menu-icon">🏪</span><strong>주민 가게</strong><small>같은 단지 주민이 운영하는 매장</small></button><button data-action="menu-category" data-category="서비스"><span class="menu-icon">🧰</span><strong>주민 서비스</strong><small>과외·수리·상담·방문 서비스</small></button><button data-route="benefits"><span class="menu-icon">🎁</span><strong>주민 혜택</strong><small>인증 주민만 받는 할인과 서비스</small></button><button data-route="register"><span class="menu-icon">📣</span><strong>내 일 알리기</strong><small>주민 사업자 무료 등록</small></button></section><section class="section"><div class="section-head"><div><h2>방림명지로드힐 주민의 가게와 서비스</h2><p>같은 단지에 사는 이웃이 직접 운영합니다.</p></div><button class="section-link" data-route="listings">모두 보기</button></div><div class="service-grid">${resident.map(serviceCard).join('')}</div><button class="wide-button" data-action="resident-all">주민 가게와 서비스 모두 보기</button></section><section class="section"><div class="section-head"><div><h2>이번 주 주민혜택</h2><p>방림명지로드힐 인증 입주민에게 제공됩니다.</p></div><button class="section-link" data-route="benefits">모두 보기</button></div><div class="benefit-grid">${benefits.slice(0,3).map(b=>`<button class="benefit-card" data-route="detail" data-route-id="${b.serviceId}"><span class="benefit-icon">${b.icon}</span><span><h3>${b.title}</h3><p>${b.name}</p><strong>${b.desc}</strong></span></button>`).join('')}</div><button class="wide-button" data-route="benefits">주민혜택 모두 보기</button></section><section class="section"><div class="section-head"><div><h2>새로 등록된 이웃</h2><p>최근 단지온에 합류한 가게와 서비스입니다.</p></div></div><div class="new-neighbor">${[services[5],services[6]].map(s=>`<button class="new-card" data-route="detail" data-route-id="${s.id}"><span class="new-thumb ${s.visual}">${s.icon}</span><span><h3>${s.name}</h3><p>${s.summary}</p><span class="new-label">${s.relation}</span></span></button>`).join('')}</div></section><section class="section"><div class="section-head"><div><h2>단지소식</h2><p>꼭 필요한 소식만 간단히 확인하세요.</p></div><button class="section-link" data-route="news">모두 보기</button></div><div class="news-list">${notices.slice(0,3).map(n=>`<button class="news-row" data-route="notice" data-route-id="${n.id}"><span class="news-source">${n.source}</span><span class="news-title">${n.title}</span><span class="news-date">${n.date.slice(5).replace('.','월 ')}일</span></button>`).join('')}</div><button class="wide-button" data-route="news">단지소식 모두 보기</button></section><footer class="footer-note">이 화면의 가게, 가격, 혜택과 주민관계는 시연을 위한 합성 예시입니다. 정확한 동·호수는 공개하지 않습니다.</footer>`}
function filteredServices(){let arr=[...services];if(state.category==='가게')arr=arr.filter(s=>s.type==='가게');else if(state.category==='서비스')arr=arr.filter(s=>s.type==='서비스');else if(state.category!=='전체')arr=arr.filter(s=>s.category===state.category);if(state.relation!=='전체')arr=arr.filter(s=>s.relationType===state.relation);const q=state.query.trim().toLowerCase();if(q)arr=arr.filter(s=>[s.name,s.category,s.summary,s.benefit].join(' ').toLowerCase().includes(q));return arr.sort((a,b)=>({resident:0,neighbor:1,local:2}[a.relationType]-{resident:0,neighbor:1,local:2}[b.relationType]))}
function renderListings(){const list=filteredServices();return `${pageHead('가게와 서비스','우리 단지 주민 운영을 먼저 보여드리고, 이웃 단지와 동네 가게 순으로 안내합니다.','<button class="coral-btn" data-route="register">내 일 알리기</button>')}<div class="filter-bar"><label for="list-search">필요한 일을 찾아보세요</label><input id="list-search" value="${esc(state.query)}" placeholder="가게·서비스 검색"><select id="relation-filter"><option value="전체">관계 전체</option><option value="resident" ${state.relation==='resident'?'selected':''}>방림명지로드힐 주민 운영</option><option value="neighbor" ${state.relation==='neighbor'?'selected':''}>이웃 단지 주민 운영</option><option value="local" ${state.relation==='local'?'selected':''}>우리 동네 가게</option></select><button class="primary-btn" data-action="apply-filter">검색</button></div><div class="listing-layout"><aside class="category-panel"><h2>분야</h2>${categories.map(c=>`<button class="category-btn ${state.category===c?'active':''}" data-action="category" data-category="${c}">${c}</button>`).join('')}</aside><section class="listing-main"><div class="result-summary"><strong>${list.length}개의 가게와 서비스</strong><span>주민 관계 순서로 표시됩니다.</span></div>${list.length?`<div class="service-grid">${list.map(serviceCard).join('')}</div>`:`<div class="empty">조건에 맞는 결과가 없습니다.<br>검색어를 줄이거나 분야를 다시 선택해 주세요.</div>`}</section></div>`}
function renderDetail(){const s=services.find(x=>x.id===state.selectedId)||services[0];return `${pageHead('가게·서비스 상세','주민 관계와 혜택을 먼저 확인할 수 있습니다.','<button class="secondary-btn" data-route="listings">목록으로</button>')}<div class="detail-layout"><section class="detail-gallery"><div class="detail-main-image ${s.visual}">${s.icon}</div><div class="detail-thumbs"><div class="detail-thumb ${s.visual}">${s.icon}</div><div class="detail-thumb ${s.visual}">🏠</div><div class="detail-thumb ${s.visual}">🤝</div></div></section><section class="detail-info"><span class="relation ${s.relationType==='neighbor'?'neighbor':s.relationType==='local'?'local':''}">${s.relation}</span><h1>${s.name}</h1><p class="summary">${s.summary}</p><div class="detail-price">${s.price}</div><div class="detail-benefit"><strong>주민 혜택 제공</strong><br>${s.benefit}<br><small>방림명지로드힐 입주민 인증 화면을 확인할 수 있습니다.</small></div><dl class="detail-list"><div class="detail-row"><dt>분야</dt><dd>${s.category}</dd></div><div class="detail-row"><dt>이용 지역</dt><dd>방림동과 인근 지역 · 상세 위치는 문의 시 안내</dd></div><div class="detail-row"><dt>연락 방법</dt><dd>전화 또는 문자 문의 · 연락처는 인증 입주민에게만 표시</dd></div><div class="detail-row"><dt>이용 시간</dt><dd>평일 오전 9시~오후 7시 · 사전 연락 권장</dd></div></dl><div class="detail-actions"><button class="secondary-btn" data-action="favorite" data-id="${s.id}">${state.favorites.has(s.id)?'♥ 찜한 가게':'♡ 찜하기'}</button><button class="coral-btn" data-action="contact" data-name="${s.name}">문의 방법 보기</button></div></section></div><section class="info-section"><h2>이웃이 소개하는 서비스</h2><p>${s.name}은(는) 방림명지로드힐과 인근 주민이 생활 속에서 편하게 이용할 수 있도록 등록한 가게·서비스입니다. 가격과 가능 시간은 실제 문의 시 다시 확인해 주세요.</p><div class="notice-box"><strong>관계 배지 안내</strong><br>‘${s.relation}’ 표시는 주민 관계를 확인했다는 뜻이며, 서비스 품질이나 거래 결과를 보증하는 표시는 아닙니다.</div></section>`}
function renderBenefits(){return `${pageHead('주민혜택','방림명지로드힐 인증 입주민에게 제공되는 혜택입니다.','<button class="secondary-btn" data-route="verify">입주민 인증 확인</button>')}<div class="benefit-grid">${benefits.map(b=>`<button class="benefit-card" data-route="detail" data-route-id="${b.serviceId}"><span class="benefit-icon">${b.icon}</span><span><h3>${b.title}</h3><p>${b.name}</p><strong>${b.desc}</strong></span></button>`).join('')}</div><div class="notice-box" style="margin-top:18px"><strong>혜택 이용 방법</strong><br>가게에 방문하거나 서비스를 신청할 때 단지온의 ‘방림명지로드힐 인증 입주민’ 화면을 보여주세요. 실제 적용 조건은 상세 화면에서 확인해야 합니다.</div>`}
function renderNews(){return `${pageHead('단지소식','입주자대표회의와 관리사무소 등의 최신 소식을 읽기 쉽게 모았습니다.','<button class="secondary-btn" data-route="home">홈으로</button>')}<div class="filter-bar"><label for="news-category">소식 분류</label><select id="news-category"><option>전체</option><option>중요 안내</option><option>입대의 활동</option><option>관리사무소 안내</option><option>단지 행사</option><option>주민 사업자 소식</option></select><button class="primary-btn" data-action="news-filter">보기</button></div><div class="simple-list" id="news-list">${notices.map(n=>`<button data-route="notice" data-route-id="${n.id}" data-category="${n.category}"><span class="source">${n.source}</span><span class="title">${n.title}</span><span class="date">${n.date}</span></button>`).join('')}</div>`}
function renderNotice(){const n=notices.find(x=>x.id===state.selectedId)||notices[0];return `<article class="notice-detail"><button class="plain-btn" data-route="news">← 단지소식 목록</button><div style="margin-top:18px"><span class="relation local">${n.category}</span><h1>${n.title}</h1><div class="notice-meta"><strong>${n.source}</strong><span>게시일 ${n.date}</span></div></div><div class="notice-content"><p>${n.body}</p><p>주민 여러분이 내용을 쉽게 확인할 수 있도록 핵심 정보만 간단히 안내합니다. 추가 확인이 필요한 경우 관리사무소 또는 해당 게시 주체의 공식 안내를 확인해 주세요.</p></div><div class="notice-attachment"><span><strong>첨부 안내문</strong><br><small>시연용 파일 · 실제 다운로드는 제공하지 않습니다.</small></span><button class="secondary-btn small-btn" data-action="attachment">내용 미리보기</button></div></article>`}
function renderMy(){return `${pageHead('내정보','입주민 인증, 찜한 가게와 내 가게 등록을 관리합니다.')}<div class="my-grid"><section class="my-card profile-card"><h2>방림명지로드힐 인증 입주민</h2><p>별명 ‘온이웃’으로 이용 중입니다. 정확한 동·호수는 다른 주민에게 공개되지 않습니다.</p><span class="resident-chip">✓ 인증 완료</span></section><section class="my-card"><h2>내 이용정보</h2><button data-route="favorites">♥ 찜한 가게 ${state.favorites.size}개</button><button data-route="verify">✓ 입주민 인증 정보</button><button data-action="notifications">🔔 알림 확인</button></section><section class="my-card"><h2>내 일 알리기</h2><button data-route="register">📣 내 가게·서비스 등록</button><button data-route="ai-promo">✨ 홍보물 미리보기</button><button data-action="my-listing">🏪 등록한 가게 관리</button></section><section class="my-card"><h2>화면과 이용설정</h2><button data-action="large-text">가＋ 글자 크게 켜기/끄기</button><button data-action="privacy">🔒 공개범위 확인</button></section><section class="my-card"><h2>운영 시연</h2><button data-route="admin">⚙ 등록 신청과 소식 관리</button><p class="help">실제 주민 화면에는 운영 메뉴가 노출되지 않습니다. 시연을 위해 내정보 안에만 배치했습니다.</p></section></div>`}
function renderVerify(){return `${pageHead('입주민 인증','가게 연락처와 주민혜택을 안전하게 이용하기 위한 간단한 인증입니다.','<button class="secondary-btn" data-route="my">내정보로</button>')}<div class="form-card"><div class="step-indicator"><div class="step done">1. 단지 선택</div><div class="step done">2. 세대 확인</div><div class="step done">3. 휴대전화</div><div class="step active">4. 완료</div></div><div class="notice-box"><strong>방림명지로드힐 입주민 인증이 완료됐습니다.</strong><br>주민명부, 신분증, 관리비 고지서가 다른 주민에게 공개되지 않습니다.</div><div class="field-grid" style="margin-top:20px"><div class="field"><label>단지</label><input value="방림명지로드힐" disabled></div><div class="field"><label>공개 이름</label><input value="온이웃" disabled></div><div class="field"><label>공개범위</label><input value="인증 입주민으로만 표시" disabled></div><div class="field"><label>인증상태</label><input value="인증 완료" disabled></div></div><button class="wide-button" data-route="home">홈으로 돌아가기</button></div>`}
function renderFavorites(){const list=services.filter(s=>state.favorites.has(s.id));return `${pageHead('찜한 가게','나중에 다시 보고 싶은 가게와 서비스를 모았습니다.','<button class="secondary-btn" data-route="my">내정보로</button>')}${list.length?`<div class="service-grid">${list.map(serviceCard).join('')}</div>`:`<div class="empty">아직 찜한 가게가 없습니다.</div>`}`}
function renderRegister(){const s=state.registerStep;return `${pageHead('내 가게·서비스 등록','방림명지로드힐 주민 사업자는 무료로 자신의 일을 알릴 수 있습니다.','<button class="secondary-btn" data-route="my">나중에 하기</button>')}<div class="form-card"><div class="step-indicator">${[1,2,3,4].map((n,i)=>`<div class="step ${n===s?'active':n<s?'done':''}">${n}. ${['주민 관계','기본 정보','사진과 혜택','등록 신청'][i]}</div>`).join('')}</div>${renderRegisterStep(s)}<div class="form-actions"><button class="secondary-btn" data-action="register-prev" ${s===1?'disabled':''}>이전</button><button class="${s===4?'coral-btn':'primary-btn'}" data-action="register-next">${s===4?'등록 신청 완료':'다음 단계'}</button></div></div>`}
function renderRegisterStep(s){if(s===1)return `<h2>어떤 관계로 운영하시나요?</h2><p class="help">한 번에 하나만 선택해 주세요. 확인에 필요한 자료는 공개되지 않습니다.</p><div class="choice-grid" style="margin-top:16px">${['방림명지로드힐 주민이 직접 운영','방림명지로드힐 주민 가족이 운영','이웃 단지 주민이 운영','일반 동네 가게이며 주민혜택 제공'].map(x=>`<button class="choice ${state.registerData.relation===x?'active':''}" data-action="relation-choice" data-value="${x}"><strong>${x}</strong><span class="help">${x.includes('직접')?'같은 단지 주민이 직접 하는 일입니다.':x.includes('가족')?'가족이 운영하며 주민이 관계를 확인합니다.':x.includes('이웃')?'가까운 아파트 주민이 운영합니다.':'우리 단지 주민에게 혜택을 제공합니다.'}</span></button>`).join('')}</div>`;if(s===2)return `<h2>기본 정보를 알려주세요</h2><div class="field-grid"><div class="field"><label>가게 또는 서비스 이름</label><input id="reg-name" value="${esc(state.registerData.name||'정성 홈베이킹')}" placeholder="이름을 입력하세요"></div><div class="field"><label>업종</label><select id="reg-category">${categories.slice(1).map(c=>`<option>${c}</option>`).join('')}</select></div><div class="field full"><label>대표 서비스</label><input id="reg-service" value="${esc(state.registerData.service||'주문형 수제 쿠키와 답례품')}" placeholder="가장 잘하는 일을 적어주세요"></div><div class="field"><label>가격 또는 상담 기준</label><input value="상담 후 안내"></div><div class="field"><label>연락 방법</label><select><option>전화와 문자</option><option>문자만</option><option>카카오톡</option></select></div><div class="field full"><label>서비스 지역</label><input value="방림동과 인근 지역"></div></div>`;if(s===3)return `<h2>사진과 주민혜택을 등록하세요</h2><div class="field-grid"><div class="field full"><label>대표사진</label><button class="upload-box" data-action="upload-demo">📷<br><strong>사진 선택하기</strong><br><span class="help">선명한 작업 사진이나 상품 사진을 권장합니다.</span></button></div><div class="field"><label>주민혜택</label><input value="방림명지로드힐 주민 첫 주문 10% 할인"></div><div class="field"><label>이용 가능 시간</label><input value="평일 오전 10시~오후 6시"></div></div>`;return `<h2>공개 정보를 확인하세요</h2><div class="simple-list"><div class="list-row"><span class="source">주민 관계</span><span class="title">${state.registerData.relation}</span><span></span></div><div class="list-row"><span class="source">이름</span><span class="title">${state.registerData.name||'정성 홈베이킹'}</span><span></span></div><div class="list-row"><span class="source">대표 서비스</span><span class="title">${state.registerData.service||'주문형 수제 쿠키와 답례품'}</span><span></span></div><div class="list-row"><span class="source">주민혜택</span><span class="title">첫 주문 10% 할인</span><span></span></div></div><div class="notice-box"><strong>비공개 인증정보 안내</strong><br>동·호수와 관계 확인자료는 운영 확인에만 사용하며 가게 상세화면에 공개하지 않습니다.</div>`}
function renderAiPromo(){return `${pageHead('AI 홍보물 미리보기','기본 등록정보를 바탕으로 주민이 보기 쉬운 홍보물을 자동으로 구성합니다.','<button class="secondary-btn" data-route="register">등록정보 수정</button>')}<div class="preview-grid"><section class="preview-item"><div class="preview-canvas"><span class="promo-icon">🍪</span><h3>정성 홈베이킹</h3><p>우리 단지 이웃이 만드는 수제 쿠키와 답례품</p></div><div class="preview-caption">모바일 홍보카드</div></section><section class="preview-item"><div class="preview-canvas"><span class="promo-icon">🎁</span><h3>방림명지로드힐 주민 첫 주문 10% 할인</h3><p>인증 입주민 화면을 보여주세요.</p></div><div class="preview-caption">주민혜택 카드</div></section><section class="preview-item"><div class="preview-canvas"><span class="promo-icon">📌</span><h3>엘리베이터 게시판용 안내</h3><p>주문형 수제 쿠키 · 답례품 상담</p></div><div class="preview-caption">게시판 포스터</div></section><section class="preview-item"><div class="preview-canvas"><span class="promo-icon">💬</span><h3>이웃에게 편하게 공유하세요</h3><p>짧은 소개와 연락 방법을 한 장에 담았습니다.</p></div><div class="preview-caption">카카오톡 공유 이미지</div></section></div><button class="wide-button coral" data-action="generate-promo">내 홍보물 만들어 보기</button>`}
function renderAdmin(){return `${pageHead('최소 운영 화면','등록 신청 확인과 단지소식·혜택만 간단히 관리합니다.','<button class="secondary-btn" data-route="my">주민 화면으로</button>')}<div class="admin-tabs"><button class="${state.adminTab==='applications'?'active':''}" data-action="admin-tab" data-tab="applications">등록 신청</button><button class="${state.adminTab==='news'?'active':''}" data-action="admin-tab" data-tab="news">단지소식 작성</button><button class="${state.adminTab==='benefits'?'active':''}" data-action="admin-tab" data-tab="benefits">혜택 등록</button></div>${state.adminTab==='applications'?renderApplications():state.adminTab==='news'?renderAdminNews():renderAdminBenefits()}`}
function renderApplications(){return `<table class="admin-table"><thead><tr><th>신청 가게·서비스</th><th>신청 관계</th><th>업종</th><th>상태</th><th>확인</th></tr></thead><tbody>${applications.map(a=>`<tr><td><strong>${a.name}</strong></td><td>${a.relation}</td><td>${a.category}</td><td><span class="status ${a.status==='보완 요청'?'fix':'pending'}">${a.status}</span></td><td><button class="primary-btn small-btn" data-action="review-application" data-id="${a.id}">검토하기</button></td></tr>`).join('')}</tbody></table>`}
function renderAdminNews(){return `<div class="form-card"><h2>단지소식 작성</h2><div class="field-grid"><div class="field"><label>게시 주체</label><select><option>입주자대표회의</option><option>관리사무소</option><option>선거관리위원회</option><option>단지온 운영자</option></select></div><div class="field"><label>분류</label><select>${['중요 안내','입대의 활동','관리사무소 안내','단지 행사','주민 사업자 소식'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field full"><label>제목</label><input placeholder="소식 제목을 입력하세요"></div><div class="field full"><label>내용</label><textarea placeholder="주민이 쉽게 이해할 수 있도록 핵심 내용만 작성하세요"></textarea></div></div><button class="wide-button" data-action="save-admin-news">단지소식 저장</button></div>`}
function renderAdminBenefits(){return `<div class="form-card"><h2>주민혜택 등록 및 수정</h2><div class="field-grid"><div class="field"><label>가게·서비스</label><select>${services.map(s=>`<option>${s.name}</option>`).join('')}</select></div><div class="field"><label>혜택 이름</label><input value="첫 방문 10% 할인"></div><div class="field full"><label>이용 조건</label><input value="방림명지로드힐 인증 입주민 화면 제시"></div><div class="field"><label>시작일</label><input type="date" value="2026-08-04"></div><div class="field"><label>종료일</label><input type="date" value="2026-08-31"></div></div><button class="wide-button coral" data-action="save-benefit">혜택 저장</button></div>`}
function render(){let html='';if(state.route==='home')html=renderHome();else if(state.route==='listings'||state.route==='search')html=renderListings();else if(state.route==='detail')html=renderDetail();else if(state.route==='benefits')html=renderBenefits();else if(state.route==='news')html=renderNews();else if(state.route==='notice')html=renderNotice();else if(state.route==='my')html=renderMy();else if(state.route==='verify')html=renderVerify();else if(state.route==='favorites')html=renderFavorites();else if(state.route==='register')html=renderRegister();else if(state.route==='ai-promo')html=renderAiPromo();else if(state.route==='admin')html=renderAdmin();document.getElementById('app').innerHTML=html;updateNav()}
function showModal(title,body,foot='<button class="primary-btn" data-action="close-modal">확인</button>'){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="modal-close" data-action="close-modal" aria-label="닫기">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div></div>`}
function toast(msg,type=''){document.getElementById('toast-root').innerHTML=`<div class="toast ${type}">${msg}</div>`;setTimeout(()=>document.getElementById('toast-root').innerHTML='',2200)}
document.addEventListener('click',e=>{const routeEl=e.target.closest('[data-route]');if(routeEl){const id=+routeEl.dataset.routeId||null;navigate(routeEl.dataset.route,id);return}const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;if(a==='close-modal'){document.getElementById('modal-root').innerHTML='';return}if(a==='large-text'){state.largeText=!state.largeText;document.body.classList.toggle('large-text',state.largeText);toast(state.largeText?'글자를 크게 표시합니다.':'기본 글자 크기로 돌아왔습니다.');return}if(a==='notifications'){showModal('알림','<div class="simple-list"><div class="list-row"><span class="source">관리사무소</span><span class="title">8월 6일 승강기 점검 안내</span><span class="date">오늘</span></div><div class="list-row"><span class="source">단지온</span><span class="title">새 주민혜택이 등록됐습니다.</span><span class="date">어제</span></div></div>');return}if(a==='home-search'){state.query=document.getElementById('home-search')?.value||'';state.category='전체';navigate('search');return}if(a==='quick-search'){state.query=btn.dataset.query;state.category='전체';navigate('search');return}if(a==='menu-category'){state.query='';state.category=btn.dataset.category;state.relation='resident';navigate('listings');return}if(a==='resident-all'){state.query='';state.category='전체';state.relation='resident';navigate('listings');return}if(a==='category'){state.category=btn.dataset.category;render();return}if(a==='apply-filter'){state.query=document.getElementById('list-search')?.value||'';state.relation=document.getElementById('relation-filter')?.value||'전체';render();return}if(a==='favorite'){const id=+btn.dataset.id;state.favorites.has(id)?state.favorites.delete(id):state.favorites.add(id);render();toast(state.favorites.has(id)?'찜한 가게에 담았습니다.':'찜을 해제했습니다.');return}if(a==='contact'){showModal('문의 방법 보기',`<div class="notice-box"><strong>${esc(btn.dataset.name)}</strong><br>인증 입주민에게만 연락처를 표시합니다.</div><div style="display:grid;gap:9px;margin-top:15px"><button class="secondary-btn" data-action="contact-demo">전화번호 보기</button><button class="secondary-btn" data-action="contact-demo">문자 문의하기</button></div>`,'<button class="primary-btn" data-action="close-modal">닫기</button>');return}if(a==='contact-demo'){toast('시연용 화면이므로 실제 연락은 연결하지 않습니다.');return}if(a==='attachment'){showModal('첨부 안내문','<div style="min-height:220px;background:#f2f5f4;border-radius:12px;display:grid;place-items:center;text-align:center;padding:20px"><strong>시연용 안내문 미리보기</strong><br>실제 파일 다운로드는 제공하지 않습니다.</div>');return}if(a==='news-filter'){const c=document.getElementById('news-category')?.value||'전체';document.querySelectorAll('#news-list button').forEach(x=>x.classList.toggle('hidden',c!=='전체'&&x.dataset.category!==c));toast(c==='전체'?'전체 소식을 표시합니다.':`${c} 소식만 표시합니다.`);return}if(a==='my-listing'){toast('등록된 가게가 승인되면 이곳에서 수정할 수 있습니다.');return}if(a==='privacy'){showModal('공개범위','<p><strong>다른 주민에게 표시:</strong> 인증 입주민, 별명</p><p><strong>표시하지 않음:</strong> 정확한 동·호수, 휴대전화 인증정보, 주민 관계 확인자료</p>');return}if(a==='relation-choice'){state.registerData.relation=btn.dataset.value;render();return}if(a==='register-prev'){if(state.registerStep>1){state.registerStep--;render()}return}if(a==='register-next'){if(state.registerStep===2){state.registerData.name=document.getElementById('reg-name')?.value||state.registerData.name;state.registerData.service=document.getElementById('reg-service')?.value||state.registerData.service}if(state.registerStep<4){state.registerStep++;render()}else{toast('등록 신청이 완료됐습니다.','success');state.registerStep=1;navigate('ai-promo')}return}if(a==='upload-demo'){toast('시연용 화면에서는 사진을 저장하지 않습니다.');return}if(a==='generate-promo'){toast('등록정보를 바탕으로 홍보물 시안을 만들었습니다.','success');return}if(a==='admin-tab'){state.adminTab=btn.dataset.tab;render();return}if(a==='review-application'){const app=applications.find(x=>x.id===+btn.dataset.id);showModal('주민 운영 여부 확인',`<div class="simple-list"><div class="list-row"><span class="source">신청명</span><span class="title">${app.name}</span><span></span></div><div class="list-row"><span class="source">신청 관계</span><span class="title">${app.relation}</span><span></span></div><div class="list-row"><span class="source">현재 상태</span><span class="title">${app.status}</span><span></span></div></div><div class="notice-box">동·호수와 확인자료는 검수에만 사용하고 주민 화면에 공개하지 않습니다.</div>`,'<button class="secondary-btn" data-action="review-result" data-result="보완 요청">보완 요청</button><button class="secondary-btn" data-action="review-result" data-result="반려">반려</button><button class="primary-btn" data-action="review-result" data-result="승인">승인</button>');return}if(a==='review-result'){document.getElementById('modal-root').innerHTML='';toast(`${btn.dataset.result} 처리했습니다. 기록은 시연용입니다.`,'success');return}if(a==='save-admin-news'){toast('단지소식을 저장했습니다.','success');return}if(a==='save-benefit'){toast('주민혜택을 저장했습니다.','success');return}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement?.id==='home-search'){state.query=document.getElementById('home-search').value;navigate('search')}if(e.key==='Escape')document.getElementById('modal-root').innerHTML=''});
render();
</script>
</body>
</html>
