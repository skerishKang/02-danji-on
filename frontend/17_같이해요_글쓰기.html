<span class="category">같이해요</span><h1>함께할 일을 고르고 필요한 정보만 적어보세요.</h1><p class="lead">사용자님이 만든 네 가지 전용 폼을 탭으로 유지합니다. 탭을 바꾸면 필요한 항목만 바로 바뀝니다.</p>

<form id="writeForm"><section class="editor"><div class="field"><label for="title">제목 <small>40자 이내</small></label><input autocomplete="off" class="title-input" id="title" maxlength="40" placeholder="무엇을 같이하고 싶은지 적어주세요."/></div><div class="field"><label for="body">자세한 내용 <small><span id="bodyCount">0</span>/1000</small></label><textarea class="body-input" id="body" maxlength="1000" placeholder="누가, 언제, 어디에서, 어떻게 함께하면 되는지 적어주세요."></textarea></div><div class="dynamic" id="dynamicFields"></div><p class="safety" id="safety"></p><p class="rule">공개 글에는 개인 연락처를 적지 마세요. 필요한 연락은 단지온 메시지를 이용합니다.</p></section></form>
</main>

<script>
(function(){
  try{history.scrollRestoration='manual'}catch(e){}; requestAnimationFrame(()=>window.scrollTo(0,0));
 const COMMUNITY='12_이웃대화_첫화면.html?type=together';
 const data={
  walk:{title:'산책·운동',description:'가볍게 걷거나 운동할 이웃을 모집합니다.',safety:'처음 만나는 이웃과는 밝고 열린 장소에서 만나고, 개인 연락처는 메시지에서 필요한 경우에만 나누세요.',fields:[['date','날짜','date',''],['time','시간','time',''],['place','만나는 곳','text','예: 101동 앞 정자'],['people','모집 인원','number','예: 4']]},
  hobby:{title:'취미활동',description:'관심사가 같은 이웃과 가볍게 취미를 시작합니다.',safety:'반복 모임이라면 주기와 회비·준비물·장소 대여비가 있다면 정확히 알려주세요.',fields:[['activity','활동 내용','text','예: 독서모임'],['date','첫 모임 날짜','date',''],['time','시간','time',''],['place','장소','text','예: 작은도서관'],['supply','준비물','text','예: 읽을 책 한 권']]},
  parent:{title:'육아 같이해요',description:'보호자와 아이가 함께 참여하는 놀이와 만남을 제안합니다.',safety:'보호자 동반 모임만 가능합니다. 아이 맡기기·돌봄 중개·보호자 없는 만남은 등록할 수 없습니다.',fields:[['childCount','함께 오는 아이 수','number','예: 2'],['age','아이 연령대','text','예: 5~7세'],['date','날짜','date',''],['time','시간','time',''],['place','만나는 곳','text','예: 단지 놀이터'],['guardianCount','보호자 수','number','예: 2']]},
  group:{title:'공동구매',description:'필요한 물품을 함께 주문할 참여자를 모집합니다.',safety:'주최자가 품목·비용·환불·수령방법을 정확히 안내해야 합니다. 단지온은 판매자나 결제 중개자가 아닙니다.',fields:[['item','품목·수량','text','예: 복숭아 4kg 한 상자'],['price','1인 예상 비용','text','예: 18,000원'],['deadline','모집 마감일','date',''],['pickupDate','수령일','date',''],['pickupTime','수령시간','time',''],['pickupPlace','수령장소','text','예: 101동 앞'],['payment','결제 방법','text','예: 주문 확정 후 안내'],['refund','취소·환불 안내','text','예: 주문 전까지 취소 가능']]}
 };
 const title=document.getElementById('title'),body=document.getElementById('body'),dynamic=document.getElementById('dynamicFields');let selected='walk';const key='danjionDraft:17:v2';let drafts={};
 function reportRoute(){try{if(parent!==window)parent.postMessage({type:'danjion-route',file:'17_같이해요_글쓰기.html',href:location.href},'*')}catch(e){}}reportRoute();addEventListener('pageshow',reportRoute);
 function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1700)}
 try{drafts=JSON.parse(localStorage.getItem(key)||'{}')||{};if(data[drafts.__selected])selected=drafts.__selected}catch(e){drafts={}}
 function save(){const fields={};dynamic.querySelectorAll('input').forEach(i=>fields[i.name]=i.value);drafts[selected]={title:title.value,body:body.value,fields};drafts.__selected=selected;try{localStorage.setItem(key,JSON.stringify(drafts))}catch(e){}}
 function fieldMarkup(f){const [id,label,type,ph]=f;return `<div class="field${f.length>4?' full':''}"><label for="dyn_${id}">${label}<small>필수</small></label><input class="dynamic-input" id="dyn_${id}" name="${id}" type="${type}" ${type==='number'?'min="1" inputmode="numeric"':''} placeholder="${ph||''}" required></div>`}
 function render(){const item=data[selected];document.querySelectorAll('.type-tab').forEach(b=>{const on=b.dataset.kind===selected;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});document.getElementById('typeHelp').textContent=item.description;document.getElementById('safety').textContent=item.safety;dynamic.innerHTML=item.fields.map(fieldMarkup).join('');const d=drafts[selected]||{};title.value=d.title||'';body.value=d.body||'';document.getElementById('bodyCount').textContent=body.value.length;dynamic.querySelectorAll('input').forEach(i=>{if(d.fields&&Object.prototype.hasOwnProperty.call(d.fields,i.name))i.value=d.fields[i.name];i.addEventListener('input',save);i.addEventListener('change',save)})}
 document.querySelectorAll('.type-tab').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.kind===selected)return;save();selected=b.dataset.kind;drafts.__selected=selected;render();save()}));
 title.addEventListener('input',save);body.addEventListener('input',()=>{document.getElementById('bodyCount').textContent=body.value.length;save()});document.querySelector('.back').addEventListener('click',()=>{save();location.href=COMMUNITY});
 function publish(){save();if(!title.value.trim()){toast('제목을 입력해주세요.');title.focus();return}if(body.value.trim().length<5){toast('자세한 내용을 조금 더 적어주세요.');body.focus();return}const missing=[...dynamic.querySelectorAll('input[required]')].find(i=>!i.value.trim());if(missing){toast(missing.previousElementSibling?.textContent?.replace('필수','').trim()+'을(를) 입력해주세요.');missing.focus();return}delete drafts[selected];try{localStorage.setItem(key,JSON.stringify(drafts))}catch(e){}toast(data[selected].title+' 글을 게시했습니다.');setTimeout(()=>location.href=COMMUNITY,650)}document.querySelectorAll('[data-publish]').forEach(b=>b.addEventListener('click',publish));render();
})();
