  ev.preventDefault();ev.stopImmediatePropagation();
  if(busy)return;
  if(!title.value.trim()){toast('제목을 입력해주세요.');title.focus();return}
  if(body.value.trim().length<5){toast('자세한 내용을 조금 더 적어주세요.');body.focus();return}
  const category=togetherCategory();
  if(!category){toast('같이해요 유형을 선택해주세요.');return}
  busy=true;setBusy(true);
  bridge.createPost({kind:'together',category,title:title.value.trim(),body:body.value.trim()}).then(r=>{
   if(r.ok&&r.mode==='server'){
    clearAuthHelp();
    try{localStorage.removeItem(key)}catch(e){}
    const pending=r.post&&r.post.status!=='published';
    toast(pending?'글이 저장되었습니다. 공개 전 상태를 확인합니다.':'게시했습니다.');
    setTimeout(()=>{location.href=nextHref(r.post)},650);
   }else{const message=serverMessage(r);showAuthHelp(r);toast(message);}
  }).catch(()=>{clearAuthHelp();toast('서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.');}).finally(()=>{busy=false;setBusy(false)});
 },true);
 document.addEventListener('click',ev=>{
  if(!ev.target.closest('.back'))return;
  ev.preventDefault();ev.stopImmediatePropagation();
  location.href=COMMUNITY;
 },true);
})();
</script>
</body></html>
