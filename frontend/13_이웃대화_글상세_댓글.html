<article class="article"><span class="type" id="typeLabel"></span><div class="author"><span class="avatar" id="avatar"></span><div><b id="author"></b><small id="levelTime"></small></div></div><h1 id="title"></h1><div class="body" id="body"></div><div class="actions"><button id="likeBtn" type="button">♡ 공감 <span id="likeCount"></span></button><button id="focusComment" type="button">댓글 <span id="commentCount"></span></button></div></article>

<script>
(()=>{
const DATA={
hello:{label:'가입인사',author:'초록문',level:'새 이웃',time:'18분 전',title:'안녕하세요. 오늘 단지온에 처음 가입했어요.',body:'이사 온 지는 조금 됐지만 이웃분들과 인사할 기회가 많지 않았어요.\n단지 소식도 확인하고 생활정보도 편하게 나누고 싶습니다. 잘 부탁드립니다.',likes:12,comments:[['산책메이트','인사하는 이웃','반가워요. 단지온에서 자주 뵈어요!'],['한울타리','참여하는 이웃','환영합니다. 궁금한 게 있으면 편하게 물어보세요.']]},
story:{label:'단지이야기',author:'길고양이',level:'도움 주는 이웃',time:'41분 전',title:'오늘 분리수거장이 깨끗하게 정리되어 있네요.',body:'아침에 내려갔는데 종류별로 가지런히 정리되어 있어서 편하게 이용했습니다.\n이른 시간부터 정리해주신 분께 감사드려요.',likes:19,comments:[['맑은하루','참여하는 이웃','저도 오늘 깨끗해진 걸 보고 기분이 좋았어요.']]},
question:{label:'궁금해요',author:'연블리',level:'참여하는 이웃',time:'1시간 전',title:'세탁기 청소 맡겨보신 분 계실까요?',body:'오래 사용해서 한 번 제대로 분해 청소를 하려고 해요.\n직접 이용해보신 곳 중 설명을 잘해준 곳이 있으면 알려주세요.',likes:4,comments:[['살림손','도움 주는 이웃','지난달에 이용한 곳이 전후 사진을 보내줘서 좋았어요.']]},
together:{label:'같이해요',author:'봄날',level:'인사하는 이웃',time:'2시간 전',title:'평일 저녁에 단지 주변 같이 걸으실 분 계세요?',body:'저녁 8시쯤 가볍게 30분 정도 걸으려고 합니다.\n빠르게 걷지 않아도 괜찮고 이번 주 수요일부터 시작하면 좋겠어요.',likes:7,comments:[['저녁바람','인사하는 이웃','8시면 저도 가능해요. 수요일에 함께 걸어요.']]}
};
const qs=new URLSearchParams(location.search);let type=qs.get('type')||'hello';if(!DATA[type])type='hello';const d=DATA[type];
const fromAll=qs.get('from')==='all';document.getElementById('backLink').href='12_이웃대화_첫화면.html?type='+type+(fromAll?'&view=all':'');
typeLabel.textContent=d.label;avatar.textContent=d.author.slice(0,1);author.textContent=d.author;levelTime.textContent=d.level+' · '+d.time;title.textContent=d.title;body.textContent=d.body;likeCount.textContent=d.likes;
let liked=false, comments=d.comments.map((x,i)=>({name:x[0],level:x[1],text:x[2],replies:i===0?[{name:'연블리',text:'답변 고맙습니다!'}]:[]}));
function updateCounts(){commentCount.textContent=comments.length;commentTitleCount.textContent=comments.length}
function renderComments(){commentList.innerHTML=comments.map((c,i)=>`<li class="comment"><div class="comment-head"><b>${c.name}</b><span>${c.level}</span><time>방금 전</time></div><p>${c.text}</p><div class="comment-tools"><button type="button" data-clike="${i}">♡ 공감 0</button><button type="button" data-reply="${i}">답글</button></div><div class="replies">${c.replies.map(r=>`<div class="reply"><b>↳ ${r.name}</b><p>${r.text}</p></div>`).join('')}</div><form class="reply-form" data-rform="${i}"><input maxlength="200" placeholder="${c.name}님에게 답글"><button type="submit">등록</button></form></li>`).join('');updateCounts()}
likeBtn.addEventListener('click',()=>{liked=!liked;likeCount.textContent=d.likes+(liked?1:0);likeBtn.classList.toggle('liked',liked);likeBtn.firstChild.textContent=liked?'♥ 공감 ':'♡ 공감 '});
focusComment.addEventListener('click',()=>{commentText.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>commentText.focus(),250)});
commentList.addEventListener('click',e=>{const r=e.target.closest('[data-reply]');if(r){const form=document.querySelector(`[data-rform="${r.dataset.reply}"]`);form.classList.toggle('open');form.querySelector('input').focus();return}const l=e.target.closest('[data-clike]');if(l){const on=l.dataset.on==='1';l.dataset.on=on?'0':'1';l.textContent=(on?'♡ 공감 0':'♥ 공감 1')}});
commentList.addEventListener('submit',e=>{const f=e.target.closest('.reply-form');if(!f)return;e.preventDefault();const input=f.querySelector('input'),v=input.value.trim();if(!v)return;comments[Number(f.dataset.rform)].replies.push({name:'연블리',text:v});renderComments()});
commentForm.addEventListener('submit',e=>{e.preventDefault();const v=commentText.value.trim();if(!v)return;comments.push({name:'연블리',level:'참여하는 이웃',text:v,replies:[]});commentText.value='';renderComments();commentList.lastElementChild?.scrollIntoView({behavior:'smooth',block:'center'})});
renderComments();
})();
</script></body></html>
