 function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function timeAgo(iso){
  const t=Date.parse(iso||''); if(!Number.isFinite(t))return '';
  const m=Math.floor((Date.now()-t)/60000);
  if(m<1)return '방금 전'; if(m<60)return m+'분 전';
  const h=Math.floor(m/60); if(h<24)return h+'시간 전';
  const d=Math.floor(h/24); if(d<30)return d+'일 전';
  return new Date(t).toLocaleDateString();
 }
 function flash(msg){
  if(interactionStatus)interactionStatus.textContent=msg;
  if(foot)foot.textContent=msg;
  clearTimeout(flashTimer);
  flashTimer=setTimeout(()=>{if(interactionStatus)interactionStatus.textContent='';if(foot)foot.textContent=HINT},4000);
 }
 function failMessage(result){
  if(result&&result.mode==='auth-required')return result.status===403?'본인 확인된 입주민만 이용할 수 있습니다.':'로그인이 만료되었습니다. 다시 로그인한 뒤 이용해 주세요.';
  if(result&&result.status===404)return '게시물을 찾을 수 없습니다.';
  return '서버 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.';
 }
  function renderLike(){
   likeCount.textContent=count;
   likeBtn.classList.toggle('liked',liked);
   likeBtn.firstChild.textContent=liked?'♥ 공감 ':'♡ 공감 ';
  }
  function renderPostActions(){
   const canEdit=Boolean(post&&post.viewerCanEdit),canDelete=Boolean(post&&post.viewerCanDelete),canReport=Boolean(post&&post.viewerCanReport);
   postEditBtn.hidden=!canEdit;
   postDeleteBtn.hidden=!canDelete;
   postReportBtn.hidden=!canReport;
   postActionTools.hidden=!(canEdit||canDelete||canReport);
  }
  function openPostEditor(){
   if(!post||!post.viewerCanEdit)return;
   postEditTitle.value=post.title;
   postEditBody.value=post.body;
   postEditPanel.hidden=false;
   postEditTitle.focus();
  }
  function closePostEditor(){
   postEditPanel.hidden=true;
  }
  function openReport(targetType,targetId){
   if(targetType==='post'&&(!post||!post.viewerCanReport))return;
   reportTargetState={targetType,targetId};
   reportTitle.textContent=targetType==='post'?'글 신고하기':'댓글 신고하기';
   reportReason.value='other';
   reportDetail.value='';
   reportStatus.textContent='';
   reportReason.disabled=false;
   reportDetail.disabled=false;
   document.getElementById('reportSubmit').disabled=false;
   reportPanel.hidden=false;
   reportReason.focus();
  }
  function closeReport(){
   reportPanel.hidden=true;
    reportTargetState=null;
   }

   function gatedCommentState(msg){
   commentList.innerHTML='<li class="comment"><p>'+esc(msg)+'</p></li>';
   commentCount.textContent='0';
   commentTitleCount.textContent='0';
   commentLoadMore.hidden=true;
  }
  function serverCommentHTML(c){
   const id=esc(c.id);
   const pending=c.status!=='published'?'<span>게시 대기 중</span>':'';
   const deleteButton=c.viewerCanDelete?'<button type="button" data-server-comment-delete="'+id+'">삭제</button>':'';
   const reportButton=c.viewerCanReport?'<button type="button" data-server-comment-report="'+id+'">신고</button>':'';
   return '<li class="comment" data-server-comment="'+id+'"><div class="comment-head"><b>'+esc(c.author.nickname)+'</b><time>'+esc(timeAgo(c.publishedAt||c.createdAt))+'</time></div><p>'+esc(c.body)+'</p><div class="comment-tools">'+pending+'<button type="button" data-server-reply-toggle="'+id+'">답글 보기</button><button type="button" data-server-reply="'+id+'">답글</button>'+deleteButton+reportButton+'</div><div class="replies" data-server-replies="'+id+'"></div><form class="server-reply-form" data-server-reply-form="'+id+'"><input maxlength="300" placeholder="'+esc(c.author.nickname)+'님에게 답글"><button type="submit">등록</button></form></li>';
  }
  function replyHTML(r){return '<div class="reply" data-server-reply-id="'+esc(r.id)+'"><b>↳ '+esc(r.author.nickname)+'</b><p>'+esc(r.body)+'</p></div>'}
  function renderReplyState(commentId,state){
   const host=commentList.querySelector('[data-server-replies="'+commentId+'"]');
   if(!host)return;
   const body=state.items.length?state.items.map(replyHTML).join(''):state.loaded?'<p class="reply-empty">답글이 없습니다.</p>':'';
   const more=state.hasMore?'<button class="replies-more" type="button" data-server-replies-more="'+esc(commentId)+'">답글 더 보기</button>':'';
   host.innerHTML=body+more;
   const toggle=commentList.querySelector('[data-server-reply-toggle="'+commentId+'"]');
   if(toggle){toggle.disabled=state.loading;toggle.textContent=state.loading?'답글 불러오는 중입니다.':state.hasMore?'답글 더 보기':'답글 보기'}
  }
  async function loadReplies(commentId,append=false){
   const state=replyStates.get(commentId)||{items:[],cursor:null,hasMore:false,loaded:false,loading:false};
   replyStates.set(commentId,state);
   if(state.loading||(append&&(!state.hasMore||!state.cursor)))return;
   state.loading=true;
   renderReplyState(commentId,state);
   const result=append
    ?await bridge.listReplies(postId,commentId,{limit:20,cursor:state.cursor})
    :await bridge.listReplies(postId,commentId);
   state.loading=false;
   if(result.mode!=='server'){
    state.hasMore=Boolean(state.cursor);
    renderReplyState(commentId,state);
    if(!state.loaded){
     const host=commentList.querySelector('[data-server-replies="'+commentId+'"]');
     const message=document.createElement('p');
     message.textContent=failMessage(result);
     host.replaceChildren();
     host.append(message);
    }
    flash(failMessage(result));
    return;
   }
   const byId=new Map(state.items.map(reply=>[reply.id,reply]));
   result.replies.forEach(reply=>byId.set(reply.id,reply));
   state.items=[...byId.values()];
   state.cursor=result.nextCursor;
   state.hasMore=result.hasMore===true;
   state.loaded=true;
   renderReplyState(commentId,state);
  }
  function appendReply(parentId,reply){
   const state=replyStates.get(parentId);
   if(!state||!state.loaded)return;
   if(!state.items.some(item=>item.id===reply.id))state.items.push(reply);
   renderReplyState(parentId,state);
  }
 async function loadPost(){
  const result=await bridge.getPost(postId);
   if(result.mode!=='server'||!result.post){
    post=null;
    loadFailure=failMessage(result);
    document.getElementById('title').textContent=loadFailure;
    document.getElementById('body').textContent='';
    gatedCommentState(loadFailure);
    renderPostActions();
    postEditPanel.hidden=true;
    closeReport();
    flash(loadFailure);
    return;
   }
  loadFailure='';
  post=result.post;liked=post.viewerLiked;count=post.reactionCount;
  // 말머리(category)는 서버 게시 데이터에서만 읽습니다. 없으면 종류만 표시합니다.
  const kindLabel=LABEL[post.kind]||post.kind;
  document.getElementById('typeLabel').textContent=post.category?kindLabel+' · '+post.category:kindLabel;
  document.getElementById('avatar').textContent=post.author.nickname.slice(0,1);
  document.getElementById('author').textContent=post.author.nickname;
  document.getElementById('levelTime').textContent=timeAgo(post.publishedAt||post.createdAt);
   // Legacy fallback used title.textContent=d.title; canonical server hydration uses post.title.
   document.getElementById('title').textContent=post.title;
   document.getElementById('body').textContent=post.body;
   renderLike();
   renderPostActions();
   postEditPanel.hidden=true;
   closeReport();
   if(CHIP[post.kind])backLink.href=withApiBase('12_이웃대화_첫화면.html?type='+CHIP[post.kind]);
  if(post.status!=='published'){
   const pendingMessage='이 글은 저장되었고 현재 공개 전 확인 대기 중입니다. 다른 주민에게는 아직 보이지 않습니다.';
   if(interactionStatus)interactionStatus.textContent=pendingMessage;
   if(foot)foot.textContent=pendingMessage;
   likeBtn.disabled=true;
   commentText.disabled=true;
   const submit=commentForm.querySelector('button[type="submit"]');
   if(submit)submit.disabled=true;
   gatedCommentState('글이 공개된 뒤 댓글과 공감을 이용할 수 있습니다.');    return;
  }
  likeBtn.disabled=false;
   commentText.disabled=false;
   const submit=commentForm.querySelector('button[type="submit"]');
   if(submit)submit.disabled=false;
   await loadComments();
  }
 async function loadComments(append=false){
  if(commentState.loading||(append&&!commentState.hasMore))return;
  if(!append){
   commentState={comments:[],cursor:null,hasMore:false,loading:false,generation:commentState.generation+1};
   replyStates.clear();
   commentList.innerHTML='<li class="comment"><p>댓글을 불러오는 중입니다.</p></li>';
  }
  const generation=commentState.generation;
  commentState.loading=true;
  commentLoadMore.disabled=true;
  commentLoadMore.textContent=append?'댓글 더 불러오는 중입니다.':'댓글 다시 시도';
  const result=await bridge.listComments(postId,{limit:20,cursor:append?commentState.cursor:null});
  if(generation!==commentState.generation)return;
  commentState.loading=false;
  if(result.mode!=='server'){
   const msg=failMessage(result);
   if(!append){
    gatedCommentState(msg);
   flash(msg);
   }else{
    flash(msg);
   }
   commentState.hasMore=true;
   commentLoadMore.hidden=false;
   commentLoadMore.disabled=false;
   commentLoadMore.textContent='댓글 다시 시도';
   return;
  }
  const existing=new Set(commentState.comments.map(comment=>comment.id));
  const incoming=result.comments.filter(comment=>!existing.has(comment.id));
  if(!append)commentList.innerHTML=result.comments.map(serverCommentHTML).join('');
  else incoming.forEach(comment=>commentList.insertAdjacentHTML('beforeend',serverCommentHTML(comment)));
   commentState.comments.push(...incoming);
   commentState.cursor=result.nextCursor;
   commentState.hasMore=result.hasMore===true;
   const total=post&&Number.isFinite(post.commentCount)?post.commentCount:commentState.comments.length;
   commentCount.textContent=total;
   commentTitleCount.textContent=total;
   commentLoadMore.hidden=!commentState.hasMore;
   commentLoadMore.disabled=false;
   commentLoadMore.textContent='댓글 더 보기';
  }

  document.addEventListener('click',ev=>{
    if(ev.target.closest('#commentLoadMore')){
     ev.preventDefault();ev.stopImmediatePropagation();
     void loadComments(true);
     return;
    }
    if(ev.target.closest('[data-server-replies-more]')){
     ev.preventDefault();ev.stopImmediatePropagation();
     const id=ev.target.closest('[data-server-replies-more]').dataset.serverRepliesMore;
     void loadReplies(id,true);
     return;
    }
    const replyToggle=ev.target.closest('[data-server-reply-toggle]');
    if(replyToggle){
     ev.preventDefault();ev.stopImmediatePropagation();
     void loadReplies(replyToggle.dataset.serverReplyToggle,false);
     return;
    }
    if(ev.target.closest('#likeBtn')){
    ev.preventDefault();ev.stopImmediatePropagation();
    if(!post){flash(loadFailure||'게시물을 불러온 뒤 이용해 주세요.');return}
    if(busy)return;
    busy=true;
    bridge.setReaction(postId,!liked).then(r=>{
     if(r.ok&&r.mode==='server'){if(r.active!==liked){count+=r.active?1:-1;liked=r.active;renderLike()}}
     else flash(failMessage(r));
    }).finally(()=>{busy=false});
    return;
   }
   if(ev.target.closest('#postEditBtn')){
    ev.preventDefault();ev.stopImmediatePropagation();
    if(!busy)openPostEditor();
    return;
   }
   if(ev.target.closest('#postDeleteBtn')){
    ev.preventDefault();ev.stopImmediatePropagation();
    if(busy||!post||!post.viewerCanDelete)return;
    if(!window.confirm('이 글을 삭제할까요? 삭제 후에는 목록으로 돌아갑니다.'))return;
    busy=true;
    bridge.deletePost(postId).then(r=>{
     if(r.ok&&r.mode==='server'&&r.deleted){closePostEditor();closeReport();showPostRecovery('deleted');flash('게시글을 삭제했습니다.')}
     else flash(failMessage(r));
    }).finally(()=>{busy=false});
    return;
   }
   if(ev.target.closest('#postReportBtn')){
    ev.preventDefault();ev.stopImmediatePropagation();
    if(!busy)openReport('post',postId);
    return;
   }
   if(ev.target.closest('#postEditCancel')){
    ev.preventDefault();ev.stopImmediatePropagation();
    closePostEditor();
    return;
   }
   if(ev.target.closest('#reportCancel')){
    ev.preventDefault();ev.stopImmediatePropagation();
    closeReport();
    return;
   }
   const commentDelete=ev.target.closest('[data-server-comment-delete]');
   if(commentDelete){
    ev.preventDefault();ev.stopImmediatePropagation();
     if(busy)return;
     if(!window.confirm('이 댓글을 삭제할까요?'))return;
     const id=commentDelete.dataset.serverCommentDelete;
     busy=true;
     bridge.deleteComment(id).then(async r=>{
      if(r.ok&&r.mode==='server'&&r.deleted){if(post)post.commentCount=Math.max(0,post.commentCount-1);flash('댓글을 삭제했습니다.');await loadComments(false)}
      else flash(failMessage(r));
    }).finally(()=>{busy=false});
    return;
   }
   const commentReport=ev.target.closest('[data-server-comment-report]');
   if(commentReport){
    ev.preventDefault();ev.stopImmediatePropagation();
    if(!busy)openReport('comment',commentReport.dataset.serverCommentReport);
    return;
   }
   const replyButton=ev.target.closest('[data-server-reply]');
   if(replyButton){
    ev.preventDefault();ev.stopImmediatePropagation();
    const id=replyButton.dataset.serverReply;
    const form=commentList.querySelector('[data-server-reply-form="'+id+'"]');
    if(form){form.classList.toggle('open');if(form.classList.contains('open'))form.querySelector('input')?.focus()}
   }
  },true);
 document.addEventListener('submit',ev=>{
   if(ev.target===postEditForm){
    ev.preventDefault();ev.stopImmediatePropagation();
    if(busy)return;
    const title=postEditTitle.value.trim(),body=postEditBody.value.trim();
    if(!title||title.length>160){flash('제목은 1~160자로 입력해 주세요.');return}
    if(!body||body.length>10000){flash('내용은 1~10,000자로 입력해 주세요.');return}
    busy=true;
    bridge.updatePost(postId,{title,body}).then(async r=>{
     if(r.ok&&r.mode==='server'&&r.post){closePostEditor();await loadPost();flash('게시글을 수정했습니다.')}
     else flash(failMessage(r));
    }).finally(()=>{busy=false});
    return;
   }
   if(ev.target===reportForm){
    ev.preventDefault();ev.stopImmediatePropagation();
    if(busy||!reportTargetState)return;
    const reason=reportReason.value,detail=reportDetail.value.trim();
    if(detail.length>1000){reportStatus.textContent='상세 내용은 1000자까지 입력할 수 있습니다.';return}
    busy=true;
    bridge.reportTarget({targetType:reportTargetState.targetType,targetId:reportTargetState.targetId,reason,detail}).then(r=>{
     if(r.ok&&r.mode==='server'){
      reportStatus.textContent=r.duplicate?'이미 접수된 신고가 있습니다.':'신고가 접수되었습니다. 운영자 확인 후 처리됩니다.';
      reportReason.disabled=true;reportDetail.disabled=true;document.getElementById('reportSubmit').disabled=true;
     }else reportStatus.textContent=failMessage(r);
    }).finally(()=>{busy=false});
    return;
   }
   const replyForm=ev.target.closest&&ev.target.closest('[data-server-reply-form]');
  if(replyForm){
   ev.preventDefault();ev.stopImmediatePropagation();
   const parentId=replyForm.dataset.serverReplyForm;
   const input=replyForm.querySelector('input');
   const v=(input?.value||'').trim();
   if(!v){flash('답글을 입력해 주세요.');return}
   if(v.length>300){flash('답글은 300자까지 입력할 수 있습니다.');return}
   bridge.addReply(postId,parentId,v).then(r=>{
     if(r.ok&&r.mode==='server'){input.value='';replyForm.classList.remove('open');appendReply(parentId,r.reply)}
     else flash(failMessage(r));
    });
   return;
  }
  if(ev.target!==commentForm)return;
  ev.preventDefault();ev.stopImmediatePropagation();
  const v=commentText.value.trim();
  if(!v){flash('댓글을 입력해 주세요.');return}
  if(v.length>300){flash('댓글은 300자까지 입력할 수 있습니다.');return}
  bridge.addComment(postId,v).then(async r=>{
    if(r.ok&&r.mode==='server'){commentText.value='';await loadPost()}
    else flash(failMessage(r));
   });
 },true);
 loadPost();
})();
</script></body></html>
