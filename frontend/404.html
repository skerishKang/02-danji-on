<html lang="ko">
<head>

    p{margin:0;color:#625f58;font-size:16px;line-height:1.7}
    a{display:inline-flex;margin-top:28px;min-height:46px;align-items:center;justify-content:center;padding:0 20px;border-radius:999px;background:#171717;color:#fff;text-decoration:none;font-weight:700}
