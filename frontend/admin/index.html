<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>단지온 관리자 콘솔</title>
  <meta name="robots" content="noindex">
  <style>
    :root{--paper:#f3efe6;--paper2:#fbfaf6;--ink:#111217;--muted:#68665f;--line:#d5cec0;--navy:#101b2d;--blue:#314cf4;--amber:#f4b448;--coral:#ed5a42;--green:#2f6d56;--header:72px}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
    .admin-header{min-height:var(--header);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 clamp(18px,4vw,44px);background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
    .brand{color:#fff;text-decoration:none;font-size:22px;font-weight:900;letter-spacing:-.03em;display:inline-flex;align-items:baseline;gap:8px}
    .brand small{font-size:9px;font-weight:700;letter-spacing:.14em;opacity:.66}
    .admin-header-side{display:flex;align-items:center;gap:12px}
    .admin-role-badge{min-height:34px;display:inline-flex;align-items:center;padding:0 13px;border-radius:999px;font-size:13px;font-weight:800;border:1px solid rgba(255,255,255,.34);color:#fff}
    .admin-role-badge.pending{border-style:dashed;opacity:.8}
    .admin-role-badge.admin{background:var(--amber);border-color:var(--amber);color:var(--navy)}
    .admin-role-badge.operator{background:var(--green);border-color:var(--green);color:#fff}
    .admin-role-badge.restricted{background:var(--coral);border-color:var(--coral);color:#fff}
    .admin-home-link{color:#fff;opacity:.85;font-size:13px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.34);border-radius:999px;padding:8px 13px}
    main{max-width:1080px;margin:0 auto;padding:26px clamp(16px,4vw,34px) 80px}
    .admin-lead h1{font-size:clamp(24px,3.4vw,32px);letter-spacing:-.03em;margin:8px 0 6px}
    .admin-lead p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.admin-role-summary{margin-top:14px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--paper2);font-size:14px;font-weight:800}.admin-role-summary strong{font-size:16px}.admin-scope-copy{display:block;margin-top:5px;color:var(--muted);font-size:12px;font-weight:600}
    .admin-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px}
    .admin-tabs button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);font-size:13.5px;font-weight:800;cursor:pointer}
    .admin-tabs button.active{background:var(--navy);border-color:var(--navy);color:#fff}
    .admin-tabs button.privileged{border-color:var(--amber)}
    .admin-tabs button.privileged.active{background:var(--amber);border-color:var(--amber);color:var(--navy)}
    .admin-note{margin:14px 0 0;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--paper2);color:var(--muted);font-size:12.5px;line-height:1.6}
    .admin-panel{margin-top:16px}
    .admin-panel h2{font-size:19px;letter-spacing:-.02em;margin:8px 0 4px}
    .admin-panel>p{margin:0 0 12px;color:var(--muted);font-size:13px}
    .admin-card{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
    .admin-card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .admin-card h3{margin:0 0 4px;font-size:16px}
    .admin-card .meta{color:var(--muted);font-size:12.5px;margin:0}
    .admin-status{flex:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:800;color:var(--muted);background:#fff}
    .admin-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--line)}
    .admin-fact{font-size:12.5px;line-height:1.5;color:var(--muted)}.admin-fact b{display:block;color:var(--ink);font-size:11px;margin-bottom:2px}
    .admin-review-controls{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
    .admin-review-controls textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:10px 12px;font:inherit;font-size:13px;line-height:1.55}
    .admin-review-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
    .admin-review-actions button{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--ink);background:#fff;color:var(--ink);font-size:13px;font-weight:850;cursor:pointer}
    .admin-review-actions button.primary{background:var(--navy);color:#fff}.admin-review-actions button.danger{border-color:var(--coral);color:var(--coral)}
    .admin-review-actions button:disabled{opacity:.5;cursor:wait}
    .admin-review-status{min-height:20px;margin:8px 0 0!important;font-size:12.5px!important;font-weight:750;color:var(--muted)!important}
    .admin-review-status.error{color:var(--coral)!important}.admin-review-complete{margin:12px 0 0;color:var(--green);font-size:12.5px;font-weight:800}
    .admin-post-editor{margin:14px 0;padding:16px;border:1px solid var(--line);border-radius:16px;background:#fff}
    .admin-post-editor.create{border-style:dashed;background:var(--paper2)}
    .admin-post-editor h3{margin:0 0 12px;font-size:15px}
    .admin-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .admin-field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:800;color:var(--muted)}
    .admin-field.full{grid-column:1/-1}
    .admin-field input,.admin-field textarea,.admin-field select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:10px 11px;font:inherit;font-size:13px;font-weight:600}
    .admin-field textarea{min-height:110px;resize:vertical;line-height:1.55}
    .admin-post-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
    .admin-post-actions button{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-size:13px;font-weight:850;cursor:pointer}
    .admin-post-actions button:disabled{opacity:.5;cursor:wait}
    .admin-post-status{min-height:20px;margin:0!important;font-size:12.5px!important;font-weight:750;color:var(--muted)!important}
    .admin-post-status.error{color:var(--coral)!important}
    .admin-empty,.admin-state{padding:26px 18px;border:1px dashed var(--line);border-radius:16px;background:var(--paper2);color:var(--muted);font-size:13.5px;line-height:1.7;text-align:center}
    .privileged-grid{display:grid;gap:12px}
    .privileged-item{display:flex;justify-content:space-between;gap:14px;align-items:center;background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
    .privileged-item h3{margin:0 0 4px;font-size:15.5px}
    .privileged-item p{margin:0;color:var(--muted);font-size:12.5px}
    .privileged-state{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--amber);color:var(--navy);background:var(--amber);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:800}
    .privileged-item button{min-height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:800;font-size:12px}
    .principal-summary{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
    .principal-summary span{display:inline-flex;align-items:center;min-height:32px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--paper2);font-size:12px;font-weight:800}
    .principal-card{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
    .principal-card h3{margin:0 0 4px;font-size:15.5px;overflow-wrap:anywhere}
    .principal-meta{margin:0 0 12px!important;color:var(--muted)!important;font-size:12px!important;line-height:1.55}
    .principal-runtime{font-size:12px;color:var(--muted);margin:8px 0 0}.principal-runtime strong{color:var(--ink)}
    .principal-form{margin:14px 0 18px;padding:16px;border:1px dashed var(--amber);border-radius:16px;background:var(--paper2)}
    .principal-form h3{margin:0 0 12px;font-size:15.5px}
    .restricted-box{max-width:560px;margin:14svh auto 0;padding:0 22px;text-align:center}
    .restricted-box h1{font-size:24px;letter-spacing:-.03em}
    .restricted-box p{color:var(--muted);font-size:14px;line-height:1.7}
    .restricted-box a{display:inline-flex;min-height:46px;align-items:center;margin-top:18px;padding:0 20px;border-radius:999px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;text-decoration:none}
    .admin-bootstrap-note{max-width:460px;margin:16px auto 0!important;font-size:12.5px!important}
    .admin-bootstrap-button{min-height:46px;margin-top:12px;padding:0 20px;border:0;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
    .admin-bootstrap-button:disabled{opacity:.58;cursor:wait}
    .admin-bootstrap-status{min-height:20px;margin:10px auto 0!important;font-size:12.5px!important;font-weight:700;color:var(--coral)!important}
    .verification-code-result{margin-top:12px;padding:16px;border:1px solid var(--green);background:#eef7f2}.verification-code-result small{display:block;color:var(--green);font-weight:900;font-size:11px}.verification-code-value{font:900 28px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;margin:8px 0;color:var(--navy);overflow-wrap:anywhere}.verification-code-result p{margin:0 0 10px!important;color:var(--muted)!important;font-size:12.5px!important;line-height:1.55}.verification-code-result .admin-review-actions{margin-top:8px}.verification-unit-form{margin:14px 0 18px;padding:16px;border:1px dashed var(--green);border-radius:16px;background:var(--paper2)}.verification-unit-form h3{margin:0 0 6px}.verification-unit-form>p{margin:0 0 12px;color:var(--muted);font-size:12.5px;line-height:1.55}
    @media(max-width:720px){.admin-card-top{flex-direction:column}.admin-header{position:static}.admin-facts,.admin-form-grid{grid-template-columns:1fr}.admin-field.full{grid-column:auto}.admin-review-actions button,.admin-post-actions button{flex:1 1 calc(50% - 8px)}}
  </style>
</head>
<body>
  <header class="admin-header">
    <a class="brand" href="/">단지온 <small>ADMIN CONSOLE</small></a>
    <div class="admin-header-side">
      <span class="admin-role-badge pending" id="roleBadge" data-role-state="pending">권한 확인 중</span>
      <a class="admin-home-link" href="/">주민 화면으로</a>
    </div>
  </header>
  <main id="adminMain" hidden></main>
  <section id="restrictedView" hidden></section>
  <script src="/assets/danjion-session.js"></script>
  <script src="/assets/danjion-admin-authority.js"></script>
  <script src="/assets/danjion-admin-bootstrap.js"></script>
  <script src="/assets/danjion-admin-principals.js"></script>
  <script src="/assets/danjion-admin-global-audit.js"></script>
  <script src="/assets/danjion-admin-console.js"></script>
  <script>
    const badge=document.getElementById('roleBadge'),main=document.getElementById('adminMain'),restricted=document.getElementById('restrictedView');
    const authority=window.DanjionAdminAuthority,bootstrapApi=window.DanjionAdminBootstrap,principalApi=window.DanjionAdminPrincipals,auditApi=window.DanjionAdminGlobalAudit,consoleApi=window.DanjionAdminConsole;
    const RESTRICTED_COPY={
      unbound:'이 환경에서는 관리자 콘솔을 사용할 수 없습니다.',
      'signed-out':'관리자 콘솔은 로그인 후 이용할 수 있습니다.',
      denied:'현재 계정에 활성 관리자 권한이 없습니다. 관리자 여부는 서버의 명시적 권한 기록(padiem_operator_grants)으로만 판정합니다.',
      invalid:'권한 응답을 검증할 수 없어 접근을 차단했습니다. 잠시 후 다시 시도해 주세요.',
      error:'권한 확인에 실패했습니다. 잠시 후 다시 시도해 주세요.'
    };
    function el(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node}
    function showRestricted(state){
      main.hidden=true;main.replaceChildren();
      restricted.hidden=false;
      badge.textContent='접근 제한';badge.className='admin-role-badge restricted';badge.dataset.roleState='restricted';
      const box=el('div',undefined,'restricted-box');
      box.append(el('h1','관리자 콘솔 접근 제한'),el('p',RESTRICTED_COPY[state]||RESTRICTED_COPY.denied));
      if(state==='denied'&&bootstrapApi){
        box.append(el('p','관리자 등록은 운영자가 서버에 미리 등록한 Google 관리자 계정에서만 가능합니다. 일반 Google 로그인만으로는 관리자 권한이 생기지 않습니다.','admin-bootstrap-note'));
        const activate=el('button','등록된 관리자 권한 확인','admin-bootstrap-button');
        activate.type='button';
        const status=el('p','', 'admin-bootstrap-status');status.setAttribute('aria-live','polite');
        activate.addEventListener('click',async()=>{
          activate.disabled=true;activate.textContent='관리자 등록 확인 중…';status.textContent='';
          const outcome=await bootstrapApi.bootstrapAuthority(fetch);
          if(authority.hasAdminSurface(outcome)){
            const canonicalGrant=await authority.fetchAuthority(fetch);
            if(authority.hasAdminSurface(canonicalGrant)){renderConsole(canonicalGrant);return}
            status.textContent='관리자 권한 등록은 완료됐지만 최종 권한 확인에 실패했습니다.';
            activate.disabled=false;activate.textContent='등록된 관리자 권한 확인';
            return;
          }
          if(outcome.state==='signed-out'){showRestricted('signed-out');return}
          if(outcome.state==='not-registered')status.textContent='사전 등록된 관리자 계정이 아닙니다.';
          else if(outcome.state==='unavailable')status.textContent='관리자 등록 정보를 확인할 수 없습니다. 잠시 후 다시 시도해 주세요.';
          else status.textContent='관리자 권한 확인에 실패했습니다.';
          activate.disabled=false;activate.textContent='등록된 관리자 권한 확인';
        });
        box.append(activate,status);
      }
      const home=el('a','단지온 홈으로');home.href='/';
      box.append(home);restricted.replaceChildren(box);
    }
    function statePanel(panel,message){panel.replaceChildren(el('div',message,'admin-state'))}
    function appendApplicationFacts(card,row){
      const facts=[
        ['분류',row.categoryName||row.category_name],
        ['관계',row.relationType||row.relation_type],
        ['서비스 지역',row.serviceArea||row.service_area],
        ['가격·이용료',row.priceText||row.price_text],
        ['연락 방법',row.contactMethod||row.contact_method],
        ['주민 혜택',row.benefitText||row.benefit_text],
        ['운영 시간',row.availabilityText||row.availability_text]
      ].filter((item)=>item[1]);
      if(!facts.length)return;
      const grid=el('div',undefined,'admin-facts');
      facts.forEach(([label,value])=>{const fact=el('div',undefined,'admin-fact');fact.append(el('b',label),document.createTextNode(String(value)));grid.append(fact)});
      card.append(grid);
    }
    function applicationReviewControls(row,panel,section,apiBase){
      if(!section.reviewActions)return null;
      const current=String(row.status||'');
      if(current!=='pending'&&current!=='changes_requested')return el('p','처리 완료된 신청입니다.','admin-review-complete');
      const wrap=el('div',undefined,'admin-review-controls');
      const note=document.createElement('textarea');note.maxLength=2000;note.placeholder='검토 메모 (선택)';note.setAttribute('aria-label','검토 메모');
      const actions=el('div',undefined,'admin-review-actions');
      const live=el('p','', 'admin-review-status');live.setAttribute('aria-live','polite');
      const specs=[
        ['approved','승인','primary','이 신청을 승인하시겠습니까?'],
        ['changes_requested','수정요청','','수정 요청 상태로 변경하시겠습니까?'],
        ['rejected','거절','danger','이 신청을 거절하시겠습니까?']
      ];
      const buttons=specs.map(([next,label,cls,confirmText])=>{
        const button=el('button',label,cls);button.type='button';
        button.addEventListener('click',async()=>{
          if(!window.confirm(confirmText))return;
          buttons.forEach((b)=>b.disabled=true);note.disabled=true;live.className='admin-review-status';live.textContent=label+' 처리 중…';
          const outcome=await consoleApi.reviewBusinessApplication(fetch,apiBase,row.id,next,note.value);
          if(outcome.state==='updated'){
            live.textContent=label+' 처리됐습니다. 최신 목록을 다시 불러옵니다.';
            await renderSection(panel,section,apiBase);
            return;
          }
          if(outcome.state==='signed-out'){showRestricted('signed-out');return}
          if(outcome.state==='scope-denied'){live.textContent='현재 관리자 권한으로 이 신청을 변경할 수 없습니다.'}
          else if(outcome.state==='conflict'){live.textContent='현재 신청 상태에서는 처리할 수 없습니다'+(outcome.code?' · '+outcome.code:'')+'.'}
          else if(outcome.state==='network-error'){live.textContent='API 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.'}
          else if(outcome.state==='invalid-request'){live.textContent='신청 식별자 또는 변경 상태가 올바르지 않습니다.'}
          else live.textContent='처리에 실패했습니다'+(outcome.code?' · '+outcome.code:'')+'.';
          live.className='admin-review-status error';buttons.forEach((b)=>b.disabled=false);note.disabled=false;
        });
        actions.append(button);return button;
      });
      wrap.append(note,actions,live);return wrap;
    }
    function labeledField(labelText,control,full){
      const label=el('label',undefined,'admin-field'+(full?' full':''));label.append(el('span',labelText),control);return label;
    }
    function postStatusSelect(current,includeArchived){
      const select=document.createElement('select');select.setAttribute('aria-label','게시 상태');
      const statuses=includeArchived?['draft','published','archived']:['draft','published'];
      const labels={draft:'초안',published:'게시',archived:'보관'};
      statuses.forEach((value)=>{const option=document.createElement('option');option.value=value;option.textContent=labels[value];option.selected=value===current;select.append(option)});
      return select;
    }
    function postFields(row,includeArchived){
      const source=document.createElement('input');source.value=String(row?.source_name||row?.sourceName||'단지온 운영자');source.maxLength=80;source.setAttribute('aria-label','출처');
      const category=document.createElement('input');category.value=String(row?.category||'');category.maxLength=80;category.setAttribute('aria-label','분류');
      const title=document.createElement('input');title.value=String(row?.title||'');title.maxLength=200;title.setAttribute('aria-label','소식 제목');
      const body=document.createElement('textarea');body.value=String(row?.body||'');body.maxLength=10000;body.setAttribute('aria-label','소식 본문');
      const status=postStatusSelect(String(row?.status||'draft'),includeArchived);
      return {source,category,title,body,status};
    }
    function postPayload(fields){return {sourceName:fields.source.value,category:fields.category.value,title:fields.title.value,body:fields.body.value,status:fields.status.value}}
    function postErrorMessage(outcome){
      if(outcome.state==='scope-denied')return '현재 관리자 권한으로 단지소식을 변경할 수 없습니다.';
      if(outcome.state==='not-found')return '수정할 단지소식을 찾을 수 없습니다.';
      if(outcome.state==='conflict')return '현재 상태에서는 이 변경을 적용할 수 없습니다'+(outcome.code?' · '+outcome.code:'')+'.';
      if(outcome.state==='network-error')return 'API 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.';
      if(outcome.state==='invalid-request')return '출처·분류·제목·본문·게시 상태를 모두 확인해 주세요.';
      return '처리에 실패했습니다'+(outcome.code?' · '+outcome.code:'')+'.';
    }
    function appendPostFields(editor,fields){
      const grid=el('div',undefined,'admin-form-grid');
      grid.append(
        labeledField('출처',fields.source,false),
        labeledField('분류',fields.category,false),
        labeledField('제목',fields.title,true),
        labeledField('본문',fields.body,true),
        labeledField('게시 상태',fields.status,false)
      );
      editor.append(grid);
    }
    function postComposer(panel,section,apiBase){
      const editor=el('section',undefined,'admin-post-editor create');editor.append(el('h3','새 단지소식 작성'));

    async function renderPrincipalManager(panel,apiBase){
      const title=el('h2','사용자 · 권한 관리');
      const intro=el('p','최고관리자만 접근할 수 있습니다. 목표 구성은 최고관리자 2계정 + 일반관리자 2계정이며, 일반관리자는 승인된 일상 운영 권한 프리셋만 사용합니다.');
      panel.replaceChildren(title,intro);
      const createBox=el('section',undefined,'principal-form');createBox.append(el('h3','관리자 계정 사전 등록'));
      const email=document.createElement('input');email.type='email';email.placeholder='Google 로그인 이메일';email.setAttribute('aria-label','관리자 이메일');
      const role=principalRoleSelect('operator');
      const reason=document.createElement('input');reason.placeholder='등록 사유 (선택)';reason.maxLength=500;reason.setAttribute('aria-label','관리자 등록 사유');
      const formGrid=el('div',undefined,'admin-form-grid');formGrid.append(labeledField('관리자 이메일',email,true),labeledField('관리자 등급',role,false),labeledField('등록 사유',reason,true));createBox.append(formGrid);
      const createActions=el('div',undefined,'admin-post-actions');const createButton=el('button','관리자 추가');createButton.type='button';const createStatus=el('p','', 'admin-post-status');createStatus.setAttribute('aria-live','polite');createActions.append(createButton,createStatus);createBox.append(createActions);
      panel.append(createBox);
      const summary=el('div',undefined,'principal-summary'),list=el('div',undefined,'principal-list');panel.append(summary,list);

      const refresh=async()=>{
        list.replaceChildren(el('div','관리자 목록 불러오는 중…','admin-state'));summary.replaceChildren();
        const outcome=await principalApi.list(fetch,apiBase);
        if(outcome.state==='signed-out'){showRestricted('signed-out');return}
        if(outcome.state!=='ready'){list.replaceChildren(el('div',principalError(outcome),'admin-state'));return}
        const active=outcome.rows.filter((row)=>row.status==='active');
        const superCount=active.filter((row)=>row.role==='admin').length;
        const operatorCount=active.filter((row)=>row.role==='operator').length;
        summary.append(el('span','활성 최고관리자 '+superCount+' / 목표 2'),el('span','활성 일반관리자 '+operatorCount+' / 목표 2'),el('span','전체 등록 '+outcome.rows.length));
        list.replaceChildren();
        if(!outcome.rows.length){list.append(el('div','등록된 관리자 계정이 없습니다.','admin-empty'));return}
        outcome.rows.forEach((row)=>{
          const card=el('article',undefined,'principal-card');
          card.append(el('h3',String(row.email||'(이메일 없음)')));
          const configured=(row.role==='admin'?'최고관리자':'일반관리자')+' · '+(row.status==='active'?'활성':'해제');
          card.append(el('p','설정: '+configured,'principal-meta'));
          const runtimeLabel=row.runtimeRole==='admin'?'최고관리자':row.runtimeRole==='operator'?'일반관리자':'미부트스트랩/비활성';
          const runtime=el('p',undefined,'principal-runtime');runtime.append(el('strong','Runtime: '),document.createTextNode(runtimeLabel+' · 연결 사용자 '+Number(row.runtimeUserCount||0)+'명'));card.append(runtime);
          const editGrid=el('div',undefined,'admin-form-grid');
          const editRole=principalRoleSelect(String(row.role||'operator'));const editStatus=principalStatusSelect(String(row.status||'active'));
          const editReason=document.createElement('input');editReason.placeholder='변경 사유 (선택)';editReason.maxLength=500;editReason.setAttribute('aria-label','권한 변경 사유');
          editGrid.append(labeledField('관리자 등급',editRole,false),labeledField('상태',editStatus,false),labeledField('변경 사유',editReason,true));card.append(editGrid);
          const actions=el('div',undefined,'admin-post-actions');const save=el('button','권한 변경 저장');save.type='button';const live=el('p','', 'admin-post-status');live.setAttribute('aria-live','polite');actions.append(save,live);card.append(actions);
          save.addEventListener('click',async()=>{
            const demoting=String(row.role)==='admin'&&editRole.value!=='admin';const revoking=String(row.status)==='active'&&editStatus.value==='revoked';
            if((demoting||revoking)&&!window.confirm('이 관리자의 권한을 낮추거나 해제하시겠습니까?'))return;
            save.disabled=true;live.className='admin-post-status';live.textContent='권한 동기화 중…';
            const changed=await principalApi.update(fetch,apiBase,row.id,{role:editRole.value,status:editStatus.value,reason:editReason.value});
            if(changed.state==='ready'){live.textContent='권한이 동기화됐습니다.';await refresh();return}
            if(changed.state==='signed-out'){showRestricted('signed-out');return}
            live.textContent=principalError(changed);live.className='admin-post-status error';save.disabled=false;
          });
          list.append(card);
        });
      };

      createButton.addEventListener('click',async()=>{
        if(!email.value.trim())return;
        createButton.disabled=true;createStatus.className='admin-post-status';createStatus.textContent='관리자 등록 중…';
        const created=await principalApi.create(fetch,apiBase,{email:email.value,role:role.value,reason:reason.value});
        if(created.state==='ready'){email.value='';reason.value='';role.value='operator';createStatus.textContent='관리자가 사전 등록됐습니다. 해당 계정은 Google 로그인 후 관리자 등록 확인을 거쳐 활성화됩니다.';await refresh();createButton.disabled=false;return}
        if(created.state==='signed-out'){showRestricted('signed-out');return}
        createStatus.textContent=principalError(created);createStatus.className='admin-post-status error';createButton.disabled=false;
      });
      await refresh();
    }
    function auditError(outcome){
      if(outcome.state==='forbidden')return '최고관리자 감사 조회 권한이 필요합니다.';
      if(outcome.state==='signed-out')return '로그인이 만료됐습니다.';
      if(outcome.state==='network-error')return '감사 기록 API 연결에 실패했습니다.';
      if(outcome.state==='invalid-request')return '감사 조회 조건을 확인해 주세요.';
      return '감사 기록을 불러오지 못했습니다'+(outcome.code?' · '+outcome.code:'')+'.';
    }
    async function renderAuditManager(panel,apiBase){
      panel.replaceChildren(
        el('h2','전체 감사 기록'),
        el('p','최고관리자 전용 읽기 화면입니다. 개인정보 보호를 위해 사용자·세대·resource 식별자와 request ID, raw metadata는 표시하지 않습니다.')
      );
      const controls=el('div',undefined,'admin-form-grid');
      const decision=document.createElement('select');decision.setAttribute('aria-label','감사 결정 필터');
      [['','전체 결정'],['allowed','허용'],['denied','거부'],['recorded','기록']].forEach(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;decision.append(option)});
      const refresh=el('button','감사 기록 새로고침');refresh.type='button';
      controls.append(labeledField('결정',decision,false),refresh);panel.append(controls);
      const list=el('div',undefined,'audit-list');panel.append(list);
      const load=async()=>{
        refresh.disabled=true;list.replaceChildren(el('div','감사 기록 불러오는 중…','admin-state'));
        const outcome=await auditApi.list(fetch,apiBase,{limit:100,decision:decision.value});
        if(outcome.state==='signed-out'){showRestricted('signed-out');return}
        if(outcome.state!=='ready'){list.replaceChildren(el('div',auditError(outcome),'admin-state'));refresh.disabled=false;return}
        list.replaceChildren();
        if(!outcome.rows.length){list.append(el('div','표시할 감사 기록이 없습니다.','admin-empty'));refresh.disabled=false;return}
        outcome.rows.forEach((row)=>{
          const card=el('article',undefined,'admin-card');
          const top=el('div',undefined,'admin-card-top');
          const copy=el('div');copy.append(el('h3',String(row.action||'(action 없음)')));
          const meta=[
            row.scope?'scope '+String(row.scope):'',
            row.actorKind?'actor '+String(row.actorKind):'',
            row.resourceType?'resource '+String(row.resourceType):'',
            row.reasonCode?'reason '+String(row.reasonCode):'',
            row.createdAt?String(row.createdAt).slice(0,19).replace('T',' '):''
          ].filter(Boolean).join(' · ');
          copy.append(el('p',meta,'meta'));
          top.append(copy,el('span',String(row.decision||'recorded'),'admin-status'));
          card.append(top);list.append(card);
        });
        refresh.disabled=false;
      };
      refresh.addEventListener('click',load);decision.addEventListener('change',load);
      await load();
    }
    async function renderPrivileged(panel,apiBase){
      panel.replaceChildren(el('h2','최고관리'),el('p','전체 관리자(와일드카드 권한) 전용 영역입니다.'));
      if(principalApi){
        const usersButton=el('button','사용자 · 권한 관리');usersButton.type='button';usersButton.addEventListener('click',()=>renderPrincipalManager(panel,apiBase));
        const liveItem=el('article',undefined,'privileged-item');const liveCopy=el('div');liveCopy.append(el('h3','사용자 · 권한 관리'),el('p','사전 등록된 관리자 4계정과 실제 runtime 권한을 관리합니다.'));const liveState=el('span','사용 가능','privileged-state');liveState.append(usersButton);liveItem.append(liveCopy,liveState);panel.append(liveItem);
      }
      if(auditApi){
        const auditButton=el('button','전체 감사 기록');auditButton.type='button';auditButton.addEventListener('click',()=>renderAuditManager(panel,apiBase));
        const auditItem=el('article',undefined,'privileged-item');const auditCopy=el('div');auditCopy.append(el('h3','전체 감사 기록'),el('p','식별자·raw metadata를 제외한 운영 감사 요약을 조회합니다.'));const auditState=el('span','사용 가능','privileged-state');auditState.append(auditButton);auditItem.append(auditCopy,auditState);panel.append(auditItem);
      }
      const grid=el('div',undefined,'privileged-grid');
      consoleApi.PRIVILEGED_PLACEHOLDERS.filter((capability)=>capability.id!=='users'&&capability.id!=='audit').forEach((capability)=>{
        const item=el('article',undefined,'privileged-item');item.setAttribute('aria-disabled','true');
        const copy=el('div');copy.append(el('h3',capability.title),el('p',capability.description));
        const side=el('span','연동 대기','privileged-state');
        const button=el('button','준비 중');button.disabled=true;
        side.append(button);
        item.append(copy,side);grid.append(item);
      });
      panel.append(grid);
    }
    function renderConsole(grant){
      restricted.hidden=true;restricted.replaceChildren();
      main.hidden=false;
      const isSuper=authority.isSuperAdminAuthority(grant);
      badge.textContent=grant.label;badge.className='admin-role-badge '+(isSuper?'admin':'operator');badge.dataset.roleState=isSuper?'admin':'operator';
      const apiBase=authority.resolveApiBase();
      const sections=consoleApi.consoleSections(grant);
      const lead=el('div',undefined,'admin-lead');
      lead.append(el('h1','단지온 운영관리'),el('p','방림명지로드힐 · 권한은 로그인 수단이 아니라 각 관리자 계정 고유의 서버 권한 기록(padiem_operator_grants)에 귀속됩니다.'));
      const roleSummary=el('div',undefined,'admin-role-summary');
      roleSummary.append(el('strong','현재 권한: '+grant.label));
      const scopeText=isSuper?'모든 관리자 정보 접근 가능':('운영 범위: '+grant.scopes.join(', '));
      roleSummary.append(el('span',scopeText,'admin-scope-copy'));
      lead.append(roleSummary);
      const tabs=el('nav',undefined,'admin-tabs');tabs.setAttribute('aria-label','운영관리 메뉴');
      const panel=el('section',undefined,'admin-panel');
      const note=el('p','등록 신청 심사, 단지소식, 주민혜택 관리는 기존 서버 권한으로 처리할 수 있습니다. 최고관리자는 사용자·권한 관리와 개인정보를 제한한 전체 감사 기록을 사용할 수 있으며, 민감정보·시스템 관리는 아직 비활성화되어 있습니다.','admin-note');
      main.append(lead,tabs,note,panel);
      const open=(tab)=>{
        [...tabs.children].forEach((button)=>button.classList.toggle('active',button===tab.button));
        if(tab.section)renderSection(panel,tab.section,apiBase);else renderPrivileged(panel,apiBase);
      };
      const tabsModel=sections.operational.map((section)=>({button:el('button',section.title),section}));
      sections.held.forEach((section)=>{const button=el('button',section.title+' · 정책 대기');button.disabled=true;button.title='정책 승인 후 활성화';tabs.append(button)});
      if(sections.privileged.length)tabsModel.push({button:el('button','최고관리','privileged'),section:null});
      tabsModel.forEach((tab)=>{tab.button.addEventListener('click',()=>open(tab));tabs.append(tab.button)});
      if(tabsModel.length)open(tabsModel[0]);else statePanel(panel,'현재 계정에 사용할 수 있는 운영 메뉴가 없습니다. 관리자 권한 범위를 확인해 주세요.');
    }
    authority.fetchAuthority(fetch).then((grant)=>{
      if(authority.hasAdminSurface(grant))renderConsole(grant);else showRestricted(grant.state);
    });
  </script>
</body>
