<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>단지온 관리자 콘솔</title>
  <meta name="robots" content="noindex">
  <style>
    :root{--paper:#f3efe6;--paper2:#fbfaf6;--ink:#111217;--muted:#68665f;--line:#d5cec0;--navy:#101b2d;--blue:#314cf4;--amber:#f4b448;--coral:#ed5a42;--green:#2f6d56;--header:72px}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
    .admin-header{min-height:var(--header);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 clamp(18px,4vw,44px);background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
    .brand{color:#fff;text-decoration:none;font-size:22px;font-weight:900;letter-spacing:-.03em;display:inline-flex;align-items:baseline;gap:8px}
    .brand small{font-size:9px;font-weight:700;letter-spacing:.14em;opacity:.66}
    .admin-header-side{display:flex;align-items:center;gap:12px}
    .admin-role-badge{min-height:34px;display:inline-flex;align-items:center;padding:0 13px;border-radius:999px;font-size:13px;font-weight:800;border:1px solid rgba(255,255,255,.34);color:#fff}
    .admin-role-badge.pending{border-style:dashed;opacity:.8}
    .admin-role-badge.admin{background:var(--amber);border-color:var(--amber);color:var(--navy)}
    .admin-role-badge.operator{background:var(--green);border-color:var(--green);color:#fff}
    .admin-role-badge.restricted{background:var(--coral);border-color:var(--coral);color:#fff}
    .admin-home-link{color:#fff;opacity:.85;font-size:13px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,.34);border-radius:999px;padding:8px 13px}
    main{max-width:1080px;margin:0 auto;padding:26px clamp(16px,4vw,34px) 80px}
    .admin-lead h1{font-size:clamp(24px,3.4vw,32px);letter-spacing:-.03em;margin:8px 0 6px}
    .admin-lead p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
    .admin-tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px}
    .admin-tabs button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);font-size:13.5px;font-weight:800;cursor:pointer}
    .admin-tabs button.active{background:var(--navy);border-color:var(--navy);color:#fff}
    .admin-tabs button.privileged{border-color:var(--amber)}
    .admin-tabs button.privileged.active{background:var(--amber);border-color:var(--amber);color:var(--navy)}
    .admin-note{margin:14px 0 0;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--paper2);color:var(--muted);font-size:12.5px;line-height:1.6}
    .admin-panel{margin-top:16px}
    .admin-panel h2{font-size:19px;letter-spacing:-.02em;margin:8px 0 4px}
    .admin-panel>p{margin:0 0 12px;color:var(--muted);font-size:13px}
    .admin-card{background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px}
    .admin-card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .admin-card h3{margin:0 0 4px;font-size:16px}
    .admin-card .meta{color:var(--muted);font-size:12.5px;margin:0}
    .admin-status{flex:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:800;color:var(--muted);background:#fff}
    .admin-empty,.admin-state{padding:26px 18px;border:1px dashed var(--line);border-radius:16px;background:var(--paper2);color:var(--muted);font-size:13.5px;line-height:1.7;text-align:center}
    .privileged-grid{display:grid;gap:12px}
    .privileged-item{display:flex;justify-content:space-between;gap:14px;align-items:center;background:var(--paper2);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
    .privileged-item h3{margin:0 0 4px;font-size:15.5px}
    .privileged-item p{margin:0;color:var(--muted);font-size:12.5px}
    .privileged-state{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--amber);color:var(--navy);background:var(--amber);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:800}
    .privileged-item button{min-height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:800;font-size:12px}
    .restricted-box{max-width:560px;margin:14svh auto 0;padding:0 22px;text-align:center}
    .restricted-box h1{font-size:24px;letter-spacing:-.03em}
    .restricted-box p{color:var(--muted);font-size:14px;line-height:1.7}
    .restricted-box a{display:inline-flex;min-height:46px;align-items:center;margin-top:18px;padding:0 20px;border-radius:999px;background:var(--blue);color:#fff;font-weight:800;font-size:14px;text-decoration:none}
    @media(max-width:720px){.admin-card-top{flex-direction:column}.admin-header{position:static}}
  </style>
</head>
<body>
  <header class="admin-header">
    <a class="brand" href="/">단지온 <small>ADMIN CONSOLE</small></a>
    <div class="admin-header-side">
      <span class="admin-role-badge pending" id="roleBadge" data-role-state="pending">권한 확인 중</span>
      <a class="admin-home-link" href="/">주민 화면으로</a>
    </div>
  </header>
  <main id="adminMain" hidden></main>
  <section id="restrictedView" hidden></section>
  <script src="/assets/danjion-session.js"></script>
  <script src="/assets/danjion-admin-authority.js"></script>
  <script src="/assets/danjion-admin-console.js"></script>
  <script>
    const badge=document.getElementById('roleBadge'),main=document.getElementById('adminMain'),restricted=document.getElementById('restrictedView');
    const authority=window.DanjionAdminAuthority,consoleApi=window.DanjionAdminConsole;
    const RESTRICTED_COPY={
      unbound:'이 환경에서는 관리자 콘솔을 사용할 수 없습니다.',
      'signed-out':'관리자 콘솔은 로그인 후 이용할 수 있습니다.',
      denied:'접근 권한이 없습니다. 관리자 여부는 서버의 권한 기록(padiem_operator_grants)으로만 판정되며, 이메일·로그인 수단·브라우저 저장 정보로 추정하지 않습니다.',
      error:'권한 확인에 실패했습니다. 잠시 후 다시 시도해 주세요.'
    };
    function el(tag,text,className){const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(className)node.className=className;return node}
    function showRestricted(state){
      main.hidden=true;main.replaceChildren();
      restricted.hidden=false;
      badge.textContent='접근 제한';badge.className='admin-role-badge restricted';badge.dataset.roleState='restricted';
      const box=el('div');
      box.append(el('h1','관리자 콘솔 접근 제한'),el('p',RESTRICTED_COPY[state]||RESTRICTED_COPY.denied));
      const home=el('a','단지온 홈으로');home.href='/';
      box.append(home);restricted.replaceChildren(box);
    }
    function statePanel(panel,message){panel.replaceChildren(el('div',message,'admin-state'))}
    async function renderSection(panel,section,apiBase){
      statePanel(panel,'불러오는 중…');
      const outcome=await consoleApi.loadSection(fetch,apiBase,section);
      if(outcome.state==='ready'){
        panel.replaceChildren(el('h2',section.title),el('p',section.description));
        if(!outcome.rows.length){panel.append(el('div','표시할 항목이 없습니다.','admin-empty'));return}
        outcome.rows.forEach((row)=>{
          const card=el('article',undefined,'admin-card');
          const top=el('div',undefined,'admin-card-top');
          const copy=el('div');copy.append(el('h3',consoleApi.rowTitle(row)||'(제목 없음)'),el('p',consoleApi.rowMeta(row),'meta'));
          top.append(copy,el('span',consoleApi.rowStatus(row)||'-','admin-status'));
          card.append(top);
          const approve=el('button','상태 변경 (조회 전용)');approve.disabled=true;
          card.append(approve);
          panel.append(card);
        });
        return;
      }
      if(outcome.state==='signed-out'){showRestricted('signed-out');return}
      if(outcome.state==='scope-denied'){statePanel(panel,'이 메뉴는 현재 계정의 서버 권한 범위에 포함되어 있지 않습니다.');return}
      if(outcome.state==='policy-hold'){statePanel(panel,'이 영역은 정책 승인 보류 중입니다. 백엔드가 조회를 의도적으로 차단하고 있습니다.');return}
      statePanel(panel,'목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
    }
    function renderPrivileged(panel){
      panel.replaceChildren(el('h2','최고관리'),el('p','전체 관리자(와일드카드 권한) 전용 영역입니다. 백엔드 권한 API가 실제 변경 엔드포인트를 제공하기 전까지 모든 쓰기 작업은 비활성화됩니다.'));
      const grid=el('div',undefined,'privileged-grid');
      consoleApi.PRIVILEGED_PLACEHOLDERS.forEach((capability)=>{
        const item=el('article',undefined,'privileged-item');item.setAttribute('aria-disabled','true');
        const copy=el('div');copy.append(el('h3',capability.title),el('p',capability.description));
        const side=el('span','연동 대기','privileged-state');
        const button=el('button','준비 중');button.disabled=true;
        side.append(button);
        item.append(copy,side);grid.append(item);
      });
      panel.append(grid);
    }
    function renderConsole(grant){
      restricted.hidden=true;restricted.replaceChildren();
      main.hidden=false;
      const isSuper=authority.isSuperAdminAuthority(grant);
      badge.textContent=grant.label;badge.className='admin-role-badge '+(isSuper?'admin':'operator');badge.dataset.roleState=isSuper?'admin':'operator';
      const apiBase=authority.resolveApiBase();
      const sections=consoleApi.consoleSections(grant);
      const lead=el('div',undefined,'admin-lead');
      lead.append(el('h1','단지온 운영관리'),el('p','방림명지로드힐 · 권한은 로그인 수단이 아니라 단지온 통합 회원(서버 권한 기록)에 귀속됩니다.'));
      const tabs=el('nav',undefined,'admin-tabs');tabs.setAttribute('aria-label','운영관리 메뉴');
      const panel=el('section',undefined,'admin-panel');
      const note=el('p','이 화면은 조회 전용입니다. 상태 변경·승인 등의 쓰기 작업은 백엔드 쓰기가 별도 검토·승인된 뒤에 순차 활성화됩니다.','admin-note');
      main.append(lead,tabs,note,panel);
      const open=(tab)=>{
        [...tabs.children].forEach((button)=>button.classList.toggle('active',button===tab.button));
        if(tab.section)renderSection(panel,tab.section,apiBase);else renderPrivileged(panel);
      };
      const tabsModel=sections.operational.map((section)=>({button:el('button',section.title),section}));
      if(sections.privileged.length)tabsModel.push({button:el('button','최고관리','privileged'),section:null});
      tabsModel.forEach((tab)=>{tab.button.addEventListener('click',()=>open(tab));tabs.append(tab.button)});
      open(tabsModel[0]);
    }
    authority.fetchAuthority(fetch).then((grant)=>{
      if(authority.hasAdminSurface(grant))renderConsole(grant);else showRestricted(grant.state);
    });
  </script>
</body>
</html>
