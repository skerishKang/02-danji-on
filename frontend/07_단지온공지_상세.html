<script type="module">
import { createNewsBridge, DANJION_COMPLEX_SLUG } from './assets/danjion-news-bridge.js';

const apiBase = (new URLSearchParams(location.search).get('apiBase') || '').replace(/\/+$/, '');
const bridge = createNewsBridge({ apiBase, complexSlug: DANJION_COMPLEX_SLUG });

const labelEl = document.getElementById("noticeLabel");
const numEl = document.getElementById("noticeNum");
const routeLabelEl = document.getElementById("routeLabel");
const h1El = document.getElementById("noticeH1");
const leadEl = document.getElementById("noticeLead");
const indexEl = document.getElementById("noticeIndex");
const contentEl = document.getElementById("noticeContent");

const params = new URLSearchParams(location.search);
const postId = params.get('postId') || params.get('notice') || '';

async function loadPost() {
  let post = null;
  if (postId) {
    const result = await bridge.getPost(postId);
    if (result.ok) post = result.data;
    else console.error('Failed to load post:', result.error);
  }

  if (post) {
    labelEl.textContent = post.category || post.channel || '공지';
    numEl.textContent = '01';
    routeLabelEl.textContent = '단지온공지';
    h1El.textContent = post.title;
    leadEl.textContent = post.body?.slice(0, 200) || '';
    document.title = '단지온공지 · ' + post.title;

    const bodyText = post.body || '';
    const sections = bodyText.split('\n\n').filter(s => s.trim());
    const html = sections.map(s => '<p class="opening">' + s.replace(/\n/g, '<br/>') + '</p>').join('');
    contentEl.innerHTML = html;
    indexEl.innerHTML = '';
  }
}
