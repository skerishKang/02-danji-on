   html:'<p class="opening">단지온은 <strong>방림명지로드힐 주민의 생활을 더 편리하게 연결하는 플랫폼</strong>입니다. 복잡한 기능을 찾아다니지 않아도 아래 네 가지 메뉴에서 필요한 일을 바로 시작할 수 있습니다.</p><section class="menu-guide" id="menus"><div class="guide-row"><span class="num">01</span><h2>홈</h2><p>오늘 확인할 이웃의 일, 주민혜택과 우리단지 새 소식을 간단히 모아봅니다.</p></div><div class="guide-row"><span class="num">02</span><h2>이웃가게</h2><p>우리 주민이 운영하는 가게와 가까운 이웃가게의 위치·운영시간·품목을 확인합니다.</p></div><div class="guide-row"><span class="num">03</span><h2>우리단지</h2><p>단지온공지, 아파트소식, 주민소식과 주민이 직접 이야기하는 이웃대화를 구분해 봅니다.</p></div><div class="guide-row"><span class="num">04</span><h2>내정보</h2><p>내 프로필과 이웃 온기 레벨, 작성글, 1:1 메시지, 알림과 이용 설정을 관리합니다.</p></div></section><section class="notice-box" id="privacy"><div class="kicker">개인정보 보호</div><div><h2>동·호수는 이웃에게 공개하지 않습니다.</h2><p>동·호 정보는 우리집 연결과 입주민 확인을 위한 용도로만 사용합니다. 공개 프로필에는 닉네임과 단지 이름만 표시됩니다.</p></div></section><section class="writing" id="privacyList"><span class="kicker">개인정보 보호</span><h2>보이는 정보, 지켜지는 정보</h2><p>주민에게 보이는 정보와 보호되는 정보를 구분해 운영합니다.</p><ul><li><b>공개되는 정보</b> — 닉네임, 이웃 온기 단계, 작성한 게시글·댓글·후기, 가게 소개와 운영 정보.</li><li><b>보호되는 정보</b> — 동·호수, 실명, 연락처, 이메일, 우리집 등록 정보와 가족 구성 정보.</li><li><b>가게 프로필</b> — 가게 이름과 운영 정보만 공개하며, 운영자의 개인 계정 정보는 연결해서 보여주지 않습니다.</li><li><b>문의 기록</b> — 가게에 문의한 내용은 가게 주인에게만 전달되고, 운영 기준에 따라 보관 기간이 지난 뒤 삭제됩니다.</li></ul></section><section class="writing" id="writing"><span class="kicker">글쓰기 운영</span><h2>편하게 쓰되, 서로를 지키는 기준이 있습니다.</h2><p>이웃대화에서는 말머리를 골라 가입인사, 단지이야기, 궁금해요, 같이해요를 나눌 수 있습니다. 본문은 최소 10자 이상 써 주세요.</p><ul><li><b>지켜주세요</b> — 욕설·비방·혐오 표현, 개인정보 무단 공개, 반복 광고와 도배는 금지입니다.</li><li><b>운영 조치</b> — 기준을 벗어난 글은 신고 확인 후 숨김 또는 삭제될 수 있고, 반복되면 이용이 제한됩니다.</li><li><b>신고</b> — 글·댓글의 신고 버튼으로 알려주시면 운영진이 확인하고 조치합니다. 신고 내역은 신고자에게 별도로 알리지 않습니다.</li><li><b>가게 후기</b> — 실제 이용 경험 중심으로 남기고, 가게 주인이 답글을 달 수 있습니다. 별점은 받지 않습니다.</li><li><b>운영진에게만 전할 내용</b> — 내정보의 1:1 문의를 이용합니다.</li></ul></section>'},
  biz:{label:'이웃가게 운영',num:'02',route:'이웃가게 안내',title:'주민 사업자와 이웃가게 등록 안내드립니다.',lead:'우리 주민의 가게를 먼저 소개하고, 등록부터 혜택까지 한 번에 알려드립니다.',date:'2026.09.06 업데이트',
   index:[['apply','등록 신청 방법'],['check','운영 확인 절차'],['info','가게 프로필 정보'],['benefit','주민 혜택 등록'],['review','후기와 문의']],
   html:'<p class="opening">이웃가게는 <strong>우리 주민이 직접 하는 일을 가장 먼저 소개하는 공간</strong>입니다. 등록은 무료이고, 아래 절차로 진행됩니다.</p><section class="writing" id="apply"><span class="kicker">등록 신청 방법</span><h2>이웃가게에서 신청서를 작성합니다.</h2><p>이웃가게 화면의 <b>내 가게 등록 신청</b>을 누르면 신청서가 열립니다.</p><ul><li>가게 이름과 업종(반찬·세탁·자동차·과외 등), 운영 방식을 적어주세요.</li><li>가게 소개와 제공 서비스, 대표 사진을 올려주세요.</li><li>주민 혜택 등록은 선택입니다. 없어도 등록할 수 있습니다.</li></ul></section><section class="writing" id="check"><span class="kicker">운영 확인 절차</span><h2>주민 관계를 확인한 뒤 게시합니다.</h2><p>관계 우선순위는 단지온의 중심 원칙입니다.</p><ul><li><b>우리 주민 가게</b> — 현재 단지 주민이 직접 운영하는 가게. 가장 먼저 보여집니다.</li><li><b>주민 가족 가게</b> — 주민의 가족이 운영하는 가게.</li><li><b>이웃가게</b> — 인근 단지·동네의 가게.</li></ul><p>확인이 필요한 경우 사업자등록증이나 서류를 요청할 수 있고, 제출은 ceo@padiem.net 으로 진행합니다. 확인 결과는 신청서에 남긴 연락 방법으로 안내합니다.</p></section><section class="writing" id="info"><span class="kicker">가게 프로필 정보</span><h2>주민이 판단할 수 있는 정보를 담습니다.</h2><ul><li>서비스 품목, 이용 방법, 운영 시간, 위치 안내(정확한 주소 대신 생활권 안내).</li><li>가게 사진은 실제 작업·판매 장면을 사용합니다.</li><li>동·호수와 개인 연락처는 가게 정보에 넣지 않습니다. 문의는 가게 문의로 받습니다.</li></ul></section><section class="writing" id="benefit"><span class="kicker">주민 혜택 등록</span><h2>혜택은 선택, 약속은 지킵니다.</h2><ul><li>할인·출장비 면제·무료 상담 같은 주민 혜택을 등록하면 혜택 보기와 쿠폰으로 표시됩니다.</li><li>혜택은 예약·방문 시 주민 확인 후 적용하며, 적용 방식은 가게 안내를 우선합니다.</li><li>혜택 내용을 바꿀 때는 신청서 수정으로 알려주세요.</li></ul></section><section class="writing" id="review"><span class="kicker">후기와 문의</span><h2>이용한 주민이 후기를 남깁니다.</h2><ul><li>후기는 별점 없이 이용 경험 중심으로 남기고, 가게 주인이 답글을 달 수 있습니다.</li><li>가게 문의는 가게 주인의 메시지함으로 전달됩니다.</li><li>허위 후기나 악의적 후기는 운영 기준에 따라 조치될 수 있습니다.</li></ul></section>'},
  message:{label:'주민 소통',num:'03',route:'1:1 메시지 안내',title:'주민 간 1:1 메시지 이용 안내드립니다.',lead:'이웃과 주고받는 1:1 메시지의 시작 방법과 안전 기준을 알려드립니다.',date:'2026.09.06 업데이트',
   index:[['start','메시지 시작 방법'],['shop','가게 문의는 이렇게'],['safe','차단·신고와 설정'],['manner','메시지 예절']],
   html:'<p class="opening">메시지는 <strong>실시간 채팅이 아닌 편지처럼 주고받는 1:1 대화</strong>입니다. 답장은 상대가 확인하는 대로 도착합니다.</p><section class="writing" id="start"><span class="kicker">메시지 시작 방법</span><h2>프로필에서 보내거나, 글에서 이어갑니다.</h2><ul><li>이웃의 공개 프로필이나 게시글 작성자를 눌러 메시지를 보냅니다.</li><li>받은 메시지는 내정보의 메시지함에 쌓이고, 답장하면 같은 대화에 이어집니다.</li><li>대화 상대는 닉네임으로 표시되고, 동·호수는 보이지 않습니다.</li></ul></section><section class="writing" id="shop"><span class="kicker">가게 문의는 이렇게</span><h2>가게에 문의하면 가게 주인에게 갑니다.</h2><ul><li>가게 팝업의 <b>가게 문의</b>로 보낸 문의는 가게 주인의 메시지함에 <b>가게 문의</b>로 표시됩니다.</li><li>가게 주인이 답장하면 대화에 가게 이름으로 표시됩니다.</li><li>예약 확정이나 결제는 가게 안내에 따라 진행합니다.</li></ul></section><section class="writing" id="safe"><span class="kicker">차단·신고와 설정</span><h2>불편할 때 바로 쓸 수 있게 만들어 뒀습니다.</h2><ul><li>대화 상대를 <b>차단</b>하면 더 이상 메시지를 받지 않습니다.</li><li><b>신고</b>하면 운영진이 확인하고 조치합니다.</li><li>설정에서 메시지 받기와 알림을 끌 수 있습니다.</li></ul></section><section class="writing" id="manner"><span class="kicker">메시지 예절</span><h2>이웃 사이의 대화라는 것을 기억합니다.</h2><ul><li>늦은 시간의 연락은 상대를 배려해서 피해 주세요.</li><li>거래·예약 내용은 대화에 기록으로 남겨 두면 서로 도움이 됩니다.</li><li>불편한 대화는 무리하게 이어가기보다 조용히 마무리해도 괜찮습니다.</li></ul></section>'},
  level:{label:'새로운 안내',num:'04',route:'레벨 안내',title:'이웃 온기 레벨 안내 — 게시글·댓글·공감으로 LV.5까지',lead:'이웃 온기는 주민 활동이 쌓이는 기록입니다. 점수는 비공개이고, 단계(LV)만 프로필에 표시돼요.',date:'2026.09.06 업데이트',
   index:[['lvLevels','레벨 단계'],['lvScore','온기 점수 획득 방법'],['lvNote','알아두세요']],
   html:'<div class="lv-row"><span class="lv-badge lv1">LV.1</span><div class="lv-text"><b>시작 새 이웃</b><small>단지온 가입과 동시에 시작합니다.</small><em>0점 이상</em></div></div><div class="lv-row"><span class="lv-badge lv2">LV.2</span><div class="lv-text"><b>인사하는 이웃</b><small>첫 인사와 반응을 나눕니다.</small><em>30점 이상</em></div></div><div class="lv-row"><span class="lv-badge lv3">LV.3</span><div class="lv-text"><b>참여하는 이웃</b><small>게시글과 댓글로 꾸준히 대화합니다.</small><em>80점 이상</em></div></div><div class="lv-row"><span class="lv-badge lv4">LV.4</span><div class="lv-text"><b>도움 주는 이웃</b><small>유용한 정보와 답을 나눕니다.</small><em>160점 이상</em></div></div><div class="lv-row"><span class="lv-badge lv5">LV.5</span><div class="lv-text"><b>함께 만드는 이웃</b><small>단지 문화를 함께 만드는 최고 단계입니다.</small><em>280점 이상</em></div></div><h2 style="font-size:25px;letter-spacing:-.04em;margin:36px 0 0" id="lvScore">온기 점수 획득 방법</h2><div class="lv-score"><div>게시글 작성 <b>+10</b></div><div>가게 후기 작성 <b>+10</b></div><div>댓글 작성 <b>+3</b> <small>하루 최대 9점</small></div><div>공감 보내기 <b>+1</b> <small>하루 최대 5점</small></div><div>받은 공감 <b>+1</b> <small>받을 때마다</small></div><div>가게 주인 답글 받기 <b>+5</b> <small>내 가게 후기에</small></div></div><h2 style="font-size:25px;letter-spacing:-.04em;margin:36px 0 14px" id="lvNote">알아두세요</h2><p>온기는 경쟁 점수가 아니라 꾸준함의 기록입니다. 점수는 비공개이며 프로필에는 단계만 표시됩니다.</p><p>도배·어뷰징으로 인한 점수는 운영 기준에 따라 조정될 수 있고, 레벨이 낮아도 좋은 글은 언제나 환영합니다.</p>'}
 };
 const q=new URLSearchParams(location.search), key=q.get("notice")||"first", data=NOTICES[key]||NOTICES.first;
 document.getElementById("noticeLabel").textContent=data.label;
 document.getElementById("noticeNum").textContent=data.num;
 document.getElementById("routeLabel").textContent=data.route;
 document.getElementById("noticeH1").textContent=data.title;

 document.title="단지온공지 · "+data.title;
 document.getElementById("noticeIndex").innerHTML=data.index.map((x,i)=>"<a href=\"#"+x[0]+"\""+(i===0?" aria-current=\"true\"":"")+">"+x[1]+"</a>").join("");
 document.getElementById("noticeContent").innerHTML=data.html;
 const links=[...document.querySelectorAll("#noticeIndex a")];
 const setActive=id=>links.forEach(a=>{const on=a.getAttribute("href")==="#"+id;a.setAttribute("aria-current",on?"true":"false");a.style.color=on?"var(--coral)":"";});
 if(links.length)setActive(links[0].getAttribute("href").slice(1));
 const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setActive(e.target.id)})},{rootMargin:"-30% 0px -60% 0px"});
 data.index.forEach(x=>{const t=document.getElementById(x[0]);if(t)obs.observe(t)});
})();
