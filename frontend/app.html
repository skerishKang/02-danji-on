<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단지온 · 앱 v3</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#091323;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}
.app-stage{min-height:100svh;display:grid;place-items:center;padding:18px}
.app-frame{display:block;width:390px;height:844px;max-width:100vw;border:0;background:#fff;box-shadow:0 18px 56px rgba(0,0,0,.30)}
.app-build-badge{margin-top:10px;font-size:11px;color:rgba(255,255,255,.45);letter-spacing:.02em;text-align:center;user-select:all}
@media(max-width:430px){html,body{background:#fff}.app-stage{display:block;padding:0;min-height:100svh}.app-frame{width:100vw;height:100svh;max-width:none;box-shadow:none}.app-build-badge{display:none}}
</style>
<script>
try{
  sessionStorage.setItem("danjion:shopVariant","v3");
  localStorage.setItem("danjion:shopVariant","v3");
}catch(e){}
</script>

</head>
<body>
<main class="app-stage">
  <iframe class="app-frame" id="danjionAppFrame" src="index.html?variant=v3" data-build="__DANJION_BUILD_SHA__" title="단지온 앱 v3 최신 수정본"></iframe>
  <div class="app-build-badge" id="danjionBuildBadge" aria-label="빌드 식별자">빌드: <span id="danjionBuildId">__DANJION_BUILD_SHA__</span></div>
</main>
<script>
(function(){
  const frame=document.getElementById('danjionAppFrame');
  if(!frame)return;
  const raw=(frame.getAttribute('data-build')||'').trim();
  const build=(raw&&!raw.startsWith('__'))?raw:'';
  const url=new URL(frame.getAttribute('src'),location.href);
  if(build){
    url.searchParams.set('build',build);
  }
  const target=url.pathname.split('/').pop()+url.search;
  if(frame.getAttribute('src')!==target){
    frame.src=target;
  }
  const badge=document.getElementById('danjionBuildId');
  if(badge){
    badge.textContent=build||'dev';
  }
})();
</script>
</body>
</html>
