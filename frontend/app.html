<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단지온 · 앱 v3</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#091323;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}
.app-stage{min-height:100svh;display:grid;place-items:center;padding:18px}
.app-frame{display:block;width:390px;height:844px;max-width:100vw;border:0;background:#fff;box-shadow:0 18px 56px rgba(0,0,0,.30)}
@media(max-width:430px){html,body{background:#fff}.app-stage{display:block;padding:0;min-height:100svh}.app-frame{width:100vw;height:100svh;max-width:none;box-shadow:none}}
</style>
<script>
try{
  sessionStorage.setItem("danjion:shopVariant","v3");
  localStorage.setItem("danjion:shopVariant","v3");
}catch(e){}
</script>

</head>
<body>
<main class="app-stage">
  <iframe class="app-frame" id="danjionAppFrame" src="index.html?variant=v3" title="단지온 앱 v3 최신 수정본"></iframe>
</main>
<script>
(function(){
  const frame=document.getElementById('danjionAppFrame');
  if(!frame)return;
  const stamp=(document.lastModified||'').trim();
  const url=new URL(frame.getAttribute('src'),location.href);
  if(stamp) url.searchParams.set('build',stamp);
  frame.src=url.pathname.split('/').pop()+url.search;
})();
</script>
</body>
</html>
