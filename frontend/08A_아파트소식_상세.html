<script type="module">
import { createNewsBridge, DANJION_COMPLEX_SLUG, resolveOfficialNewsImageUrl } from './assets/danjion-news-bridge.js';

const apiBase = DanjionSession.danjionApiBase();
const bridge = createNewsBridge({ apiBase, complexSlug: DANJION_COMPLEX_SLUG });

const POST_UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
const LIST_PAGE = '08_아파트소식_목록.html';
const ARTICLE_CHANNELS = new Set(['apartment_news', 'management_office']);

const titleEl = document.getElementById('articleTitle');
const bodyEl = document.getElementById('articleBody');
const mediaEl = document.getElementById('articleMedia');
const stateEl = document.getElementById('articleState');
const dateEl = document.getElementById('articleDate');
const authorityEl = document.getElementById('authorityLabel');
const reactionZone = document.getElementById('reactionZone');
const reactBtn = document.getElementById('reactBtn');
const reactCount = document.getElementById('reactCount');
const reactionBoundary = document.getElementById('reactionBoundary');

// #817: 공감 reuses the official-news reaction contract verbatim (the same
// bridge endpoints the 08 popup uses). Counts are only ever the server's, and
// 401 / verification-403 / other-403 stay distinguishable (#765).
const REACTION_MESSAGES = {
  'login-required': '공감하려면 로그인이 필요합니다.',
  'resident-verification-required': '주민인증을 마친 뒤 공감할 수 있습니다.',
  forbidden: '공감 권한이 없습니다.',
  'not-found': '이 소식을 찾을 수 없습니다.',
  'server-mode-required': '서버 연결 후 공감할 수 있습니다.',
  'network-error': '공감을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.',
  'server-error': '공감을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.'
};

let activePost = null;
let boundaryReason = null;

function formatDate(ts) {
  if (!ts) return '';
  try { return new Date(ts).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }); } catch { return ''; }
}

// #768: server-owned category values are internal slugs (e.g. "progress").
// Residents are never shown a raw key: human-authored labels render as-is,
// everything else falls back to the service name. (Mirrors the 08 list.)
const INTERNAL_CATEGORY = /^[a-z0-9][a-z0-9 ._-]*$/i;
function categoryLabel(value) {
  const raw = String(value || '').trim();
  if (!raw || INTERNAL_CATEGORY.test(raw)) return '아파트소식';
  return raw;
}

function showState(message) {
  stateEl.textContent = message;
  stateEl.hidden = false;
  clearMedia();
  bodyEl.replaceChildren();
}

function notFound() {
  titleEl.textContent = '아파트소식';
  authorityEl.textContent = '';
  dateEl.textContent = '';
  clearMedia();
  bodyEl.replaceChildren();
  reactionZone.hidden = true;
  activePost = null;
  showState('이 소식을 찾을 수 없거나 공개되지 않았습니다. 목록에서 다시 확인해 주세요.');
}

function renderParagraphs(body) {
  bodyEl.replaceChildren();
  stateEl.hidden = true;
  // Server bodies carry either real newlines or literal \n sequences; both are
  // paragraph boundaries. The text itself is never treated as markup.
  const paragraphs = String(body || '').replace(/\\r\\n|\\n|\\r/g, '\n').split(/\n+/).map(line => line.trim()).filter(Boolean);
  for (const paragraph of paragraphs) {
    const node = document.createElement('p');
    node.textContent = paragraph;
    bodyEl.append(node);
  }
}

function paintReaction() {
  if (!activePost) return;
  reactBtn.setAttribute('aria-pressed', activePost.active ? 'true' : 'false');
  reactCount.textContent = String(activePost.count);
}

// The viewer's own 공감 state is only read when a native session exists; a
// signed-out visitor is never pre-emptively told to verify.
async function loadViewerReaction(postId) {
  const session = globalThis.DanjionSession;
  if (!session || typeof session.fetchSession !== 'function') { boundaryReason = 'login-required'; return; }
  let signedIn = false;
  try {
    const probe = await session.fetchSession(fetch);
    signedIn = typeof session.nativeSessionReady === 'function' && session.nativeSessionReady(probe);
  } catch { signedIn = false; }
  if (!signedIn) { boundaryReason = 'login-required'; return; }
  const result = await bridge.getReaction(postId);
  if (!activePost || activePost.id !== postId) return;
  if (!result.ok) { boundaryReason = result.reason; return; }
  boundaryReason = null;
  activePost.active = result.data?.active === true;
  activePost.count = Number.isFinite(result.data?.reactionCount) ? result.data.reactionCount : activePost.count;
  paintReaction();
}

async function toggleReaction() {
  if (!activePost) return;
  if (boundaryReason) {
    reactionBoundary.textContent = REACTION_MESSAGES[boundaryReason] || REACTION_MESSAGES['server-error'];
    return;
  }
  reactionBoundary.textContent = '';
  reactBtn.setAttribute('aria-disabled', 'true');
  const result = await bridge.setReaction(activePost.id, !activePost.active);
  reactBtn.removeAttribute('aria-disabled');
  if (!result.ok) {
    boundaryReason = result.reason;
    reactionBoundary.textContent = REACTION_MESSAGES[result.reason] || REACTION_MESSAGES['server-error'];
    return;
  }
  activePost.active = result.data?.active === true;
  activePost.count = Number.isFinite(result.data?.reactionCount) ? result.data.reactionCount : activePost.count;
  paintReaction();
}

reactBtn.addEventListener('click', toggleReaction);

// #844: the official-news photo is rendered only when the post carries a valid public
// official-news image key. The page never fabricates a key, never builds a Drive URL, and a
// failed load removes only the figure — the article text is never destroyed. Text-only posts
// simply render no figure. (MULTI_IMAGE stays out of scope; #817 kept the popup/article split.)
function clearMedia() {
  mediaEl.replaceChildren();
  mediaEl.hidden = true;
}

function renderMedia(post) {
  clearMedia();
  const url = resolveOfficialNewsImageUrl(apiBase, post.attachmentObjectKey);
  if (!url) return;
  const image = document.createElement('img');
  image.loading = 'lazy';
  image.decoding = 'async';
  image.alt = String(post.title || '아파트소식 사진');
  image.addEventListener('error', clearMedia);
  image.src = url;
  mediaEl.append(image);
  mediaEl.hidden = false;
}

async function loadArticle(postId) {
  if (!POST_UUID.test(String(postId || ''))) { notFound(); return; }
  const result = await bridge.getPost(postId);
  if (!result.ok || !result.data) { notFound(); return; }
  const post = result.data;
  if (!ARTICLE_CHANNELS.has(post.channel) || post.displayMode !== 'article') {
    notFound();
    return;
  }
  stateEl.hidden = true;
  const kindLabel = categoryLabel(post.category);
  authorityEl.textContent = post.authorityLabel ? `${post.authorityLabel} · ${kindLabel}` : kindLabel;
  titleEl.textContent = post.title;
  document.title = '단지온 · 아파트소식 · ' + post.title;
  dateEl.textContent = formatDate(post.publishedAt);
  renderParagraphs(post.body || '');
  renderMedia(post);
  const initial = Number.isFinite(post.reactionCount) ? Math.max(0, Math.floor(post.reactionCount)) : 0;
  reactionZone.hidden = false;
  activePost = { id: post.id, active: false, count: initial };
  boundaryReason = null;
  reactionBoundary.textContent = '';
  paintReaction();
  loadViewerReaction(post.id);
}

loadArticle(new URLSearchParams(location.search).get('post') || '');
</script>

    my:FILES.home,messages:FILES.my,messageDetail:FILES.messages,profile:FILES.my,warmth:FILES.my,
    settings:FILES.my,inquiry:FILES.settings,apply:FILES.shops,household:FILES.my,notifications:FILES.my,activity:FILES.my
  };
  location.href=parentMap[SCREEN]||FILES.home;
}

document.addEventListener('click',function(ev){
 const el=ev.target.closest('a,button,[data-route]'); if(!el)return;
 const text=norm(el.textContent), cls=el.classList||{contains:()=>false};
 if(cls.contains('brand')){ev.preventDefault();ev.stopImmediatePropagation();go('index.html');return;}
 const inMain=!!el.closest('.nav,.desktop-nav,.mobile-bottom,.topbar nav,.main-nav');
 if(inMain && ['홈','이웃가게','우리단지','내정보'].includes(text)){ev.preventDefault();ev.stopImmediatePropagation();main(text);return;}
 if(cls.contains('back')||cls.contains('route-back')||((/^←|^‹|^< /.test(text))&&!cls.contains('modal-back'))){ev.preventDefault();ev.stopImmediatePropagation();backFallback();return;}
 // known data-route or anchors
 const dr=el.dataset&&el.dataset.route; if(dr){const f=routeFrom(dr);if(f){ev.preventDefault();ev.stopImmediatePropagation();go(f);return;}}
 if(el.tagName==='A'){const f=routeFrom(el.getAttribute('href'));if(f){ev.preventDefault();ev.stopImmediatePropagation();go(f);return;}}
},true);
})();
</script>
<script id="danjion-review-route-sync">
(function(){
  try{
    if(new URLSearchParams(location.search).get('review')==='1'){
      sessionStorage.removeItem('danjionRouteStack');
    }
  }catch(e){}
  function reportRoute(){
    try{
      const file=decodeURIComponent((location.pathname.split('/').pop()||'index.html').split('?')[0]);
      if(window.parent!==window) window.parent.postMessage({type:'danjion-route',file:file,href:location.href},'*');
    }catch(e){}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',reportRoute,{once:true});else reportRoute();
  window.addEventListener('pageshow',reportRoute);
  window.addEventListener('hashchange',reportRoute);
})();
</script>
