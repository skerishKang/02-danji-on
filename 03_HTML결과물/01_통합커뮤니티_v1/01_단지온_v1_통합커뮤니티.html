function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function toast(msg,type=''){const wrap=document.getElementById('toast-wrap');const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;wrap.appendChild(el);setTimeout(()=>el.remove(),2600)}

function renderNotice(id){const n=news.find(x=>x.id===id)||news[0];return `${pageHead('공식 공지 상세','공식 계정, 작성 직책, 수정 이력과 첨부자료를 확인할 수 있습니다.','<button class="ghost-btn" data-route="news">목록으로</button><button class="secondary-btn" data-action="subscribe">후속 공지 받기</button>')}<div class="content-layout"><article class="notice-detail"><header class="detail-header"><div class="official-identity"><div class="official-seal">공식</div><div class="official-info"><strong>${n.source}</strong><span>작성: ${n.actor}</span></div></div><h1>${esc(n.title)}</h1><div class="detail-meta"><span class="priority ${priorityClass(n.priority)}">${n.priority}</span><span>${n.date} ${n.time} 게시</span><span>2026.08.04 11:20 최종 수정</span><span>확인 ${n.views}</span></div></header><div class="detail-body"><p>${esc(n.body)}</p><div class="info-box"><strong>주민 확인사항</strong><br>${n.id===1?'점검 중 한 대씩 운행하며, 긴급 이동이 필요한 세대는 관리사무소로 연락해 주십시오.':'상세 일정과 적용 범위는 아래 첨부자료에서 확인할 수 있습니다.'}</div><h2>세부 안내</h2><p>이 공지는 공식 계정에서 게시됐으며, 변경되는 내용은 기존 글을 삭제하지 않고 수정 이력과 후속 공지로 남깁니다.</p><div class="attachment-list"><div class="attachment-row"><b>▧</b><span>${n.title.replace('안내','')} 관련자료.pdf</span><button class="secondary-btn small-btn" data-action="attachment" data-id="${n.id}">미리보기</button></div>${n.attach>1?`<div class="attachment-row"><b>▧</b><span>세부 일정 및 위치도.pdf</span><button class="secondary-btn small-btn" data-action="attachment" data-id="${n.id}">미리보기</button></div>`:''}</div></div><div class="history-note"><span>최초 게시 후 첨부자료 1건이 추가되었습니다.</span><button class="ghost-btn small-btn" data-action="history">수정 이력 보기</button></div></article><aside class="side-column"><div class="side-card"><h3>게시 조직</h3><ul><li><strong>${n.source}</strong><br><small>공식 배지는 플랫폼 권한으로만 부여됩니다.</small></li><li>담당 직책: ${n.actor}</li><li>문의: 공식 질문으로 접수</li></ul><button class="secondary-btn" style="width:100%;margin-top:12px" data-route="questions">질문하기</button></div><div class="side-card"><h3>기록 보존</h3><ul><li>최초 게시 기록</li><li>내용 수정 기록</li><li>첨부자료 추가 기 function renderIssue(id){const i=issues.find(x=>x.id===id)||issues[0];const events=[['2026.07.11','문제 최초 접수','관리사무소 현장 확인 및 사진 기록'],['2026.07.15','입대의 보고','긴급 보수 필요성과 예산 범위 보고'],['2026.07.20','회의 개최','공법 비교와 추가 견적 요청'],['2026.07.26','관련 문서 접수','업체 진단서와 3개 견적서 등록'],['2026.08.03','최근 업데이트','긴급 보수 1차 완료, 원인조사 계속'],[i.next.split(' ')[0]||'2026.08.09','다음 예정','2차 현장점검 및 후속 보고']];return `${pageHead('단지 현안 상세','현재 상태, 영향, 문서, 공식 입장과 주민 질문을 한 화면에서 확인합니다.','<button class="ghost-btn" data-route="issues">현안 목록</button><button class="secondary-btn" data-action="subscribe">업데이트 구독</button>')}<section class="issue-summary"><span class="status ${i.class}">${i.status}</span><h1>${esc(i.title)}</h1><p>${esc(i.summary)}</p><div class="fact-grid"><div class="fact"><span>주민에게 미치는 영향</span><strong>${i.impact}</strong></div><div class="fact"><span>관련 조직</span><strong>${i.org}</strong></div><div class="fact"><span>최초 발생일</span><strong>${i.start}</strong></div><div class="fact"><span>최근 업데이트</span><strong>${i.updated}</strong></div><div class="fact"><span>다음 일정</span><strong>${i.next}</strong></div><div class="fact"><span>관련 문서</span><strong>${i.docs}건</strong></div></div></section><div class="content-layout" style="margin-top:18px"><div><div class="form-card"><h2 style="margin-top:0">진행 타임라인</h2><div class="timeline">${events.map((e,idx)=>`<div class="timeline-item ${idx===events.length-2?'current':''}"><time>${e[0]}</time><h4>${e[1]}</h4><p>${e[2]}</p></div>`).join('')}</div></div><div class="form-card" style="margin-top:16px"><h2 style="margin-top:0">공식 설명과 추가 의견</h2><div class="info-box"><strong>공식 입장</strong><br>확인된 문서와 회의 결과를 기준으로 긴급 조치와 후속 절차를 병행합니다.</div><div style="border-left:4px solid #b7c0c0;padding:14px 16px;background:#f7f8f8"><strong>추가 설명</strong><br>주민 질문 중 사실 확인이 필요한 내용은 답변 상태를 표시하고 확인 후 갱신합니다.</div></div></div><aside class="side-column"><div class="side-card"><h3>관련 기록</h3><ul><li>관련 회의 2건</li><li>관련 의결 1건</li><li>진단·견적 문서 ${i.docs}건</li><li>공식 질문 4건</li></ul><button class="secondary-btn" style="width:100%;margin-top:12px" data-action="attachment">관련 문서 보기</button></div><div class="side-card"><h3>주민 질문</h3><p>현안과 직접 관련된 질문은 공식 답변 상태와 함께 공개됩니다.</p><button class="primary-btn" style="width:100%" data-route="questions">질문 남기기</button></div></aside></div>`}
function renderPlaza(){const cats=['전체','자유이야기','생활정보','주차','시설','분실물','나눔','반려생활','층간생활','행사','도움요청'];const filtered=plaza.filter(p=>state.plazaCategory==='전체'||p.category===state.plazaCategory);return `${pageHead('주민광장','인증 입주민이 생활정보, 질문, 제안과 이웃 이야기를 나눕니다.','<button class="secondary-btn" data-route="proposal-create">주민제안</button><button class="primary-btn" data-route="plaza-create">글쓰기</button>')}<div class="tabbar"><button class="tab-btn active" data-route="plaza">주민게시판</button><button class="tab-btn" data-route="proposals">주민제안</button><button class="tab-btn" data-route="questions">질문·답변</button><button class="tab-btn" data-route="surveys">주민설문</button><button class="tab-btn" data-route="bazaar">장터·나눔</button></div><div class="filter-bar"><select id="plaza-category">${cats.map(c=>`<option ${c===state.plazaCategory?'selected':''}>${c}</option>`).join('')}</select><input placeholder="주민광장 검색"><button class="ghost-btn" data-action="toast" data-msg="최신순으로 정렬했습니다.">최신순</button></div><div class="plaza-list">${filtered.map(p=>`<div class="post-row"><div><span class="category">${p.category}</span>${p.official?'<div style="margin-top:5px"><span class="status st-done">공식 답변</span></div>':''}</div><div class="post-title"><button data-route="plaza-${p.id}">${esc(p.title)}</button><small>${p.author} · ${p.scope} · ${p.time}${p.photo?' · 사진':''}</small></div><div class="post-stats">공감 ${p.likes} · 댓글 ${p.comments}<br>궁금해요 ${p.curious}</div></div>`).join('')}</div>`}
function renderPost(id){const p=plaza.find(x=>x.id===id)||plaza[0];const r=state.reactions[id]||{};const comments=state.comments[id]||[];return `${pageHead('주민 게시글','인증 범위와 공식 답변 여부를 구분합니다.','<button class="ghost-btn" data-route="plaza">목록으로</button><button class="ghost-btn" data-action="report">신고</button>')}<div class="content-layout"><article class="notice-detail"><header class="detail-header"><span class="category">${p.category}</span><h1>${esc(p.title)}</h1><div class="detail-meta"><span>${p.author}</span><span>${p.scope}</span><span>${p.time}</span>${p.official?'<span class="status st-done">공식 답변 있음</span>':''}</div></header><div class="detail-body"><p>${esc(p.body)}</p>${p.photo?'<div style="height:220px;background:#e8eeee;display:grid;place-items:center;margin:20px 0;font-size:42px">생활사진 예시</div>':''}<div class="reaction-bar"><button class="reaction-btn ${r.like?'active':''}" data-action="react" data-kind="like" data-id="${id}">공감해요 ${p.likes+(r.like?1:0)}</button><button class="reaction-btn ${r.curious?'active':''}" data-action="react" data-kind="curious" data-id="${id}">궁금해요 ${p.curious+(r.curious?1:0)}</button><button class="reaction-btn ${r.checked?'active':''}" data-action="react" data-kind="checked" data-id="${id}">확인했어요 ${r.checked?1:0}</button></div>${p.official?'<div class="info-box"><strong>관리사무소 공식 답변</strong><br>접수 내용을 확인했으며 담당 직원이 현장을 점검했습니다. 후속 조치 결과는 공지로 갱신하겠습니다.</div>':''}<div class="comments"><h2>댓글 ${p.comments+comments.length}</h2><div class="comment"><strong>별명 · 이음</strong><p>정보 공유 감사합니다. 관련 공지도 함께 확인했습니다.</p><small>20분 전</small></div>${comments.map(c=>`<div class="comment"><strong>나 · 인증 입주민</strong><p>${esc(c)}</p><small>방금 전</small></div>`).join('')}<div class="comment-form"><input id="comment-input" placeholder="이웃을 존중하는 댓글을 남겨주세요"><button class="primary-btn" data-action="comment" data-id="${id}">등록</button></div></div></div></article><aside class="side-column"><div class="side-card"><h3>게시글 공개범위</h3><p>${p.scope}에게만 표시됩니다. 동·호수는 공개되지 않습니다.</p></div><div class="side-card"><h3>주민광장 원칙</h3><ul><li>실명 비방과 개인정보 금지</li><li>공식 답변은 별도 배지 표시</li><li>수정·신고 이력 보존</li></ul></div></aside></div>`}
function renderPostCreate(){return `${pageHead('주민 게시글 작성','생활정보와 이웃 이야기를 인증 입주민에게 공유합니다.','<button class="ghost-btn" data-route="plaza">취소</button>')}<form class="form-card" id="post-form"><div class="form-grid"><div class="field"><label>카테고리</label><select required><option>생활정보</option><option>주차</option><option>시설</option><option>분실물</option><option>나눔</option><option>반려생활</option><option>층간생활</option><option>행사</option><option>도움요청</option></select></div><div class="field"><label>작성자 표시</label><select><option>별명 · 사계절</option><option>동까지 공개</option><option>실명 사용</option></select></div><div class="field full"><label>제목</label><input required placeholder="주민이 내용을 바로 이해할 수 있게 작성해 주세요"></div><div class="field full"><label>내용</label><textarea required placeholder="사실과 의견을 구분하고, 필요한 날짜나 위치를 적어주세요."></textarea></div><div class="field"><label>사진 또는 자료</label><button type="button" class="ghost-btn" data-action="upload-demo">파일 선택</button><span class="help">실제 파일은 저장하지 않는 데모입니다.</span></div><div class="field"><label>공개범위</label><select><option>인증 입주민 전체</option><option>내 동 주민</option></select></div></div><div class="form-actions"><button type="button" class="ghost-btn" data-route="plaza">취소</button><button class="primary-btn" type="submit">게시글 등록</button></div></form>`}
function renderProposals(){return `${pageHead('주민제안','자유게시글과 달리 문제, 제안, 기대효과와 처리상태를 구조화합니다.','<button class="primary-btn" data-route="proposal-create">제안 작성</button>')}<div class="tabbar"><button class="tab-btn active">전체</button><button class="tab-btn" data-action="toast" data-msg="처리 중 제안만 표시했습니다.">처리 중</button><button class="tab-btn" data-action="toast" data-msg="완료된 제안만 표시했습니다.">완료</button></div><div class="plaza-list">${proposals.map(p=>`<div class="post-row"><div><span class="category">${p.field}</span><div style="margin-top:5px"><span class="status ${statusClass(p.status)}">${p.status}</span></div></div><div class="post-title"><button data-route="proposal-${p.id}">${esc(p.title)}</button><small>${p.author} · ${p.date}</small><small>${esc(p.summary)}</small></div><div class="post-stats"><button class="secondary-btn small-btn" data-route="proposal-${p.id}">처리과정</button></div></div>`).join('')}</div>`}
function renderProposalCreate(){return `${pageHead('주민제안 작성','현재 문제와 기대효과를 구분해 작성하면 공식 처리 흐름으로 접수됩니다.','<button class="ghost-btn" data-route="proposals">취소</button>')}<form class="form-card" id="proposal-form"><div class="form-grid"><div class="field"><label>제안 분야</label><select required><option>시설</option><option>주차</option><option>안전</option><option>복지</option><option>환경</option><option>소통</option></select></div><div class="field"><label>답변 희망 조직</label><select><option>관리사무소</option><option>입주자대표회의</option><option>모두</option></select></div><div class="field full"><label>제안 제목</label><input required placeholder="예: 분리수거장 우천 차양 설치 제안"></div><div class="field full"><label>현재 문제</label><textarea required placeholder="현재 어떤 문제가 반복되고 있는지 작성해 주세요."></textarea></div><div class="field full"><label>제안 내용</label><textarea required placeholder="구체적인 개선 방법을 작성해 주세요."></textarea></div><div class="field full"><label>기대 효과</label><textarea required placeholder="주민 생활과 단지 운영에 어떤 도움이 되는지 작성해 주세요."></textarea></div><div class="field"><label>사진 또는 자료</label><button type="button" class="ghost-btn" data-action="upload-demo">파일 선택</button></div><div class="field"><label>공개범위</label><select><option>인증 입주민 전체</option><option>제안자와 공식조직만</option></select></div></div><div class="form-actions"><button type="button" class="ghost-btn" data-route="proposals">취소</button><button class="primary-btn" type="submit">제안 접수</button></div></form>`}
function renderProposal(id){const p=proposals.find(x=>x.id===id)||proposals[0];const status=id===1?state.proposalStatus:p.status;const flow=['접수','관리사무소 확인','입대의 검토',status==='미반영'?'미반영':'처리 완료'];return `${pageHead('주민제안 상세','제안이 반영되지 않더라도 처리과정과 사유를 기록합니다.','<button class="ghost-btn" data-route="proposals">목록으로</button>')}<div class="content-layout"><article class="notice-detail"><header class="detail-header"><span class="category">${p.field}</span><h1>${esc(p.title)}</h1><div class="detail-meta"><span>${p.author}</span><span>${p.date}</span><span class="status ${statusClass(status)}">${status}</span></div></header><div class="detail-body"><h2>현재 문제</h2><p>우천 시 분리수거장 일부 구역에 빗물이 유입되어 종이류가 젖고 정리 작업이 반복됩니다.</p><h2>제안 내용</h2><p>${esc(p.summary)} 통행과 환기를 방해하지 않는 범위에서 부분 차양과 배수 유도판을 함께 검토해 주십시오.</p><h2>기대 효과</h2><p>재활용품 훼손과 관리 인력의 반복 정리 부담을 줄일 수 있습니다.</p><h2>처리과정</h2><div class="timeline">${flow.map((x,idx)=>`<div class="timeline-item ${idx===2?'current':''}"><time>2026.0${8-(idx>1?0:0)}.${3+idx}</time><h4>${x}</h4><p>${idx===0?'제안이 정상 접수됐습니다.':idx===1?'현장 상태와 설치 가능 위치를 확인했습니다.':idx===2?'8월 정기회의 안건 상정 여부를 검토합니다.':'결과와 사유를 공개합니다.'}</p></div>`).join('')}</div>${status==='미반영'?'<div class="info-box"><strong>미반영 사유</strong><br>현재 설치공간과 배수 구조상 즉시 반영이 어려워 차기 시설개선 계획에서 재검토합니다.</div>':''}</div></article><aside class="side-column"><div class="side-card"><h3>담당 조직</h3><p>관리사무소 확인 후 입주자대표회의 검토 단계입니다.</p><button class="secondary-btn" style="width:100%" data-route="questions">추가 질문</button></div><div class="side-card"><h3>운영자 데모</h3><p>권한 있는 공식 계정만 처리상태를 변경할 수 있습니다.</p><button class="primary-btn" style="width:100%" data-route="admin-proposals">처리 화면 보기</button></div></aside></div>`}
function renderQuestions(){return `${pageHead('주민 질문·공식 답변','관리사무소, 입주자대표회의와 선거관리위원회에 구조화된 질문을 남깁니다.','<button class="primary-btn" data-action="question-modal">질문 작성</button>')}<div class="filter-bar"><button class="chip active">전체</button><button class="chip" data-action="toast" data-msg="답변 대기 질문만 표시했습니다.">답변 대기</button><button class="chip" data-action="toast" data-msg="답변 완료 질문만 표시했습니다.">답변 완료</button></div><div class="plaza-list">${questions.map(q=>`<div class="post-row"><div><span class="status ${statusClass(q.status)}">${q.status}</span></div><div class="post-title"><button data-action="question-detail" data-id="${q.id}">${esc(q.title)}</button><small>답변 희망: ${q.org} · ${q.date}</small></div><div class="post-stats"><button class="secondary-btn small-btn" data-action="question-detail" data-id="${q.id}">보기</button></div></div>`).join('')}</div>`}
function renderSurveys(){return `${pageHead('주민설문','일반 의견수렴과 공식 전자투표 안내를 명확히 구분합니다.','<button class="secondary-btn" data-action="toast" data-msg="공식 전자투표는 별도 인증 서비스로 안내됩니다.">전자투표 안내</button>')}<div class="survey-warning"><strong>알림</strong> · 아래 설문은 주민 의견수렴용이며 공식 의결 또는 법적 전자투표가 아닙니다.</div>${surveys.map(s=>surveyCard(s)).join('')}`}
function surveyCard(s){const voted=state.surveyVotes[s.id];const total=s.results.reduce((a,b)=>a+b,0)+(voted!==undefined?1:0);return `<article class="survey-card"><span class="category">${s.type}</span><h3>${esc(s.title)}</h3><p>마감 ${s.deadline} · 현재 참여 ${s.count+(voted!==undefined?1:0)}명 · 결과 ${s.public?'공개':'마감 후 공개'}</p>${voted===undefined?`<div>${s.options.map((o,i)=>`<label class="survey-option"><input type="radio" name="survey-${s.id}" value="${i}"><span>${o}</span></label>`).join('')}</div><button class="primary-btn" data-action="vote" data-id="${s.id}">선택 제출</button>`:`<div class="info-box"><strong>참여 완료</strong><br>내 선택: ${s.options[voted]}</div>${s.options.map((o,i)=>{const n=s.results[i]+(voted===i?1:0);const pct=Math.round(n/total*100);return `<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><span>${o}${voted===i?' · 내 선택':''}</span><strong>${pct}%</strong></div><div class="result-bar"><span style="width:${pct}%"></span></div></div>`}).join('')}`}</article>`}
function renderMarket(){const relations=['전체','방림명지로드힐 주민 운영','이웃 단지 주민 운영','우리 동네 가게'];const cats=['전체',...new Set(shops.map(s=>s.category))];const filtered=shops.filter(s=>(state.shopRelation==='전체'||s.relation===state.shopRelation)&&(state.shopCategory==='전체'||s.category===state.shopCategory)&&(!state.shopQuery||s.name.includes(state.shopQuery)||s.desc.includes(state.shopQuery)||s.category.includes(state.shopQuery)));return `<section class="market-hero"><div><span class="relation-badge">단지온 이웃가게</span><h1>가까운 이웃의 가게와 서비스를 찾습니다</h1><p>광고비보다 주민 관계등급을 우선하며 정확한 동·호수는 공개하지 않습니다.</p></div><div class="market-search"><input id="shop-query" value="${esc(state.shopQuery)}" placeholder="가게, 서비스, 업종 검색"><button class="coral-btn" data-action="shop-search">검색</button></div></section><div class="category-chips">${cats.map(c=>`<button class="chip ${state.shopCategory===c?'active':''}" data-action="shop-category" data-value="${c}">${c}</button>`).join('')}</div><div class="filter-bar"><select id="shop-relation">${relations.map(r=>`<option ${r===state.shopRelation?'selected':''}>${r}</option>`).join('')}</select><button class="secondary-btn" data-route="benefits">주민혜택</button><button class="primary-btn" data-route="business-register">내 가게 등록</button></div><div style="margin-bottom:11px;color:var(--muted);font-size:13px">관계등급 우선순위에 따른 ${filtered.length}개 결과</div><div class="shop-grid">${filtered.map(shopCard).join('')}</div>`}
function shopCard(s){return `<article class="shop-card"><div class="shop-image">${s.icon}<button class="favorite ${state.favorites.has(s.id)?'active':''}" data-action="favorite" data-id="${s.id}" aria-label="찜하기">${state.favorites.has(s.id)?'♥':'♡'}</button></div><div class="shop-body"><span class="relation-badge">${s.relation}</span><h3><button data-route="shop-${s.id}" style="border:0;background:transparent;padding:0;font-weight:750;text-align:left">${esc(s.name)}</button></h3><p>${esc(s.desc)}</p><span class="benefit-tag">${esc(s.benefit)}</span></div></article>`}
function renderShop(id){const s=shops.find(x=>x.id===id)||shops[0];return `${pageHead('가게와 서비스 상세','주민 관계 인증, 제공 범위와 주민혜택을 구분합니다.','<button class="ghost-btn" data-route="market">목록으로</button>')}<section class="shop-detail"><div class="shop-detail-visual">${s.icon}</div><div class="shop-detail-info"><span class="relation-badge">${s.relation}</span><h1>${esc(s.name)}</h1><p>${esc(s.desc)}. 정확한 세대 정보는 공개하지 않으며, 운영 관계는 플랫폼의 품질 보증을 의미하지 않습니다.</p><div class="benefit-box"><strong>주민 전용 혜택</strong><br>${esc(s.benefit)} · 인증 입주민 화면 제시</div><div class="fact-grid"><div class="fact"><span>업종</span><strong>${s.category}</strong></div><div class="fact"><span>영업지역</span><strong>${s.area}</strong></div><div class="fact"><span>연락 방식</span><strong>안전 문의 연결</strong></div><div class="fact"><span>관계 확인</span><strong>2026.08.01</strong></div></div><div class="detail-actions"><button class="ghost-btn" data-action="favorite" data-id="${s.id}">${state.favorites.has(s.id)?'♥ 찜함':'♡ 찜하기'}</button><button class="coral-btn" data-action="contact-shop">문의하기</button></div></div></section><section class="section" style="margin-top:20px"><div class="section-head"><h2>대표 상품·서비스</h2></div><div class="grid-3" style="margin-top:15px">${['기본 서비스','주민 맞춤 서비스','예약 상담'].map((x,i)=>`<div class="community-card"><span class="category">${x}</span><h3>${i===0?s.name+' 기본형':i===1?'단지온 주민 패키지':'사전 상담'}</h3><p>${i===0?'상세 가격은 문의 시 안내합니다.':i===1?s.benefit:'일정과 제공 범위를 먼저 확인합니다.'}</p><button class="secondary-btn small-btn" style="margin-top:13px" data-action="contact-shop">문의</button></div>`).join('')}</div></section>`}
function renderBenefits(){return `${pageHead('생활혜택','인증 입주민에게 제공되는 이웃가게 혜택과 공동체 프로그램을 확인합니다.','<button class="primary-btn" data-route="market">가게와 서비스</button>')}<div class="benefit-list">${shops.slice(0,6).map(s=>`<div class="benefit-card"><span class="relation-badge">${s.relation}</span><h3>${esc(s.name)}</h3><p>${esc(s.benefit)}</p><small style="color:var(--muted)">인증 입주민 전용 · 중복 적용 여부는 가게별 확인</small><div style="margin-top:12px"><button class="coral-btn small-btn" data-route="shop-${s.id}">혜택 보기</button></div></div>`).join('')}</div>`}
function renderBusinessRegister(){const steps=['기본정보','서비스','사진·가격','주민혜택','검토','AI 홍보실'];const step=state.businessStep;return `${pageHead('사업자 등록과 AI 홍보실','프롬프트 입력 없이 질문형 흐름으로 가게 정보와 홍보물을 만듭니다.','<button class="ghost-btn" data-route="market">나가기</button>')}<div class="stepper">${steps.map((s,i)=>`<div class="step ${i+1===step?'active':i+1<step?'done':''}"><span>${s}</span></div>`).join('')}</div><div class="form-card">${businessStepContent(step)}<div class="form-actions"><button class="ghost-btn" data-action="business-prev" ${step===1?'disabled':''}>이전</button><button class="${step===6?'coral-btn':'primary-btn'}" data-action="business-next">${step===6?'홍보물 저장':'다음'}</button></div></div>`}
function businessStepContent(step){if(step===1)return `<h2 style="margin-top:0">가게 또는 서비스 기본정보</h2><div class="form-grid"><div class="field"><label>가게 또는 서비스명</label><input value="단지온 홈케어"></div><div class="field"><label>업종</label><select><option>청소·수리</option></select></div><div class="field full"><label>한 줄 소개</label><input value="생활 속 작은 수리와 정리 서비스를 방문 제공합니다."></div><div class="field"><label>영업지역</label><input value="광주 남구"></div><div class="field"><label>연락 방식</label><select><option>단지온 안전문의</option><option>전화번호 공개</option></select></div></div>`;if(step===2)return `<h2 style="margin-top:0">대표 상품과 서비스</h2><div class="form-grid"><div class="field full"><label>대표 서비스</label><textarea>수전 교체, 조명 교체, 가구 조립, 생활공간 정리</textarea></div><div class="field full"><label>서비스 특징</label><textarea>방문 전 작업 범위와 예상비용을 먼저 안내하고, 추가 작업은 동의 후 진행합니다.</textarea></div></div>`;if(step===3)return `<h2 style="margin-top:0">사진과 가격 정보</h2><div class="form-grid"><div class="field"><label>대표사진</label><button class="ghost-btn" data-action="upload-demo">사진 선택</button></div><div class="field"><label>가격 표시 방식</label><select><option>대표가격 공개</option><option>상담 후 안내</option></select></div><div class="field full"><label>대표가격</label><input value="기본 출장 20,000원부터"></div></div>`;if(step===4)return `<h2 style="margin-top:0">주민혜택</h2><div class="form-grid"><div class="field"><label>혜택 유형</label><select><option>출장비 할인</option><option>추가 서비스</option><option>첫 이용 할인</option></select></div><div class="field"><label>혜택 내용</label><input value="단지온 인증 주민 출장비 5천원 할인"></div><div class="field full"><label>적용 조건</label><input value="예약 시 단지온 주민임을 알려주세요."></div></div>`;if(step===5)return `<h2 style="margin-top:0">등록정보 검토</h2><div class="info-box"><strong>관계 인증 검수 예정</strong><br>정확한 동·호수는 공개되지 않으며 플랫폼 운영자가 주민 운영 여부만 확인합니다.</div><div class="attachment-list"><div class="attachment-row"><span>기본정보</span><strong>작성 완료</strong></div><div class="attachment-row"><span>서비스 정보</span><strong>작성 완료</strong></div><div class="attachment-row"><span>주민혜택</span><strong>출장비 5천원 할인</strong></div></div>`;return `<h2 style="margin-top:0">AI 홍보실 미리보기</h2><p style="color:var(--muted)">입력한 정보를 바탕으로 소개글과 홍보물을 자동 구성했습니다. 프롬프트를 직접 작성할 필요가 없습니다.</p><div class="grid-2"><div class="community-card store"><span class="relation-badge">방림명지로드힐 주민 운영</span><h3>단지온 홈케어</h3><p>생활 속 작은 수리와 정리를 이웃 주민이 직접 방문해 도와드립니다.</p><span class="benefit-tag">출장비 5천원 할인</span></div><div class="community-card"><span class="category">게시판 포스터</span><h3>집 안 작은 수리, 미루지 마세요</h3><p>수전·조명·가구 조립 · 사전 비용 안내</p><button class="coral-btn small-btn" style="margin-top:12px" data-action="promo-preview">전체 미리보기</button></div></div><div class="attachment-list"><div class="attachment-row"><span>가게 소개글</span><button class="ghost-btn small-btn" data-action="toast" data-msg="소개글을 복사했습니다.">복사</button></div><div class="attachment-row"><span>모바일 홍보카드</span><button class="ghost-btn small-btn" data-action="promo-preview">보기</button></div><div class="attachment-row"><span>카카오톡 공유 이미지</span><button class="ghost-btn small-btn" data-action="promo-preview">보기</button></div><div class="attachment-row"><span>짧은 홍보영상 미리보기</span><button class="ghost-btn small-btn" data-action="promo-preview">보기</button></div></div>`}
function renderBazaar(){return `${pageHead('장터·나눔·공동구매','입주민 사이의 생활 물품과 공동수요를 안전하게 연결합니다.','<button class="primary-btn" data-action="bazaar-write">글 등록</button>')}<div class="tabbar"><button class="tab-btn active">전체</button><button class="tab-btn" data-action="toast" data-msg="나눔만 표시했습니다.">나눔</button><button class="tab-btn" data-action="toast" data-msg="판매글만 표시했습니다.">장터</button><button class="tab-btn" data-action="toast" data-msg="공동구매만 표시했습니다.">공동구매</button></div><div class="shop-grid">${bazaar.map((b,i)=>`<article class="shop-card"><div class="shop-image" style="background:#eef4f2">${['🚲','📚','🧴','🪴','🏕️'][i]}</div><div class="shop-body"><span class="category">${b.type}</span><h3>${esc(b.title)}</h3><p>${b.time}</p><span class="benefit-tag" style="background:var(--brand-soft);color:var(--brand-2)">${b.price}</span><button class="secondary-btn small-btn" style="margin-top:12px" data-action="bazaar-detail">상세보기</button></div></article>`).join('')}</div>`}
function renderMy(){return `${pageHead('마이페이지','내 활동, 찜한 가게, 인증정보와 권한별 관리 메뉴를 확인합니다.','')}<div class="my-layout"><aside><div class="profile-card"><div class="avatar">사</div><div><strong>사계절</strong><br><span class="verification-chip">✓ 인증 입주민</span></div><small>공개범위: 별명 사용</small></div><div class="side-menu"><button class="${state.myTab==='activity'?'active':''}" data-action="my-tab" data-value="activity">내 활동</button><button class="${state.myTab==='favorites'?'active':''}" data-action="my-tab" data-value="favorites">찜한 가게</button><button class="${state.myTab==='store'?'active':''}" data-action="my-tab" data-value="store">내 가게 관리</button><button class="${state.myTab==='settings'?'active':''}" data-action="my-tab" data-value="settings">인증·공개설정</button><button data-route="admin">공식 계정 관리</button></div></aside><section class="my-content">${myTabContent()}</section></div>`}

function renderVerify(){const steps=['단지 선택','동·호 입력','가입코드','휴대전화','공개범위','완료'];const step=state.verifyStep;return `${pageHead('입주민 인증','세대 정보는 인증에만 사용하며 화면에 정확한 동·호수를 공개하지 않습니다.','<button class="ghost-btn" data-route="my">나가기</button>')}<div class="stepper">${steps.map((s,i)=>`<div class="step ${i+1===step?'active':i+1<step?'done':''}"><span>${s}</span></div>`).join('')}</div><div class="form-card">${verifyStepContent(step)}<div class="form-actions"><button class="ghost-btn" data-action="verify-prev" ${step===1?'disabled':''}>이전</button><button class="primary-btn" data-action="verify-next">${step===6?'마이페이지로':'다음'}</button></div></div>`}
function verifyStepContent(step){if(step===1)return `<h2 style="margin-top:0">단지 선택</h2><div class="field"><label>아파트 단지</label><select><option>방림명지로드힐</option></select><span class="help">첫 파일럿 단지로 선택되어 있습니다.</span></div>`;if(step===2)return `<h2 style="margin-top:0">동·호 입력</h2><div class="form-grid"><div class="field"><label>동</label><input value="101" inputmode="numeric"></div><div class="field"><label>호</label><input value="000" inputmode="numeric"></div></div><div class="info-box">동·호 정보는 다른 주민에게 공개되지 않습니다.</div>`;if(step===3)return `<h2 style="margin-top:0">세대별 가입코드</h2><div class="field"><label>가입코드</label><input value="DANJION-2026" maxlength="20"><span class="help">관리주체가 발급한 세대별 코드를 입력합니다.</span></div>`;if(step===4)return `<h2 style="margin-top:0">휴대전화 인증</h2><div class="form-grid"><div class="field"><label>휴대전화 번호</label><input value="010-0000-0000"></div><div class="field"><label>인증번호</label><input value="482913"></div></div><button class="secondary-btn" style="margin-top:13px" data-action="toast" data-msg="인증번호를 다시 보냈습니다.">인증번호 재전송</button>`;if(step===5)return `<h2 style="margin-top:0">공개범위 선택</h2>${['인증 입주민으로만 표시','동까지 공개','별명 사용','실명 사용'].map((x,i)=>`<label class="survey-option"><input type="${i<2?'radio':'checkbox'}" ${x==='인증 입주민으로만 표시'||x==='별명 사용'?'checked':''}><span>${x}</span></label>`).join('')}`;return `<div style="text-align:center;padding:28px 10px"><div class="avatar" style="width:84px;height:84px;font-size:34px">✓</div><h2>입주민 인증 완료</h2><p>방림명지로드힐 인증 입주민 배지가 부여되었습니다.</p><span class="verification-chip">✓ 방림명지로드힐 인증 입주민</span></div>`}
function renderAdmin(){return `<div class="admin-banner"><div><h1>공식 계정 관리 · 입주자대표회의</h1><p>다른 공식 조직의 게시물은 수정할 수 없으며, 모든 변경 이력이 보존됩니다.</p></div><span class="verification-chip" style="background:white">권한: 회장</span></div><div class="admin-tools"><button class="primary-btn" data-route="admin-notice">공식 공지 작성</button><button class="secondary-btn" data-route="admin-agenda">안건·의결 등록</button><button class="secondary-btn" data-action="office-admin-demo">관리사무소 공지</button><button class="secondary-btn" data-route="admin-survey">설문 생성</button><button class="ghost-btn" data-action="official-state">공식 글 상태변경</button></div><div class="admin-grid"><div class="admin-stat"><span>미처리 주민제안</span><strong>4</strong></div><div class="admin-stat"><span>답변 대기 질문</span><strong>2</strong></div><div class="admin-stat"><span>신고 검토</span><strong>3</strong></div><div class="admin-stat"><span>가게 등록 검수</span><strong>2</strong></div></div><div class="grid-2"><div class="activity-panel"><div class="panel-head"><h3>처리 업무</h3></div><div class="activity-item"><div><h4><button data-route="admin-proposals" style="border:0;background:transparent;padding:0;font-weight:750">주민제안 처리</button></h4><p>접수 1 · 검토 3</p></div></div><div class="activity-item"><div><h4><button data-route="admin-questions" style="border:0;background:transparent;padding:0;font-weight:750">주민 질문 답변</button></h4><p>답변 대기 2</p></div></div><div class="activity-item"><div><h4><button data-route="admin-reports" style="border:0;background:transparent;padding:0;font-weight:750">게시물 신고 검토</button></h4><p>개인정보 1 · 비방 1 · 기타 1</p></div></div><div class="activity-item"><div><h4><button data-route="admin-shops" style="border:0;background:transparent;padding:0;font-weight:750">가게 등록 검수</button></h4><p>주민 운영 확인 2</p></div></div></div><div class="activity-panel"><div class="panel-head"><h3>최근 공식 기록</h3></div>${news.slice(0,4).map(n=>`<div class="activity-item"><div><h4>${n.title}</h4><p>${n.source} · ${n.date}</p></div></div>`).join('')}</div></div>`}
function renderAdminForm(type){const map={notice:['공식 공지 작성','입주자대표회의 공식','공지 중요도와 첨부자료, 공개시각을 설정합니다.'],agenda:['입대의 안건·의결 등록','입주자대표회의 공식','회의 안건과 의결 결과를 분리해 기록합니다.'],office:['관리사무소 공지 작성','관리사무소 공식','관리사무소 권한으로만 게시할 수 있는 생활 안내입니다.'],survey:['주민설문 생성','입주자대표회의 공식','의견수렴용 설문과 공식 전자투표 안내를 구분합니다.']};const [title,org,desc]=map[type];return `${pageHead(title,desc,'<button class="ghost-btn" data-route="admin">관리 홈</button>')}<div class="admin-banner"><div><h1>${org}</h1><p>현재 권한으로 작성 가능한 공식 조직입니다.</p></div></div><form class="form-card" id="admin-form"><div class="form-grid"><div class="field"><label>${type==='survey'?'설문 유형':'게시 유형'}</label><select>${type==='survey'?'<option>주민 의견조사</option><option>시설 수요조사</option><option>행사 참석조사</option>':'<option>일반</option><option>중요</option><option>긴급</option><option>일정</option><option>결과보고</option>'}</select></div><div class="field"><label>공개 범위</label><select><option>인증 입주민 전체</option><option>전체 공개</option></select></div><div class="field full"><label>제목</label><input required placeholder="제목을 입력하세요"></div><div class="field full"><label>내용</label><textarea required placeholder="공식 기록으로 남을 내용을 작성하세요"></textarea></div>${type==='survey'?'<div class="field full"><label>선택지</label><input value="선택지 1, 선택지 2, 선택지 3"><span class="help">이 설문은 공식 전자투표가 아니라는 안내가 자동 표시됩니다.</span></div>':'<div class="field"><label>첨부자료</label><button type="button" class="ghost-btn" data-action="upload-demo">파일 선택</button></div><div class="field"><label>게시 시각</label><input type="datetime-local" value="2026-08-04T09:30"></div>'}</div><div class="form-actions"><button type="button" class="ghost-btn" data-route="admin">취소</button><button class="primary-btn" type="submit">검토 후 게시</button></div></form>`}
function renderAdminProposals(){const statuses=['접수','확인 중','관리사무소 전달','입대의 검토','안건 상정 예정','반영','미반영','처리 완료'];return `${pageHead('주민제안 처리','담당 조직과 처리상태, 공개 답변과 미반영 사유를 기록합니다.','<button class="ghost-btn" data-route="admin">관리 홈</button>')}<table class="admin-table"><thead><tr><th>제안</th><th>현재 상태</th><th>담당</th><th>상태 변경</th></tr></thead><tbody>${proposals.map(p=>`<tr><td><strong>${p.title}</strong><br><small>${p.date}</small></td><td><span class="status ${statusClass(p.id===1?state.proposalStatus:p.status)}">${p.id===1?state.proposalStatus:p.status}</span></td><td>${p.field==='시설'?'관리사무소 → 입대의':'입대의'}</td><td><select class="proposal-status" data-id="${p.id}">${statuses.map(s=>`<option ${s===(p.id===1?state.proposalStatus:p.status)?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table><div class="form-card" style="margin-top:16px"><h2 style="margin-top:0">공개 답변</h2><div class="field"><textarea placeholder="처리 결과, 일정, 미반영 시 구체적인 사유를 작성합니다."></textarea></div><div class="form-actions"><button class="primary-btn" data-action="save-proposal">상태와 답변 저장</button></div></div>`}
function renderAdminQuestions(){return `${pageHead('주민 질문 답변','답변 조직과 확인 상태를 명시하고 추가 확인이 필요하면 상태를 남깁니다.','<button class="ghost-btn" data-route="admin">관리 홈</button>')}<table class="admin-table"><thead><tr><th>질문</th><th>답변 희망</th><th>상태</th><th>작업</th></tr></thead><tbody>${questions.map(q=>`<tr><td>${q.title}</td><td>${q.org}</td><td><span class="status ${statusClass(q.status)}">${q.status}</span></td><td><button class="secondary-btn small-btn" data-action="answer-question" data-id="${q.id}">답변</button></td></tr>`).join('')}</tbody></table>`}
function renderAdminReports(){const cases=[['주민글 개인정보 포함 의심','개인정보','확인 중'],['댓글 특정인 비방 신고','비방','확인 중'],['장터글 중복등록','기타','접수']];return `${pageHead('게시물 신고 검토','삭제보다 비공개 처리, 수정 요청, 사유 기록을 우선합니다.','<button class="ghost-btn" data-route="admin">관리 홈</button>')}<table class="admin-table"><thead><tr><th>신고 대상</th><th>유형</th><th>상태</th><th>조치</th></tr></thead><tbody>${cases.map((c,i)=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td><span class="status st-review">${c[2]}</span></td><td><button class="secondary-btn small-btn" data-action="review-report" data-id="${i}">검토</button></td></tr>`).join('')}</tbody></table>`}
function renderAdminShops(){const rows=[['단지온 홈케어','방림명지로드힐 주민 운영','관계 확인 대기'],['푸른정원 클래스','이웃 단지 주민 운영','자료 보완 요청']];return `${pageHead('가게 등록 검수','주민 관계등급을 확인하되 서비스 품질 보증으로 표현하지 않습니다.','<button class="ghost-btn" data-route="admin">관리 홈</button>')}<table class="admin-table"><thead><tr><th>가게·서비스</th><th>신청 관계</th><th>상태</th><th>검수</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="status st-review">${r[2]}</span></td><td><button class="primary-btn small-btn" data-action="shop-review" data-id="${i}">승인·반려</button></td></tr>`).join('')}</tbody></table>`}
function renderRoute(){const r=state.route;if(r==='home')return renderHome();if(r==='news')return renderNews();if(r.startsWith('notice-'))return renderNotice(+r.split('-')[1]);if(r==='council')return renderCouncil();if(r.startsWith('meeting-'))return renderMeeting(+r.split('-')[1]);if(r==='management')return renderManagement();if(r==='issues')return renderIssues();if(r.startsWith('issues-'))return renderIssue(+r.split('-')[1]);if(r==='plaza')return renderPlaza();if(r.startsWith('plaza-')&&r!=='plaza-create')return renderPost(+r.split('-')[1]);if(r==='plaza-create')return renderPostCreate();if(r==='proposals')return renderProposals();if(r==='proposal-create')return renderProposalCreate();if(r.startsWith('proposal-'))return renderProposal(+r.split('-')[1]);if(r==='questions')return renderQuestions();if(r==='surveys')return renderSurveys();if(r==='market')return renderMarket();if(r.startsWith('shop-'))return renderShop(+r.split('-')[1]);if(r==='benefits')return renderBenefits();if(r==='business-register')return renderBusinessRegister();if(r==='bazaar')return renderBazaar();if(r==='my')return renderMy();if(r==='verify')return renderVerify();if(r==='admin')return renderAdmin();if(r==='admin-notice')return renderAdminForm('notice');if(r==='admin-agenda')return renderAdminForm('agenda');if(r==='admin-office')return renderAdminForm('office');if(r==='admin-survey')return renderAdminForm('survey');if(r==='admin-proposals')return renderAdminProposals();if(r==='admin-questions')return renderAdminQuestions();if(r==='admin-reports')return renderAdminReports();if(r==='admin-shops')return renderAdminShops();return renderHome()}
function render(){document.getElementById('app').innerHTML=renderRoute();updateNav();bindForms()}

function bindForms(){const pf=document.getElementById('post-form');if(pf)pf.onsubmit=e=>{e.preventDefault();toast('주민 게시글이 등록됐습니다.','success');navigate('plaza')};const pr=document.getElementById('proposal-form');if(pr)pr.onsubmit=e=>{e.preventDefault();toast('주민제안이 접수됐습니다.','success');navigate('proposal-1')};const af=document.getElementById('admin-form');if(af)af.onsubmit=e=>{e.preventDefault();toast('공식 게시물 검토본이 저장됐습니다.','success');navigate('admin')}}

if(a==='reset-news'){state.newsSource='전체';state.newsPriority='전체';state.newsQuery='';render();toast('공지 필터를 초기화했습니다.');return}
if(a==='office-admin-demo'){showModal('조직별 권한 확인','<div class="info-box"><strong>현재 계정: 입주자대표회의 공식</strong><br>관리사무소 공지는 현재 계정에서 작성하거나 수정할 수 없습니다.</div><p>아래 버튼은 별도 관리사무소 공식 계정으로 접속했을 때의 작성 화면을 시연합니다.</p>','<button class="ghost-btn" data-action="close-modal">취소</button><button class="primary-btn" data-route="admin-office">관리사무소 권한 화면</button>');return}

if(a==='submit-contact'){document.getElementById('modal-root').innerHTML='';toast('가게에 문의를 보냈습니다.','success');return}

if(a==='verify-next'){if(state.verifyStep<6){state.verifyStep++;render()}else navigate('my');return}
if(a==='my-tab'){state.myTab=btn.dataset.value;render();return}
if(a==='upload-demo'){toast('시연용 파일 선택 상태를 표시했습니다.');btn.textContent='파일 선택됨';return}

if(a==='bazaar-write'){showModal('장터·나눔 글 등록','<div class="field"><label>유형</label><select><option>나눔</option><option>판매</option><option>공동구매 수요</option></select></div><div class="field" style="margin-top:12px"><label>제목</label><input placeholder="물품이나 공동구매 내용을 입력하세요"></div><div class="field" style="margin-top:12px"><label>내용</label><textarea placeholder="상태, 수령 방법, 가격을 작성해 주세요."></textarea></div>','<button class="ghost-btn" data-action="close-modal">취소</button><button class="primary-btn" data-action="submit-bazaar">등록</button>');return}

if(a==='toast'){toast(btn.dataset.msg||'기능이 실행됐습니다.');return}
});
document.addEventListener('change',e=>{if(e.target.id==='news-source'){state.newsSource=e.target.value;render()}if(e.target.id==='news-priority'){state.newsPriority=e.target.value;render()}if(e.target.id==='plaza-category'){state.plazaCategory=e.target.value;render()}if(e.target.id==='shop-relation'){state.shopRelation=e.target.value;render()}if(e.target.classList.contains('proposal-status')){if(+e.target.dataset.id===1)state.proposalStatus=e.target.value;toast('상태가 변경됐습니다. 저장하면 주민 화면에 반영됩니다.')}});
document.addEventListener('input',e=>{if(e.target.id==='news-query'){state.newsQuery=e.target.value;clearTimeout(window.__nq);window.__nq=setTimeout(render,250)}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h){state.route=h;render()}});
state.route=location.hash.slice(1)||'home';render();
</script>
